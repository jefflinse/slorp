  const needs = activeItems().filter(i => i.effort === e.id).sort(byUrgency);
  const real = e.id !== 'unsorted';
  const stands = !real ? `Nothing here is filed under an effort. Move a session to an effort and Slorp can remember its directory.${modelless() ? ` ${NO_MODEL}, so sessions are filed only by an effort's directories or by you.` : ''}`
    : !sess.length ? 'No open sessions are filed here right now.'
    : e.stands || (modelless() ? `${NO_MODEL} to write this.` : 'Not written yet.');
  return `<div class="inner">
    <div class="crumb"><span class="mono">${esc(e.raw)}</span></div>
    <h1>${esc(e.name)}</h1>
    ${e.about ? `<p class="lede" style="margin-bottom:0">${esc(e.about)}</p>` : ''}
    <div class="sec"><div class="label"><span>${real && e.stands && sess.length ? spark : ''}Where this stands</span></div><p class="prose">${esc(stands)}</p></div>
    <div class="sec"><div class="label"><span>Needs you (${needs.length})</span></div>
      ${needs.length ? `<div style="margin:0 -18px">${needs.map(i => rowHtml(i, 'openItem')).join('')}</div>` : '<div class="none">Nothing. This is moving without you, or not moving at all.</div>'}</div>
    <div class="sec"><div class="label"><span>Sessions (${sess.length})</span>${starting === e.id ? '' : `<button data-act="startOpen" data-id="${e.id}">Start one ›</button>`}</div>
      ${starting === e.id ? startForm(e) : ''}
      ${sess.length ? sess.map(x => `<div class="srow"><span class="dot ${(LIVE_STATUS[x.status] || LIVE_STATUS.idle)[0]}"></span>
        <div class="body"><div class="ttl">${esc(clip(x.label, 90))}</div>
          ${x.insight?.title ? `<div class="sub">${esc(clip(x.insight.title, 90))}</div>` : ''}
          <div class="sub">${(LIVE_STATUS[x.status] || LIVE_STATUS.idle)[1]} · <span class="mono">${esc(shortPath(x.cwd))}</span>${x.effortVia ? ` · ${VIA[x.effortVia]}` : ''}</div></div>
        ${roleChip(x)}${moveSelect(x)}</div>`).join('') : '<div class="none">None.</div>'}</div>
    ${real ? `<div class="sec"><div class="label"><span>Open questions (${knowledge.questions.filter(q => q.effort === e.id).length})</span><button data-act="kbGo" data-s="questions">Manage ›</button></div>
      ${knowledge.questions.filter(q => q.effort === e.id).map(q => `<div class="srow"><div class="body">${esc(q.text)}</div><span class="side">${ago(minsSince(q.at))}</span></div>`).join('') || '<div class="none">None recorded.</div>'}</div>
    ${knowledge.watch.some(w => w.efforts.includes(e.id)) ? `<div class="sec"><div class="label"><span>Watching</span><button data-act="kbGo" data-s="watch">Manage ›</button></div>
      ${knowledge.watch.filter(w => w.efforts.includes(e.id)).map(w => `<div class="srow"><div class="body"><b>${esc(w.name)}</b><div class="sub">${esc(w.why)}</div></div></div>`).join('')}</div>` : ''}` : ''}
    ${real ? `<div class="sec"><div class="label"><span>Directories filed here automatically</span></div>
      ${e.dirs.length ? e.dirs.map(d => `<div class="none mono">${esc(tilde(d))}</div>`).join('') : '<div class="none">None yet. Move a session here and choose to remember its directory.</div>'}</div>
    <div class="bar" style="margin-top:34px"><button class="btn quiet" data-act="effortDelete" data-id="${e.id}">Delete this effort</button></div>` : ''}
  </div>`;
}

function viewEffortsLive() {
  const all = liveEfforts.concat(live.some(s => !s.effort) || liveItems.some(i => i.effort === 'unsorted') || !liveEfforts.length ? [LIVE_UNSORTED] : []);
  if (!all.some(e => e.id === state.effortSel)) state.effortSel = all[0].id;
  const rows = all.map(e => {
    const n = activeItems().filter(i => i.effort === e.id).length, total = live.filter(s => (s.effort || 'unsorted') === e.id).length;
    return `<button class="erow ${e.id === state.effortSel ? 'sel' : ''}" data-act="effortSel" data-id="${e.id}">
      ${title(e, 't')}${state.fluent && e.line && total ? `<span class="l">${esc(e.line)}</span>` : ''}
      <span class="m">${n ? `<b>${n} need${n === 1 ? 's' : ''} you</b>` : '<span>nothing needs you</span>'}<span>${total} session${total === 1 ? '' : 's'}</span></span>
    </button>`;
  }).join('');
  return `<div class="split">
    <section class="pane list" data-scroll="eff-list"><div class="listbar"><span class="label">Work efforts</span></div>${rows}
      <form class="add" data-form="effort" style="padding:16px 18px;border-top:0">
        <input name="name" data-keep="effort-name" placeholder="New effort, e.g. Snapshot store" required style="flex-basis:100%">
        <input name="about" data-keep="effort-about" placeholder="One line on what it covers" style="flex-basis:100%">
        <button class="btn go">Add effort</button>
        <p class="none" style="width:100%">${modelless() ? `${NO_MODEL}, so sessions are filed by an effort's directories or by you.` : liveEfforts.length ? 'The description is what the model reads when it files sessions.' : 'Declare an effort and Slorp will start filing sessions under it.'}</p>
      </form></section>
    <section class="pane detail" data-scroll="eff-${state.effortSel}">${effortDetailLive(effortById(state.effortSel))}</section>
  </div>`;
}

function viewEfforts() {
  if (live) return viewEffortsLive();
  const all = EFFORTS.concat(UNSORTED);
  const rows = all.map(e => {
    const n = activeMockItems().filter(i => effortOf(i) === e.id).length;
    const live = SESSIONS.filter(s => sessEffort(s) === e.id && s.status === 'running').length;
    const total = SESSIONS.filter(s => sessEffort(s) === e.id).length;
    return `<button class="erow ${e.id === state.effortSel ? 'sel' : ''}" data-act="effortSel" data-id="${e.id}">
      ${title(e, 't')}${state.fluent ? `<span class="l">${esc(e.line)}</span>` : ''}
      <span class="m">${n ? `<b>${n} need${n === 1 ? 's' : ''} you</b>` : '<span>nothing needs you</span>'}<span>${total} session${total === 1 ? '' : 's'}, ${live ? live : 'none'} running</span></span>
    </button>`;
  }).join('');
  return `<div class="split">
    <section class="pane list" data-scroll="eff-list"><div class="listbar"><span class="label">Work efforts</span></div>${rows}</section>
    <section class="pane detail" data-scroll="eff-${state.effortSel}">${effortDetail(effortById(state.effortSel))}</section>
  </div>`;
}

/* ───────────────────────── Activity ───────────────────────── */

/* The Activity list: the sessions in two parts that fold, each a run of rows, beside the page of the one selected. */
function activityView(parts, detail, side = '') {
  const rows = ['long', 'short'].map(as => `<button class="${(state.rows || 'long') === as ? 'on' : ''}" data-act="rows" data-as="${as}">${cap(as)}</button>`).join('');
  const list = parts.map(([key, name, n, line, html]) => {
    const shut = state.collapsed['act:' + key];
    return `<div class="ghead"><button class="name" data-act="collapse" data-key="act:${key}"><span class="chev ${shut ? 'shut' : ''}">▼</span> ${name}</button><span class="n">${n}</span></div>
      ${shut ? '' : `${line ? `<div class="gline">${line}</div>` : ''}${html}`}`;
  }).join('');
  return `<div class="split ${side ? 'sided' : ''} ${side && state.sideShut ? 'shut' : ''}">
    <section class="pane list" data-scroll="act-list">
      <div class="listbar"><span class="label">Sessions</span><span class="segs"><span class="seg" role="group" aria-label="How much each row shows" title="Short rows show only the name, how it stands, and what it is doing.">${rows}</span></span></div>
      ${list}
    </section>
    <section class="pane detail" data-scroll="act-${state.actSel}">${detail || '<div class="empty">No session is selected.</div>'}</section>
    ${side}
  </div>`;
}
/* The ids of the sessions the Activity list shows, top to bottom, given those of its two parts. */
const actShown = (active, closed) => (state.collapsed['act:active'] ? [] : active).concat(state.collapsed['act:closed'] ? [] : closed);
const stat = (dot, word) => `<span class="stat"><span class="dot ${dot}"></span>${word}</span>`;

function viewActivity() {
  if (live) return viewActivityLive();
  const [active, closed] = mockActivity();
  const all = active.concat(closed);
  if (!all.some(s => s.id === state.actSel)) state.actSel = actShown(active, closed).map(s => s.id)[0] || null;
  const row = s => `<button class="row ${s.id === state.actSel ? 'sel' : ''}" data-act="actSel" data-id="${s.id}" style="${kindColor(s.kind)}">
      <span class="h">${title(s, 't')}<span class="w"><span>${ago(s.last)}</span>${stat(s.status, STATUS[s.status])}</span></span>
      ${state.fluent ? `<span class="st">${esc(s.doing)}</span>` : ''}
      ${state.rows === 'short' ? '' : `<span class="m">${kindBadge(s.kind)}<span>${esc(effortById(sessEffort(s)).name)}</span></span>`}
    </button>`;
  const count = k => active.filter(s => s.status === k).length;
  const s = all.find(x => x.id === state.actSel), it = s && activeMockItems().find(i => i.session === s.id);
  const detail = s && `<div class="inner">
    <div class="crumb"><button class="eff" data-act="effort" data-id="${sessEffort(s)}">${esc(effortById(sessEffort(s)).name)} ›</button>${kindBadge(s.kind)}${stat(s.status, STATUS[s.status])}<span>active ${ago(s.last)}</span><span>started ${ago(s.started)}</span><span class="mono">${esc(s.where)}</span></div>
    <h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? s.title : s.raw)}</h1>
    ${state.fluent ? `<p class="subt">${spark}${esc(s.doing)}</p>` : ''}
    ${it ? `<div class="need"><div class="label">${spark}What's needed from you</div><p class="ask">${esc(it.ask)}</p><div class="replies"><button class="btn go" data-act="openItem" data-id="${it.id}">Answer it under Attention ›</button></div></div>` : ''}
    <div class="sec"><div class="label"><span>Its last output, verbatim</span></div>${rawBlock(s.tail.map(t => ['last output', t]))}</div>
  </div>`;
  return activityView([
    ['active', 'Active', active.length, `${spark}${cap(num(count('waiting')))} awaiting you, ${num(count('error'))} failed overnight, and the rest are getting on with it.`, active.map(row).join('')],
    ['closed', 'Closed', closed.length, '', closed.map(row).join('')],
  ], detail);
}
/* The demo's sessions as Activity lists them: those still going, the latest to do anything first, and those finished. */
function mockActivity() {
  const recent = (a, b) => a.last - b.last;
  return [SESSIONS.filter(s => s.status !== 'done').sort(recent), SESSIONS.filter(s => s.status === 'done').sort(recent)];
}

/* ───────────────────────── Live sessions ─────────────────────────
   Present only when the page is served by the slorp service. `live` is the
   service's session list; everything outside Activity is still mock data. */

let live = null, liveItems = [], liveEfforts = [], summarizer = {}, settings = {}, isOffline = false;
let knowledge = { watch: [], questions: [], context: [], routing: [], roles: [] }, integrations = [], lookups = [], feeds = {}, pulls = [], limits = [], wrapups = {}, archive = [], plugins = {}, archiveDocs = {};
/* Fetches a closed session's timeline, once per time it closes. */
const archiveAsked = {};
function fetchArchived(id) {
  const listed = archive.find(a => a.id === id);
  if (!listed || archiveAsked[id] || (archiveDocs[id] && archiveDocs[id].endedAt === listed.endedAt)) return;
  archiveAsked[id] = true;
  fetch(`/api/archive/${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : null).then(doc => { delete archiveAsked[id]; if (doc) { archiveDocs[id] = doc; render(); } })
    .catch(() => { delete archiveAsked[id]; });
}
const LIVE_STATUS = { waiting: ['waiting', 'awaiting you'], failed: ['error', 'failed'], working: ['running', 'working'], idle: ['idle', 'idle'], done: ['done', 'finished'] };
const minsSince = iso => Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
const tilde = p => p.replace(/^\/Users\/[^/]+/, '~');
const shortPath = p => { const t = tilde(p); return t.length > 44 ? '…/' + t.split('/').slice(-2).join('/') : t; };
const clip = (t, n) => t.length > n ? t.slice(0, n) + '…' : t;
const srcOf = s => `${KINDS[s.agent] || s.agent} ${s.kind === 'background' ? 'background session' : 'session'}`;
const rawOf = s => `${s.agent} · ${shortPath(s.cwd)} · ${s.id.slice(0, 8)}`;
const statusOf = s => LIVE_STATUS[s.status] || LIVE_STATUS.idle;
/* The item a session has under Attention, while the user has yet to deal with it. */
const itemOf = s => liveItems.find(i => i.session && i.session.id === s.id && isActive(i));

async function refresh(force) {
  try {
    const res = await fetch('/api/sessions');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    live = data.sessions;
    liveEfforts = (data.efforts || []).map(e => ({ ...e, raw: e.dirs.length ? e.dirs.map(tilde).join(', ') : `effort ${e.id}` }));
    liveItems = toItems(data);
    summarizer = data.summarizer || {};
    if (summarizer.model) delete state.modelNoticeOff;
    settings = data.settings || {};
    knowledge = { roles: [], ...(data.knowledge || knowledge) };
    integrations = data.integrations || [];
    lookups = data.lookups || [];
    feeds = data.feeds || {};
    pulls = data.pullRequests || [];
    limits = data.limits || [];
    wrapups = data.wrapups || {};
    archive = data.archive || [];
    plugins = data.plugins || {};
    isOffline = false;
    announce(liveItems);
  } catch (e) { isOffline = live !== null; }
  render();
}

/* Server items take the mock items' shape so the Attention pane draws both.
   An item with a source came from an integration's feed and has no session. */
function toItems(data) {
  const byId = Object.fromEntries(data.sessions.map(s => [s.id, s]));
  return (data.items || []).filter(i => i.source || byId[i.sessionId]).map(i => {
    if (i.source) return { ...i, live: true, feed: true, effort: i.effort || 'unsorted', kind: i.source, itemKind: i.kind,
      src: KINDS[i.source] || i.source, raw: `${i.source} · ${i.repo} · ${i.kind}` };
    const s = byId[i.sessionId];
    return { ...i, live: true, session: s, effort: s.effort || 'unsorted', kind: s.agent, itemKind: i.kind, src: srcOf(s), raw: rawOf(s) };
  });
}

function api(method, path, body, done) {
  fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) })
    .then(res => { if (!res.ok) throw new Error(res.status); if (done) done(); refresh(true); })
    .catch(() => toast('Could not reach the Slorp service'));
}

/* Asks the service to do something outside itself, and says why when it could not. */
/* Says when Claude Code lacks the Slorp mod, and offers to put that right. */
let installing = false;
function modNotice() {
  const p = plugins.claude;
  if (!live || !p || (p.installed && p.enabled)) return '';
  const off = p.installed;
  return `<div><span>${off ? 'The Slorp mod is turned off in Claude Code' : "Claude Code doesn't have the Slorp mod"}, so its sessions can be watched here but not answered.</span>
    <button class="btn go" data-act="installMod" ${installing ? 'disabled' : ''}>${installing ? (off ? 'Turning it on…' : 'Installing…') : off ? 'Turn it on' : 'Install it'}</button></div>`;
}

/* Whether Slorp is running with no local model: one was looked for and not
   found, or Slorp was started without. False until it has looked. */
const modelless = () => !!live && !summarizer.model && !!(summarizer.off || summarizer.error);
const NO_MODEL = 'No local model is running';
/* What is missing without one and why there is none; in full adds how soon one is noticed. */
function modelWhy(full) {
  const where = summarizer.url ? ` at ${summarizer.url}` : '';
  const how = summarizer.off ? 'Slorp was started without one.'
    : /unreachable/.test(summarizer.error) ? `Slorp looks for an LLM server${where}.`
    : `The LLM server${where} answered, but ${summarizer.error.replace(/^it /, '')}.`;
  return `${NO_MODEL}, so sessions are shown as they are: no summaries, suggested replies, automatic filing or wrap-ups. ${how}${full && !summarizer.off && !/-model/.test(summarizer.error) ? ' It notices a loaded model within half a minute.' : ''}`;
}
/* Says so once, until dismissed, when a model was looked for and not found. */
function modelNotice() {
  if (!modelless() || summarizer.off || state.modelNoticeOff) return '';
  return `<div><span title="${esc(modelWhy(true))}">${esc(modelWhy())}</span><button class="btn" data-act="modelNoticeOff">Dismiss</button></div>`;
}

function ask(path, body, done, always) {
  fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(async res => { if (!res.ok) throw new Error((await res.text()).trim() || res.status); if (done) done(); })
    .catch(err => toast(err instanceof TypeError ? 'Could not reach the Slorp service' : `That did not work: ${err.message}`))
    .finally(() => { if (always) always(); refresh(true); });
}

function sendReply(sessionId, text, done) {
  fetch(`/api/sessions/${sessionId}/reply`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })
    .then(res => { if (!res.ok) throw new Error(res.status); done(); })
    .catch(() => toast('Could not reach the Slorp service'));
}

/* The lesser things to do with an item, behind one button beside its title.
   actsFor is the item whose menu is open, and actsSub the part of it that is. */
let actsFor = null, actsSub = null;
const menuPart = (key, name, rows) => `<details data-sub="${key}" ${actsSub === key ? 'open' : ''}><summary>${name}<span>›</span></summary><div>${rows}</div></details>`;
const menuTo = (act, id, list) => list.map(([to, name]) => `<button data-act="${act}" data-id="${id}" data-to="${to}">${esc(name)}</button>`).join('');
const actsMenu = (id, about, rows) => `<details class="menu acts" id="acts" data-id="${id}" ${actsFor === id ? 'open' : ''}><summary class="icon" title="${about}" aria-label="More to do with this">⋯</summary>
    <div class="pop">${rows}</div></details>`;
function itemMenu(it, more) {
  return actsMenu(it.id, 'Snooze, dismiss, move and more', `${menuPart('snooze', 'Snooze', `<button data-act="snooze" data-id="${it.id}" data-for="hour">For an hour</button><button data-act="snooze" data-id="${it.id}" data-for="tomorrow">Until tomorrow</button>`)}
      <button data-act="dismiss" data-id="${it.id}">Dismiss</button>${more}`);
}
/* The efforts a live session or repository could be filed under other than cur. */
const effortsBut = cur => liveEfforts.concat(LIVE_UNSORTED).filter(e => e.id !== cur).map(e => [e.id, e.name]).concat([['__new', 'New effort…']]);
/* The menu beside a session's title: what can be done with the session, after what can be done with its item, if it has one. */
function sessionMenu(s, it) {
  const roles = knowledge.roles.filter(r => !(r.id === s.role && s.roleVia === 'you')).map(r => [r.id, r.name])
    .concat(s.role || s.roleVia !== 'you' ? [['__none', 'No role']] : [], [['__new', 'New role…']]);
  const rows = `${menuPart('move', 'Move to', menuTo('liveMoveTo', s.id, effortsBut(s.effort || 'unsorted')))}
    ${menuPart('role', s.role && s.roleVia === 'you' ? 'Change role' : 'Role', menuTo('liveRoleTo', s.id, roles))}
    ${s.job ? `<button data-act="stop" data-id="${s.id}" title="Stops this background session. Its conversation is kept, and it can be reopened from the closed sessions under Activity.">Stop session</button>` : ''}`;
  return it ? itemMenu(it, `${s.pending ? '' : `<button data-act="livePark" data-id="${it.id}">Park as open question</button>`}${rows}`)
    : actsMenu(s.id, 'Move, give a role and more', rows);
}
/* The other sessions filed under an effort, as rows, and how many there are. */
const alsoRows = (effort, except) => {
  const others = live.filter(x => x.id !== except && (x.effort || 'unsorted') === effort);
  return { count: others.length, html: others.length ? others.map(x => `<div class="srow"><span class="dot ${(LIVE_STATUS[x.status] || LIVE_STATUS.idle)[0]}"></span>
        <div class="body"><div class="ttl">${esc(clip(x.label, 90))}</div></div>
        <span class="side">${kindBadge(x.agent)} · ${(LIVE_STATUS[x.status] || LIVE_STATUS.idle)[1]}</span></div>`).join('') : '<div class="none">No other sessions here.</div>' };
};
const alsoIn = (effort, except) => `<div class="sec"><div class="label"><span>Also going on in ${esc(effortById(effort).name)}</span></div>
      ${alsoRows(effort, except).html}</div>`;

/* A feed item: nothing to reply to, only somewhere to go. Moving it files its
   whole repository, since that is what the next items from there go by. */
/* The sessions working on the branch a pull request's item is about, each with a box to tell it so. */
function onBranch(it) {
  const p = pulls.find(x => x.url && x.url === it.url), on = p ? sessionsOn(p) : [];
  if (!on.length) return '';
  return `<div class="sec"><div class="label"><span>${on.length === 1 ? 'A session is' : `${cap(num(on.length))} sessions are`} on this branch</span></div>
    ${on.map(s => `<div class="srow"><span class="dot ${(LIVE_STATUS[s.status] || LIVE_STATUS.idle)[0]}"></span>
        <div class="body"><div class="ttl">${esc(clip(s.label, 90))}</div><div class="sub">${(LIVE_STATUS[s.status] || LIVE_STATUS.idle)[1]} · <span class="mono">${esc(s.branch)}</span></div></div>
        <span class="side">${kindBadge(s.agent)}</span></div>
      ${s.canReply
        ? `<div class="livebox">${pullAsks(p, `live-${s.id}`) ? `<div class="replies">${pullAsks(p, `live-${s.id}`)}</div>` : ''}<textarea data-keep="live-${s.id}" placeholder="Tell this session…"></textarea>
            <div class="send"><span>Suggestions fill the box; nothing is sent until you press Send.</span><button class="btn go" data-act="liveSend" data-id="${s.id}">Send</button></div></div>`
        : `<div class="none" style="margin:4px 0 12px">It isn't running the Slorp mod, so tell it in its terminal: <span class="mono">${esc(shortPath(s.cwd))}</span></div>`}`).join('')}</div>`;
}

function feedItemDetail(it) {
  const real = it.effort !== 'unsorted';
  const menu = itemMenu(it, `<button data-act="livePark" data-id="${it.id}">Park as open question</button>
    ${menuPart('move', `File ${esc(it.repo)} under`, menuTo('repoMoveTo', it.id, effortsBut(it.effort)))}`);
  return `<div class="inner">
    <div class="crumb">${real ? `<button class="eff" data-act="effort" data-id="${it.effort}">${esc(effortById(it.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${real && VIA_REPO[it.effortVia] ? `<span>${VIA_REPO[it.effortVia]}</span>` : ''}${kindBadge(it.kind, it.src)}<span>${ago(ageOf(it))}</span><span class="tag ${it.urgency}">${it.urgency}</span><span class="mono">${esc(it.repo)}</span></div>
    <div class="titled"><h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? it.title : it.raw)}</h1>${menu}</div>
    <div class="need"><div class="label">What's needed from you</div><p class="ask">${esc(it.ask)}</p>
      ${/^https:\/\//.test(it.url || '') ? `<div class="replies"><a class="btn go" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Open on ${esc(it.src)} ↗</a>
        <span class="none" style="align-self:center">Slorp only reads ${esc(it.src)}. Anything you do there, you do there.</span></div>` : ''}</div>
    ${onBranch(it)}
    <div class="sec"><div class="label"><span>What's going on</span></div><p class="prose">${esc(it.summary)}</p>
      <div class="none" style="margin-top:8px">As ${esc(it.src)} reported it ${ago(minsSince((feeds[it.source] || {}).at || it.at))}. No model wrote any of this.</div></div>
    ${alsoIn(it.effort, '')}
  </div>`;
}

/* Renders the Markdown an agent wrote. All of it is escaped before any
   markup is added, so nothing in the text becomes markup of its own, and a
   link is made only for an https address. Text cut off mid-block still
   renders: an unclosed code fence runs to the end. */
function md(src) {
  const inline = text => {
    const code = [];
    return esc(text).replace(/`([^`]+)`/g, (_, c) => `\u0000${code.push(c) - 1}\u0000`)
      .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
      .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
      .replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${code[n]}</code>`);
  };
  const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const item = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/, lines = String(src).replace(/\r/g, '').split('\n'), out = [];
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const body = [];
      for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) body.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(body.join('\n'))}</code></pre>`);
    } else if (!line.trim()) {
      i++;
    } else if (/^#{1,6}\s/.test(line)) {
      const [, marks, text] = line.match(/^(#{1,6})\s+(.*)$/);
      out.push(`<h4 class="h${marks.length}">${inline(text)}</h4>`);
      i++;
    } else if (/^\s*([-*_])\s*\1\s*\1[-*_\s]*$/.test(line)) {
      out.push('<hr>');
      i++;
    } else if (/^\s*\|/.test(line) && /^\s*\|?[\s:|-]*-[\s:|-]*$/.test(lines[i + 1] || '')) {
      const head = cells(line), rows = [];
      for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    } else if (item.test(line)) {
      const tag = /^\s*\d/.test(line) ? 'ol' : 'ul', items = [];
      for (; i < lines.length && (item.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length)); i++) {
        const m = lines[i].match(item);
        if (m) items.push([Math.min(4, Math.floor(m[1].length / 2)), m[3]]);
        else items[items.length - 1][1] += ' ' + lines[i].trim();
      }
      out.push(`<${tag}>${items.map(([depth, text]) => `<li${depth ? ` style="margin-left:${depth * 18}px"` : ''}>${inline(text)}</li>`).join('')}</${tag}>`);
    } else if (/^\s*>/.test(line)) {
      const quote = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) quote.push(lines[i].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${quote.map(inline).join('<br>')}</blockquote>`);
    } else {
      const para = [lines[i++]];
      for (; i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|\|)/.test(lines[i]) && !item.test(lines[i]); i++) para.push(lines[i]);
      out.push(`<p>${para.map(inline).join('<br>')}</p>`);
    }
  }
  return `<div class="md">${out.join('')}</div>`;
}

/* What Slorp knows of a session that its page does not otherwise say. */
function aboutSession(s) {
  const fresh = (s.used?.in || 0) + (s.used?.cacheWrite || 0), out = s.used?.out || 0, read = s.used?.cacheRead || 0;
  const facts = [
    ['Directory', `<span class="mono">${esc(tilde(s.cwd))}</span>`],
    s.branch && ['Branch', `<span class="mono">${esc(s.branch)}</span>`],
    ['Agent', `${esc(srcOf(s))}, ${s.canReply ? 'running the Slorp mod' : 'not running the Slorp mod'}`],
    ['Started', `<span title="${esc(new Date(s.startedAt).toLocaleString())}">${ago(minsSince(s.startedAt))}</span>`],
    ['Last active', `<span title="${esc(new Date(s.activeAt).toLocaleString())}">${ago(minsSince(s.activeAt))}</span>`],
    s.model && ['Model', runsOn(s)],
    s.contextTokens && ['Context', contextUse(s)],
    fresh + out > 0 && ['Used', `${tokens(fresh)} tokens sent for the first time and ${tokens(out)} written by the model${read ? `, with another ${tokens(read)} read back from the cache` : ''}${s.costUsd ? `. Its agent puts that at about ${money(s.costUsd)} at list prices` : ''}.`],
    ['Filed under', `${esc(effortById(s.effort || 'unsorted').name)}${s.effort && VIA[s.effortVia] ? `, ${VIA[s.effortVia]}` : ''}`],
    s.role && roleById(s.role) && ['Role', `${esc(roleById(s.role).name)}, ${s.roleVia === 'guess' ? 'guessed by the model' : 'given by you'}`],
    ['Session', `<span class="mono">${esc(s.id)}</span> <button class="link" data-act="copyText" data-text="${esc(s.id)}">copy</button>`],
  ].filter(Boolean);
  const sent = (s.replies || []).map(r => `<div><b>${esc(r.state)}</b> · ${esc(r.text)}</div>`).join('');
  return `<dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${sent ? `<div class="label" style="margin-top:22px">Sent from here</div><div class="livebox"><div class="sent">${sent}</div></div>` : ''}`;
}

/* The tabs under a session: what the agent last said, rendered or as it was
   written, what else is going on in the same effort, and its particulars. */
function detailTabs(s) {
  const effort = s.effort || 'unsorted', others = alsoRows(effort, s.id), on = ['also', 'about'].includes(state.detailTab) ? state.detailTab : 'source';
  const tab = (key, name) => `<button class="label ${on === key ? 'on' : ''}" data-act="detailTab" data-t="${key}">${name}</button>`;
  const shown = state.sourceRaw ? `<div class="rawblock"><div class="tx">${esc(s.lastReply)}</div></div>` : md(s.lastReply);
  const open = state.expanded['said:' + s.id];
  const source = () => `${s.lastPrompt ? `<div class="said ${open ? 'open' : ''}"><div class="label">You said</div><div class="tx">${esc(s.lastPrompt)}</div>
      <button class="link" data-act="expand" data-id="said:${s.id}" hidden>${open ? 'Show less' : 'Show all of it'}</button></div>` : ''}
    ${s.lastReply ? shown : '<div class="none">No response found for this session.</div>'}
    <div class="none mono" style="margin-top:12px">${esc(rawOf(s))}</div>`;
  return `<div class="tabs" role="tablist">${tab('source', 'Most Recent Agent Response')}${tab('also', `Also In ${esc(effortById(effort).name)}<span class="n">${others.count}</span>`)}${tab('about', 'Details')}
      ${on !== 'source' ? '' : `<span class="tools">${s.lastReply ? `<button class="btn" data-act="copyReply" data-id="${s.id}" title="Copy the response as it was written">Copy</button>` : ''}
        <span class="seg" role="group" aria-label="How the response is shown"><button class="${state.sourceRaw ? '' : 'on'}" data-act="sourceRaw" data-on="0">Rendered</button><button class="${state.sourceRaw ? 'on' : ''}" data-act="sourceRaw" data-on="1">Raw</button></span></span>`}</div>
    <div class="tabbody">${on === 'also' ? others.html : on === 'about' ? aboutSession(s) : source()}</div>`;
}

/* The local model's account of a session: beside its page where there is room, within it where there is not.
   Stale says the session has been working since the account was written. */
function goingOn(s, summary, stale) {
  const looked = s.insight?.lookups || [];
  return `<p class="prose">${summary ? esc(summary) : `<span class="none">${modelless() ? `${NO_MODEL}, so this is not summarized. What the session last said is in full on the left.` : 'Not summarized yet.'}</span>`}</p>
    ${summary && stale ? '<div class="none" style="margin-top:8px">Written when it last stopped. It has been working since.</div>' : ''}
    ${looked.length ? `<div class="none" style="margin-top:8px">${spark}Checked ${esc(listOf(looked))} to write this.</div>` : ''}`;
}

/* What the user said in a session, newest first, each with the model's line on how it came out. */
function timeline(s, open) {
  const moments = (s.timeline || []).slice().reverse();
  /* Only an open session whose agent keeps a transcript can have its earlier history read, and only when asked. */
  const fill = !(open && s.agent === 'claude') ? ''
    : s.backfilling ? `<span class="none">${spark}Filling in ${plural(s.backfilling, 'earlier exchange')}…</span>`
    : modelless() ? `<button class="link off" data-act="noop" title="${NO_MODEL} to say how earlier exchanges came out.">Fill in earlier history</button>`
    : `<button class="link" data-act="backfill" data-id="${s.id}" title="Reads this session's transcript and has the local model say how up to forty earlier exchanges came out. It happens only when you ask.">Fill in earlier history</button>`;
  if (!moments.length && !fill) return '';
  return `<div class="label tlhead"><span>Timeline</span>${fill}</div>${moments.length ? (modelless() && moments.some(m => !m.line) ? `<div class="none">${NO_MODEL}, so new entries are only what you said.</div>` : '') : '<div class="none">Nothing has been said in it since Slorp began watching.</div>'}<ol class="tl">${moments.map(m => `<li><span class="when" title="${esc(new Date(m.at).toLocaleString())}">${minsSince(m.at) < 1 ? 'now' : span(minsSince(m.at))}</span>
    <div>${m.line ? `<div class="line" title="${esc(m.summary || '')}">${spark}${esc(m.line)}</div>` : ''}<div class="you" title="${esc(m.prompt)}">${esc(m.prompt)}</div></div></li>`).join('')}</ol>`;
}

/* What a session's page offers for answering it: its item's reply box, else its prompt, else a box to say something. */
function answerBox(s, it) {
  const terminal = `<span class="mono">${esc(shortPath(s.cwd))}</span>`;
  if (s.pending) return pendingBox(s);
  if (s.waitingFor === 'permission prompt') return `<div class="none">Slorp was not shown this permission prompt, so answer it in the session's terminal: ${terminal}</div>`;
  if (!s.canReply) return `<div class="none">This session isn't running the Slorp mod, so ${it ? `answer it in its terminal: ${terminal}` : 'it can be watched but not replied to.'}</div>`;
  const box = it ? `item-${it.id}` : `live-${s.id}`;
  const quick = (it ? it.replies : []).map(r => `<button class="btn" data-act="liveSuggest" data-id="${it.id}" data-text="${esc(r)}">${esc(r)}</button>`).join('');
  const asks = pullAsks(pullOf(s), box);
  return `${quick || asks ? `<div class="replies">${quick}${asks}</div>` : ''}
    <textarea data-keep="${box}" placeholder="${it ? 'Reply to this session…' : 'Say something to this session…'}"></textarea>
    <div class="send"><span>${quick || asks ? `${quick ? spark : ''}Suggestions fill the box; nothing is sent until you press Send.` : 'Arrives as your next message once the session is idle.'}</span>
    <button class="btn go" data-act="${it ? 'liveItemSend' : 'liveSend'}" data-id="${it ? it.id : s.id}">Send</button></div>`;
}

/* A session's page. With the item it has under Attention it leads with what is needed; stands is how it stands, for its first line. */
function sessionPage(s, it, stands) {
  const subtitle = it ? it.subtitle : s.status !== 'working' && s.insight?.title;
  const summary = it ? it.summary : s.insight?.summary;
  const needs = it ? `<div class="label">${it.summary ? spark : ''}What's needed from you</div><p class="ask">${esc(it.ask)}</p>`
    : s.pending ? `<div class="label" style="margin-bottom:10px">${s.pending.question || askedQuestions(s.pending) ? 'Waiting for your answer' : 'Waiting for your permission'}</div>`
    : s.canReply ? '<div class="label">Say something to it</div>' : '';
  return `<div class="inner">
    <div class="crumb">${s.effort ? `<button class="eff" data-act="effort" data-id="${s.effort}">${esc(effortById(s.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${s.effortVia === 'guess' ? `<span>${spark}filed by the model</span>` : ''}${kindBadge(s.agent, srcOf(s))}${roleChip(s)}${stands}${s.branch ? `<span class="mono">${esc(s.branch)}</span>` : ''}${pullChip(s, true)}${s.model ? `<span>${runsOn(s)}</span>` : ''}${contextUse(s)}</div>
    <div class="titled">${renaming === s.id
      ? `<form class="rename" data-form="name" data-id="${s.id}"><input name="name" data-keep="name-${s.id}" value="${esc(s.label)}" maxlength="80" placeholder="Leave empty to go back to its own title" aria-label="Name for this session">
          <button class="btn go">Save</button><button type="button" class="btn" data-act="renameCancel">Cancel</button></form>`
      : `<h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? s.label : rawOf(s))}${state.fluent ? `<button class="pen" data-act="rename" data-id="${s.id}" title="${s.labelVia === 'you' ? 'You named this session. Rename it' : 'Give this session a name of your own'}" aria-label="Rename this session">✎</button>` : ''}</h1>`}${sessionMenu(s, it)}</div>
    ${subtitle && state.fluent ? `<p class="subt">${spark}${esc(subtitle)}</p>` : ''}
    ${it ? '' : roleNote(s)}
    <div class="need ${needs ? '' : 'bare'}">${needs}${answerBox(s, it)}</div>
    <div class="sec going"><div class="label"><span>${summary ? spark : ''}What's going on</span></div>${goingOn(s, summary, !it && s.status === 'working')}</div>
    ${detailTabs(s)}
  </div>`;
}

/* The pane beside a session's page: the model's account of it and its timeline, or the rail that brings them back. */
function sessionSide(s, summary, stale, key) {
  const label = `<span class="label">${summary ? spark : ''}What's going on</span>`;
  return state.sideShut
    ? `<aside class="pane side"><button class="rail" data-act="side" title="Show what's going on" aria-expanded="false"><span>‹</span>${label}</button></aside>`
    : `<aside class="pane side" data-scroll="${key}"><div class="head">${label}<button data-act="side" title="Hide this panel" aria-expanded="true">›</button></div>${goingOn(s, summary, stale)}${timeline(s, true)}</aside>`;
}

function liveItemDetail(it) {
  return it.feed ? feedItemDetail(it) : sessionPage(it.session, it, `<span>${ago(ageOf(it))}</span><span class="tag ${it.urgency}">${it.urgency}</span>`);
}

function connect() {
  if (location.protocol === 'file:') return;
  refresh(true);
  const events = new EventSource('/api/events');
  events.onmessage = () => refresh(false);
  events.onerror = () => { if (live && !isOffline) { isOffline = true; render(); } };
}

/* The questions a session put to the user through its question tool, or
   null when the prompt is not one or its input cannot be read. */
function askedQuestions(p) {
  try {
    const qs = JSON.parse(p.input).questions;
    return Array.isArray(qs) && qs.length && qs.every(q => q && typeof q.question === 'string') ? qs : null;
  } catch (e) { return null; }
}

/* What the user has picked so far for a question prompt: for each of its
   questions by position, the positions of the options picked. */
const picksFor = id => state.picks[id] || {};

/* The questions laid out; with a prompt Slorp may answer, each option is a
   button that picks it. */
function questionBox(qs, p) {
  const picks = p ? picksFor(p.id) : {};
  return qs.map((q, n) => `<div class="asked">${q.header ? `<div class="label">${esc(q.header)}</div>` : ''}
      <p class="q">${esc(q.question)}</p>
      ${(Array.isArray(q.options) ? q.options : []).map((o, i) => {
        const inner = `<span class="k">${i + 1}</span><b>${esc(o.label ?? '')}</b><span>${esc(o.description ?? '')}</span>`;
        return p ? `<button class="opt ${(picks[n] || []).includes(i) ? 'on' : ''}" data-act="pick" data-id="${p.id}" data-q="${n}" data-o="${i}" data-many="${q.multiSelect ? 1 : 0}" aria-pressed="${(picks[n] || []).includes(i)}">${inner}</button>`
          : `<div class="opt">${inner}</div>`;
      }).join('')}
      ${q.multiSelect ? '<div class="none" style="margin-top:6px">More than one may be chosen.</div>' : ''}</div>`).join('');
}

function pendingBox(s) {
  const p = s.pending, qs = askedQuestions(p);
  const inTerminal = `<div class="none" style="margin-top:10px">Answer in the session's terminal. Slorp cannot pick an option for you.</div>`;
  if (qs && p.answerable) {
    const picks = picksFor(p.id), ready = qs.every((q, n) => (picks[n] || []).length);
    return `${questionBox(qs, p)}<div class="replies" style="margin-top:12px">
      <button class="btn go" data-act="liveAnswer" data-id="${p.id}" ${ready ? '' : 'disabled'}>Send answer</button>
      <span class="none" style="align-self:center">${ready ? 'The terminal is asking too; whichever you answer first decides.' : `Pick an option for ${qs.length === 1 ? 'the question' : 'each question'}. To type something else, answer in the terminal.`}</span></div>`;
  }
  if (qs) return questionBox(qs) + inTerminal;
  if (p.question) return `<div class="asked"><p class="q" style="white-space:pre-wrap">${esc(p.input || p.summary)}</p></div>${inTerminal}`;
  const what = `<div class="rawblock" style="margin-bottom:10px;max-height:280px;overflow:auto"><div class="who" style="margin-bottom:4px">${esc(p.tool)}</div><div class="tx">${esc(p.input || p.summary)}</div></div>`;
  if (!p.answerable) return `${what}<div class="none">Answer this one in the session's terminal.</div>`;
  return `${what}<div class="replies">
      <button class="btn go" data-act="livePermit" data-id="${p.id}" data-behavior="allow">Allow once</button>
      <button class="btn" data-act="livePermit" data-id="${p.id}" data-behavior="deny">Deny</button>
      <span class="none" style="align-self:center">The terminal is asking too; whichever you answer first decides.</span></div>
    <textarea data-keep="deny-${p.id}" placeholder="If you deny, you can tell it why…" style="display:block;width:100%;min-height:44px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical"></textarea>`;
}

/* What a session's row says under its name: what it waits on, else the model's line on it, else what the user last said. */
const doingNow = s => s.pending ? (s.pending.question ? `Asks: ${s.pending.summary}` : `Wants to run ${s.pending.tool}: ${s.pending.summary}`)
  : s.status !== 'working' && s.insight?.title ? s.insight.title : s.lastPrompt ? `You last said: ${s.lastPrompt}` : '';

/* The sessions as Activity lists them: the open ones, the latest to do anything first, and the closed, the latest to close first.
   Open sessions whose ages read the same keep one order between them, so two that are both working do not trade places. */
function liveActivity() {
  const age = s => Math.floor(minsSince(s.activeAt));
  return [live.slice().sort((a, b) => age(a) - age(b) || new Date(b.startedAt) - new Date(a.startedAt) || a.id.localeCompare(b.id)), archive];
}

function sessionRowLive(s) {
  const long = state.rows !== 'short', sub = doingNow(s), [dot, word] = statusOf(s);
  const name = state.fluent ? `<span class="t">${esc(clip(s.label, 90))}</span>` : `<span class="mono t">${esc(rawOf(s))}</span>`;
  return `<button class="row ${s.id === state.actSel ? 'sel' : ''}" data-act="actSel" data-id="${s.id}" style="${kindColor(s.agent)}">
    <span class="h">${name}<span class="w"><span>${ago(minsSince(s.activeAt))}</span>${stat(dot, word)}</span></span>
    ${state.fluent && sub ? `<span class="st">${esc(clip(sub, 160))}</span>` : ''}
    ${long ? `<span class="m">${kindBadge(s.agent)}${roleChip(s)}${pullChip(s)}${s.effort ? `<span>${esc(effortById(s.effort).name)}</span>` : ''}</span>` : ''}
    ${long && s.model ? `<span class="m"><span>${runsOn(s)}</span>${contextUse(s, true)}</span>` : ''}
  </button>`;
}

function closedRow(a) {
  const name = state.fluent ? `<span class="t">${esc(clip(a.label, 90))}</span>` : `<span class="mono t">${esc(`${a.agent} · ${shortPath(a.cwd || '')} · ${a.id.slice(0, 8)}`)}</span>`;
  return `<button class="row ${a.id === state.actSel ? 'sel' : ''}" data-act="actSel" data-id="${a.id}" style="${kindColor(a.agent)}">
    <span class="h">${name}<span class="w"><span>${ago(minsSince(a.endedAt))}</span></span></span>
    ${state.fluent && a.title ? `<span class="st">${esc(clip(a.title, 160))}</span>` : ''}
    ${state.rows === 'short' ? '' : `<span class="m">${a.agent ? kindBadge(a.agent) : ''}${a.effort ? `<span>${esc(effortById(a.effort).name)}</span>` : ''}</span>`}
  </button>`;
}

/* A closed session's page: how it stood when it closed, a way back into it, and its timeline. */
const shellWord = s => /^[\w./-]+$/.test(s) ? s : `'${s.replace(/'/g, `'\\''`)}'`;
const resumeCommand = a => a.agent === 'claude' && a.cwd ? `cd ${shellWord(a.cwd)} && claude --resume ${shellWord(a.id)}` : '';
function closedPage(a) {
  const doc = archiveDocs[a.id], cmd = resumeCommand(a);
  const ran = a.startedAt ? `<span>open for ${span((new Date(a.endedAt) - new Date(a.startedAt)) / 60000)}</span>` : '';
  return `<div class="inner">
    <div class="crumb">${a.effort ? `<button class="eff" data-act="effort" data-id="${a.effort}">${esc(effortById(a.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${a.agent ? kindBadge(a.agent) : ''}${stat('done', `closed ${ago(minsSince(a.endedAt))}`)}${ran}${a.branch ? `<span class="mono">${esc(a.branch)}</span>` : ''}${a.cwd ? `<span class="mono" title="${esc(a.cwd)}">${esc(shortPath(a.cwd))}</span>` : ''}</div>
    <h1>${esc(a.label)}</h1>
    ${a.title && state.fluent ? `<p class="subt">${spark}${esc(a.title)}</p>` : ''}
    ${cmd ? `<div class="need"><div class="label">Pick it back up</div>
      <div class="cmd"><span class="mono">${esc(cmd)}</span><button class="btn" data-act="copyText" data-text="${esc(cmd)}" title="Copy the command that reopens this session in a terminal">Copy</button></div>
      <div class="replies"><button class="btn go" data-act="reopen" data-id="${a.id}">Reopen in the background</button>
        <span class="none" style="align-self:center">Its conversation is kept. Reopened, it waits for a message.</span></div></div>` : ''}
    <div class="sec"><div class="label"><span>${a.summary ? spark : ''}How it stood</span></div>
      <p class="prose">${a.summary ? esc(a.summary) : `<span class="none">${modelless() ? `${NO_MODEL}, so it was not summarized.` : 'The model wrote nothing about it before it closed.'}</span>`}</p></div>
    ${doc ? timeline(doc) || '<div class="label tlhead"><span>Timeline</span></div><div class="none">Nothing was said in it while Slorp was watching.</div>' : '<div class="none" style="margin-top:28px">Fetching its timeline…</div>'}
  </div>`;
}

function viewActivityLive() {
  const [open, closed] = liveActivity();
  const find = id => open.find(s => s.id === id) || closed.find(a => a.id === id);
  if (!find(state.actSel)) state.actSel = actShown(open, closed).map(x => x.id)[0] || null;
  const sel = find(state.actSel), isOpen = sel && open.includes(sel), it = isOpen && itemOf(sel);
  if (sel && !isOpen) fetchArchived(sel.id);
  const n = k => open.filter(s => s.status === k).length;
  const line = `${open.length ? `${cap(num(n('waiting')))} awaiting you, ${num(n('working'))} working, ${num(n('idle') + n('done') + n('failed'))} quiet.` : 'No agent sessions are open on this machine.'}${isOffline ? ' <b>The Slorp service stopped responding; this is the last it reported.</b>' : ''}`;
  let detail = '', side = '';
  if (isOpen) {
    const [dot, word] = statusOf(sel), stale = !it && sel.status === 'working';
    detail = sessionPage(sel, it, `${stat(dot, sel.waitingFor ? `${word}, ${esc(sel.waitingFor)}` : word)}<span>active ${ago(minsSince(sel.activeAt))}</span>`);
    side = sessionSide(sel, it ? it.summary : sel.insight?.summary, stale, 'act-side');
  } else if (sel) detail = closedPage(sel);
  return activityView([
    ['active', 'Active', open.length, line, open.map(sessionRowLive).join('')],
    ['closed', 'Closed', closed.length, closed.length ? 'Each as it stood when it closed.' : 'Sessions are kept here once they close.', closed.map(closedRow).join('')],
  ], detail, side);
}

const plural = (n, one, many = one + 's') => `${num(n)} ${n === 1 ? one : many}`;

function pullReviews(p) {
  const parts = [];
  if (p.approvals) parts.push(`${p.approvals} approved`);
  if (p.changesRequested) parts.push(`<span class="bad">${p.changesRequested} asked for changes</span>`);
  if (p.awaiting) parts.push(`${p.awaiting} still to review`);
  return parts.join('<br>') || 'none yet';
}

function viewPulls() {
  const all = live ? pulls : MOCK_PULLS, github = integrations.find(i => i.id === 'github'), feed = feeds.github;
  if (!PULL_FILTERS.some(([k]) => k === state.pullFilter)) state.pullFilter = 'all';
  const test = PULL_FILTERS.find(([k]) => k === state.pullFilter)[2];
  const mine = all.filter(p => p.mine).length, blocking = all.filter(p => p.urgency === 'blocking').length, awaiting = all.filter(p => p.urgency === 'awaiting').length;
  const some = n => n ? num(n) : 'none';
  let lede = all.length
    ? `${cap(plural(all.length, 'open pull request'))} involve${all.length === 1 ? 's' : ''} you: ${some(mine)} of yours and ${some(all.length - mine)} to review. ${cap(some(blocking))} ${blocking === 1 ? 'is' : 'are'} blocking someone, and ${some(awaiting)} ${awaiting === 1 ? 'is' : 'are'} awaiting you.`
    : 'No open pull request is yours or waiting on your review.';
  let status = '';
  if (live && !(github && github.enabled && github.available)) {
    lede = 'Pull requests come from GitHub, which is turned off or unavailable.';
    status = `<button class="link" data-act="kbGo" data-s="integrations">Open integrations ›</button>`;
  } else if (live) {
    status = `${!feed ? 'Checking GitHub now…' : feed.error ? `The last check, ${ago(minsSince(feed.at))}, failed: ${esc(feed.error)}` : `As GitHub reported them ${ago(minsSince(feed.at))}.`}

  const rows = all.filter(test).map(p => {
    const standing = p.urgency === 'blocking' || p.urgency === 'awaiting' ? `<span class="tag ${p.urgency}">${p.urgency}</span>`
      : p.onYou ? '<span class="dot waiting"></span>your move, whenever'
      : `<span class="dot ${p.draft ? 'done' : 'idle'}"></span>${p.draft ? 'draft' : 'waiting on others'}`;
    const name = /^https:\/\//.test(p.url || '')
      ? `<a class="ttl" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)} ↗</a>` : `<span class="ttl">${esc(p.title)}</span>`;
    return `<tr>
        <td class="st">${standing}</td>
        <td><div>${name}</div><div class="doing">${esc(p.needs)}</div>
          <div class="dim mono" style="margin-top:3px">${esc(p.repo)}#${p.number} · ${p.mine ? 'yours' : `by ${esc(p.author || 'someone')}`}${live && sessionsOn(p).length ? ` · session: ${esc(sessionsOn(p).map(s => clip(s.label, 40)).join(', '))}` : ''}</div></td>
        <td class="dim">${pullReviews(p)}</td>
        <td class="dim ${p.checks === 'failing' ? 'bad' : ''}">${esc(p.checks)}</td>
        <td class="dim ${p.conflicts ? 'bad' : ''}">${p.conflicts ? 'conflicts' : '—'}</td>
        <td class="dim hide">${p.effort ? esc(effortById(p.effort).name) : 'Unsorted'}</td>

  }).join('');
  return `<div class="page">
    <h1>Pull requests</h1>
    <p class="prose" style="margin-top:10px">${esc(lede)}</p>
    ${status ? `<p class="none" style="margin-top:6px">${status}</p>` : ''}
    <div class="chips">${chips}</div>
    ${rows ? `<table class="tbl"><thead><tr><th class="label">Status</th><th class="label">What</th><th class="label">Reviews</th><th class="label">Checks</th><th class="label">Merge</th><th class="label hide">Effort</th><th class="label">Updated</th></tr></thead>
    <tbody>${rows}</tbody></table>` : `<div class="none">${all.length ? 'Nothing here under this filter.' : ''}</div>`}

      <div class="body"><div class="ttl">${esc(l.what)}${l.ok ? '' : ' · failed'}</div><div class="sub mono" style="font-size:12px">${esc(clip(l.detail, 260))}</div></div>

function kbBody(sec) {
  if (sec === 'integrations') return integrationsBody();
  if (sec === 'roles') return rolesBody();
  const list = kbData()[sec];
  const rm = id => `<button class="x" data-act="kbRemove" data-sec="${sec}" data-id="${id}" title="Remove" aria-label="Remove">×</button>`;

      <div class="meta">${w.cadence ? `<span>checked ${esc(w.cadence)}</span>` : ''}${w.efforts.map(id => `<button class="link" data-act="effort" data-id="${id}">${esc(effortById(id).name)}</button>`).join('')}</div></div>${rm(w.id)}</div>`).join('')
    + `<form class="add" data-form="watch"><select name="type" data-keep="kb-watch-type" aria-label="Type"><option value="person">Person</option><option value="channel">Channel</option><option value="dm">DM</option></select>
      <input name="name" data-keep="kb-watch-name" placeholder="Name or #channel" required><input name="why" data-keep="kb-watch-why" placeholder="Why it's worth watching" required>
      <select name="effort" data-keep="kb-watch-effort" aria-label="Effort">${effortOptions()}</select><button class="btn go">Add</button></form>`;
  if (sec === 'questions') return list.map(q => `<div class="card"><input type="checkbox" data-change="kbResolve" data-id="${q.id}" aria-label="Mark resolved">

    + `<form class="add" data-form="questions"><input name="text" data-keep="kb-questions-text" placeholder="Something you haven't decided yet" required>
      <select name="effort" data-keep="kb-questions-effort" aria-label="Effort">${effortOptions()}</select><button class="btn go">Add</button></form>`;
  return list.map(c => `<div class="card fact"><div class="body"><div class="q">${esc(c.text)}</div></div>${rm(c.id)}</div>`).join('')
    + `<form class="add" data-form="${sec}"><input name="text" data-keep="kb-${sec}-text" placeholder="${sec === 'context' ? 'A fact the summarizer should always know' : 'A rule for filing things under efforts'}" required><button class="btn go">Add</button></form>`;
}

function viewKnowledge() {
  const nav = Object.entries(kbSections()).map(([k, s]) => `<button class="${state.kbSel === k ? 'on' : ''}" data-act="kbSel" data-s="${k}">${s.name}<span>${kbCount(k)}</span></button>`).join('');

const RENDER = { attention: viewAttention, efforts: viewEfforts, activity: viewActivity, pulls: viewPulls, knowledge: viewKnowledge };

function render() {
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const drafts = {};
  document.querySelectorAll('[data-keep]').forEach(el => { drafts[el.dataset.keep] = el.value; });
  const focused = document.activeElement?.dataset?.keep, caret = focused && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  const menuOpen = $('#menu')?.open;
  const acts = $('#acts');
  actsFor = acts?.open ? acts.dataset.id : null;
  actsSub = acts?.open ? acts.querySelector('details[open]')?.dataset.sub || null : null;

  document.documentElement.dataset.theme = state.theme;
  const main = RENDER[state.view]();  // first: it may settle the selection
  const n = activeItems().length;
  $('#nav').innerHTML = VIEWS.map(v => `<button class="${state.view === v ? 'on' : ''}" data-act="view" data-view="${v}">${VIEW_NAMES[v] || cap(v)}${v === 'attention' && n ? `<span class="count">${n}</span>` : ''}</button>`).join('');
  $('#tools').innerHTML = `
    <span class="model" ${modelless() ? `title="${esc(modelWhy(true))}"` : ''}><span class="dot ${live && isOffline ? 'error' : modelless() ? 'idle' : 'running'}"></span>${live ? (isOffline ? 'service offline' : `live · ${summarizer.model ? summarizer.model.split('/').pop() : 'no local model'}`) : 'qwen3:14b · local · caught up'}</span>${live ? usageTotal() + limitMeters() : ''}
    <span class="seg" role="group" aria-label="Voice" title="Fluent shows what the model wrote. Raw shows what the sources said. (r)">
      <button class="${state.fluent ? 'on' : ''}" data-act="fluent" data-on="1">Fluent</button><button class="${state.fluent ? '' : 'on'}" data-act="fluent" data-on="0">Raw</button></span>
    ${live ? `<button class="icon" data-act="searchOpen" title="Search sessions (/ or ⌘K)" aria-label="Search sessions">⌕</button>` : ''}
    <button class="icon" data-act="theme" title="Light or dark" aria-label="Toggle theme">◐</button>
    <details class="menu" id="menu" ${menuOpen ? 'open' : ''}><summary class="icon" title="Prototype controls" aria-label="Prototype controls">⋯</summary>
      <div class="pop"><p>Prototype controls</p>
        ${live ? `<button data-act="toggleHold">Permission prompts: ${settings.answerPermissions ? 'Slorp or terminal' : 'terminal only'}</button>` : ''}
        ${live && window.Notification ? `<button data-act="toggleNotify">Desktop notifications: ${canNotify() ? 'on' : 'off'}</button>` : ''}
        ${live ? '' : '<button data-act="simulate">Simulate an incoming item</button>'}
        <button data-act="reset">Reset the demo</button>
        <p>Keys: j/k move · e dismiss · s snooze · r fluent/raw · 1–5 views</p></div></details>`;
  const notices = [modNotice(), modelNotice()].filter(Boolean);
  document.documentElement.style.setProperty('--notice', `${44 * notices.length}px`);
  $('#notice').innerHTML = notices.join('');
  $('#main').innerHTML = main;
  $('#modal').innerHTML = modal === 'wrapup' ? wrapupModal() : modal === 'search' ? searchModal() : '';
  if (modalFocus) { modalFocus = false; $('#q')?.focus(); }
  // The toggle shows only where there is more of what the user said to see.
  document.querySelectorAll('.said').forEach(el => {
    const tx = el.querySelector('.tx');
    el.querySelector('button').hidden = !el.classList.contains('open') && tx.scrollHeight <= tx.clientHeight + 1;
  });

  document.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll]; });
  document.querySelectorAll('[data-keep]').forEach(el => {
    if (el.dataset.keep in drafts) el.value = drafts[el.dataset.keep];
    if (el.dataset.keep === focused) { el.focus(); if (el.setSelectionRange && caret[0] != null) el.setSelectionRange(caret[0], caret[1]); }
  });
  if (renameFocus) { renameFocus = false; $('.rename input')?.focus(); $('.rename input')?.select(); }
  freshId = null;
}

const actions = {
  view: d => go(d.view),
  select: d => { state.sel = d.id; },
  group: d => { state.groupBy = d.by; },
  rows: d => { state.rows = d.as; },
  liveMoveTo: d => changes.liveMove(d, { value: d.to }),
  liveRoleTo: d => changes.liveRole(d, { value: d.to }),
  repoMoveTo: d => changes.repoMove(d, { value: d.to }),
  moveTo: d => changes.move(d, { value: d.to }),
  srcFilter: d => { state.srcFilter = d.src; },
  collapse: d => { state.collapsed[d.key] = !state.collapsed[d.key]; },
  noop: () => false,
  searchOpen: () => { openSearch(); },
  hitOpen: d => { openHit(hits[+d.i]); return false; },
  wrapOpen: () => { modal = 'wrapup'; },
  wrapClose: () => { modal = null; },
  wrapDay: d => { wrapBack = +d.back; },
  wrapAsk: d => { api('POST', '/api/wrapup', { day: d.day }); return false; },
  wrapCopy: d => {
    Promise.resolve().then(() => navigator.clipboard.writeText(wrapupMarkdown(wrapups[d.day])))
      .then(() => toast('Copied')).catch(() => toast('The browser would not let Slorp copy that'));
    return false;
  },
  fill: d => {
    const ta = document.querySelector(`textarea[data-keep="${d.box}"]`);
    ta.value = d.text; ta.focus();
    return false;
  },
  rename: d => { renaming = d.id; renameFocus = true; },
  renameCancel: () => { renaming = null; },
  side: () => { state.sideShut = !state.sideShut; },
  fluent: d => { state.fluent = d.on === '1'; },
  theme: () => {
    const dark = state.theme === 'dark' || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    state.theme = dark ? 'light' : 'dark';
  },
  reply: d => resolve(d.id, 'answered', d.text),
  send: d => {
    const ta = $('#reply'), text = ta.value.trim();
    if (!text) { ta.focus(); return false; }
    ta.value = '';
    resolve(d.id, 'answered', text);
  },
  dismiss: d => resolve(d.id, 'dismissed'),
  snooze: d => {
    const until = new Date();
    if (d.for === 'tomorrow') { until.setDate(until.getDate() + 1); until.setHours(9, 0, 0, 0); } else until.setHours(until.getHours() + 1);
    const note = d.for === 'tomorrow' ? 'until tomorrow at 9:00' : `until ${until.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    resolve(d.id, 'snoozed', note, { until: until.getTime() });
  },
  park: d => {
    const it = itemById(d.id), qid = 'q' + (++state.seq);
    state.kb.questions.unshift({ id: qid, text: it.title, effort: effortOf(it) === 'unsorted' ? 'slorp' : effortOf(it), age: 0, origin: `parked from a ${it.src.toLowerCase()}` });
    resolve(d.id, 'parked', '', { msg: 'Parked as an open question', undo: () => { state.kb.questions = state.kb.questions.filter(q => q.id !== qid); } });
  },
  route: d => {
    const it = itemById(d.id), name = effortById(d.effort).name;
    state.moved[it.id] = d.effort;
    if (it.session) state.sessMoved[it.session] = d.effort;
    resolve(d.id, 'filed', '', { msg: `Filed under ${name}`, undo: () => { delete state.moved[it.id]; delete state.sessMoved[it.session]; } });
  },
  restore: d => { delete state.handled[d.id]; state.sel = d.id; },
  toggleHandled: () => { state.showHandled = !state.showHandled; },
  toggleRaw: d => { state.rawOpen[d.id] = !(state.rawOpen[d.id] ?? !state.fluent); },
  rephrase: d => {
    $('#summary').classList.add('thinking');  // stand-in for local model latency
    setTimeout(() => { state.variant[d.id] = (state.variant[d.id] || 0) + 1; save(); render(); }, 650);
    return false;
  },
  effort: d => { state.effortSel = d.id; go('efforts'); },
  effortSel: d => { state.effortSel = d.id; },
  openItem: d => { state.sel = d.id; go('attention'); },
  modelNoticeOff: () => { state.modelNoticeOff = true; },
  installMod: () => {
    if (installing) return false;
    installing = true;
    ask('/api/plugins/claude', {}, () => toast('Done. Sessions already open pick it up after /reload-plugins or a restart.'), () => { installing = false; });
  },
  expand: d => { state.expanded[d.id] = !state.expanded[d.id]; },
  actSel: d => { state.actSel = d.id; },
  backfill: d => {
    fetch(`/api/sessions/${encodeURIComponent(d.id)}/backfill`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(res => res.ok ? res.json().then(r => toast(r.queued ? `Read ${plural(r.exchanges, 'exchange')}; the local model will fill in ${num(r.queued)}` : `Read ${plural(r.exchanges, 'exchange')}; nothing was left to fill in`))
        : res.text().then(why => toast(`Could not fill it in: ${why.trim()}`)))
      .then(() => refresh(true)).catch(() => toast('Could not reach the Slorp service'));
    return false;
  },
  copyText: d => {
    Promise.resolve().then(() => navigator.clipboard.writeText(d.text)).then(() => toast('Copied')).catch(() => toast('The browser would not let Slorp copy that'));
    return false;
  },
  detailTab: d => { state.detailTab = d.t; },
  sourceRaw: d => { state.sourceRaw = d.on === '1'; },
  copyReply: d => {
    const text = (live.find(x => x.id === d.id) || {}).lastReply || '';
    Promise.resolve().then(() => navigator.clipboard.writeText(text))
      .then(() => toast(text.startsWith('…') ? 'Copied. It was longer than Slorp keeps, so it starts part-way' : 'Copied'))
      .catch(() => toast('The browser would not let Slorp copy that'));
    return false;
  },
  pullFilter: d => { state.pullFilter = d.f; },
  kbSel: d => { state.kbSel = d.s; },
  kbGo: d => { state.kbSel = d.s; go('knowledge'); },
  kbRemove: d => {
    if (live) { api('DELETE', `/api/kb/${d.sec}/${d.id}`, null, () => toast('Removed')); return false; }
    const list = state.kb[d.sec], i = list.findIndex(x => x.id === d.id), gone = list.splice(i, 1)[0];
    toast('Removed', () => { state.kb[d.sec].splice(i, 0, gone); });
  },
  livePark: d => {
    const it = itemById(d.id);
    api('POST', '/api/kb/questions', { text: it.feed ? it.title : it.ask || it.title, effort: it.effort === 'unsorted' ? '' : it.effort, origin: `parked from "${it.title}"` },
      () => { resolve(d.id, 'parked'); toast('Parked as an open question'); save(); });
    return false;
  },
  pick: d => {
    const all = state.picks[d.id] ||= {}, mine = all[d.q] || [], o = Number(d.o);
    all[d.q] = d.many === '1' ? (mine.includes(o) ? mine.filter(x => x !== o) : mine.concat(o)) : [o];
  },
  liveAnswer: d => {
    const s = live.find(x => x.pending && x.pending.id === d.id), qs = s && askedQuestions(s.pending), picks = picksFor(d.id);
    if (!qs) return false;
    const answers = Object.fromEntries(qs.map((q, n) => [q.question, (picks[n] || []).map(i => q.options[i].label)]));
    fetch(`/api/permissions/${d.id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers }) })
      .then(res => {
        toast(res.status === 409 ? 'That question is no longer waiting here' : !res.ok ? 'Slorp refused that' : 'Answered');
        delete state.picks[d.id];
        save(); refresh(true);
      })
      .catch(() => toast('Could not reach the Slorp service'));
    return false;
  },
  livePermit: d => {
    const note = document.querySelector(`textarea[data-keep="deny-${d.id}"]`);
    fetch(`/api/permissions/${d.id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ behavior: d.behavior, message: d.behavior === 'deny' && note ? note.value.trim() : '' }) })
      .then(res => {
        toast(res.status === 409 ? 'That request is no longer waiting here' : !res.ok ? 'Slorp refused that' : { allow: 'Allowed', deny: 'Denied' }[d.behavior]);
        refresh(true);
      })
      .catch(() => toast('Could not reach the Slorp service'));
    return false;
  },
  feedCheck: () => { api('POST', '/api/feed/check', {}, () => toast('Checking now')); return false; },
  integrationToggle: d => { api('POST', `/api/integrations/${d.id}`, { enabled: d.on === '1' }); return false; },
  toggleNotify: () => {
    if (canNotify()) { state.notify = false; return; }
    Notification.requestPermission().then(answer => {
      state.notify = answer === 'granted';
      toast(state.notify ? 'Slorp will notify you while this page is out of sight' : 'The browser is blocking notifications for this page');
      save(); render();
    });
    return false;
  },
  toggleHold: () => { api('POST', '/api/settings', { answerPermissions: !settings.answerPermissions }); return false; },
  startOpen: d => { starting = d.id; },
  startCancel: () => { starting = null; },
  stop: d => {
    const s = live.find(x => x.id === d.id);
    toast(`Stop "${clip(s ? s.label : d.id, 50)}"? Its conversation is kept.`, () => { ask(`/api/sessions/${d.id}/stop`, {}, () => toast('Stopped. Reopen it from the closed sessions under Activity.')); }, 'Stop');
    return false;
  },
  reopen: d => { ask(`/api/archive/${d.id}/resume`, {}, () => toast('Reopened in the background')); return false; },
  effortDelete: d => {
    toast(`Delete "${effortById(d.id).name}" and its filings?`, () => { api('DELETE', `/api/efforts/${d.id}`); }, 'Delete');
    return false;
  },
  liveSuggest: d => {
    const ta = document.querySelector(`textarea[data-keep="item-${d.id}"]`);
    ta.value = d.text; ta.focus();
    return false;
  },
  liveItemSend: d => {
    const ta = document.querySelector(`textarea[data-keep="item-${d.id}"]`), text = ta.value.trim(), it = itemById(d.id);
    if (!text) { ta.focus(); return false; }
    sendReply(it.session.id, text, () => { ta.value = ''; resolve(d.id, 'answered', text); toast('Sent to the session'); save(); render(); });
    return false;
  },
  liveSend: d => {
    const ta = document.querySelector(`textarea[data-keep="live-${d.id}"]`), text = ta.value.trim();
    if (!text) { ta.focus(); return false; }
    sendReply(d.id, text, () => { ta.value = ''; toast('Queued for the session'); refresh(true); });
    return false;
  },
  simulate: () => {
    const next = POOL.find(p => !state.extra.includes(p.id));
    if (!next) { toast('No more canned items. Reset the demo to replay them.'); return false; }
    state.extra.push(next.id);
    state.arrived[next.id] = Date.now();
    freshId = next.id;
    toast(`New in ${effortById(next.effort).name}: ${next.title}`);
  },
  reset: () => { const { view, theme } = state; state = Object.assign(fresh(), { view, theme }); toast('Demo reset'); },
};
const changes = {
  liveMove: (d, el) => {
    const to = el.value, s = live.find(x => x.id === d.id);
    if (!to) return false;
    if (to === '__new') { go('efforts'); return; }
    const effort = to === 'unsorted' ? '' : to;
    api('POST', `/api/sessions/${d.id}/effort`, { effort }, () => {
      if (effort) toast(`Filed under ${effortById(effort).name}`, () => { api('POST', `/api/efforts/${effort}/dirs`, { dir: s.cwd }); }, `Always file ${shortPath(s.cwd)} here`);
      else toast('Left unsorted');
    });
    return false;
  },
  liveRole: (d, el) => {
    const to = el.value;
    if (!to) return false;
    if (to === '__new') { state.kbSel = 'roles'; go('knowledge'); return; }
    const role = to === '__none' ? '' : to;
    api('POST', `/api/sessions/${d.id}/role`, { role }, () => toast(role ? `Marked as ${roleById(role).name}` : 'No role'));
    return false;
  },
  roleAttention: (d, el) => { api('POST', `/api/roles/${d.id}`, { attention: el.value }); return false; },
  repoMove: (d, el) => {
    const to = el.value, it = itemById(d.id);
    if (!to) return false;
    if (to === '__new') { go('efforts'); return; }
    api('POST', '/api/repos/effort', { repo: it.repo, effort: to === 'unsorted' ? '' : to },
      () => toast(to === 'unsorted' ? `${it.repo} left unsorted` : `Everything from ${it.repo} now files under ${effortById(to).name}`));
    return false;
  },
  move: (d, el) => {
    if (!el.value) return false;
    const prev = state.moved[d.id];
    state.moved[d.id] = el.value;
    toast(`Moved to ${effortById(el.value).name}`, () => { if (prev) state.moved[d.id] = prev; else delete state.moved[d.id]; });
  },
  kbResolve: d => {
    if (live) { api('DELETE', `/api/kb/questions/${d.id}`, null, () => toast('Resolved')); return false; }
    const i = state.kb.questions.findIndex(q => q.id === d.id), gone = state.kb.questions.splice(i, 1)[0];
    toast('Resolved', () => { state.kb.questions.splice(i, 0, gone); });
  },
};

document.addEventListener('click', e => {
  if (!e.target.closest('#menu')) $('#menu')?.removeAttribute('open');
  /* An item's menu shuts on a click outside it, and once something in it is chosen. */
  if (!e.target.closest('#acts') || e.target.closest('#acts [data-act]')) $('#acts')?.removeAttribute('open');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (actions[el.dataset.act](el.dataset, el) !== false) { save(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  query = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change](el.dataset, el) !== false) { save(); render(); }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form)), sec = form.dataset.form, id = sec[0] + (++state.seq);
  const clear = () => form.querySelectorAll('input').forEach(el => { el.value = ''; });
  if (sec === 'name') { api('POST', `/api/sessions/${form.dataset.id}/name`, { name: f.name }); renaming = null; render(); return; }
  if (sec === 'effort') { api('POST', '/api/efforts', { name: f.name, about: f.about }); clear(); return; }
  if (sec === 'start') {
    if (launching) return;
    const effort = form.dataset.id === 'unsorted' ? '' : form.dataset.id;
    launching = true;
    ask('/api/sessions', { dir: f.dir, name: f.name, prompt: f.prompt, role: f.role || '', effort }, () => { starting = null; toast('Started. It will show up here in a moment.'); }, () => { launching = false; render(); });
    render();
    return;
  }
  if (live) { api('POST', `/api/kb/${sec}`, { ...f, origin: 'you wrote this down' }); clear(); return; }
  if (sec === 'watch') state.kb.watch.push({ id, type: f.type, name: f.name, why: f.why, efforts: [f.effort], cadence: 'daily', seen: '', seenAge: 0 });
  else if (sec === 'questions') state.kb.questions.unshift({ id, text: f.text, effort: f.effort, age: 0, origin: 'you wrote this down' });
  else state.kb[sec].push({ id, text: f.text });
  save(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && e.target.closest('.rename')) { renaming = null; render(); return; }
  if (e.key === 'Escape' && modal) { modal = null; render(); return; }
  if (e.key === 'Escape' && $('#acts')?.open) { $('#acts').removeAttribute('open'); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k' && live) { e.preventDefault(); openSearch(); render(); return; }
  /* ⌘↵ in a message box presses the button that sends it. */
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.tagName === 'TEXTAREA') {
    const bar = e.target.nextElementSibling;
    const send = bar?.matches('.send') && [...bar.querySelectorAll('button')].pop();
    if (send) { e.preventDefault(); send.click(); }
    return;
  }
  if (modal === 'search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
    e.preventDefault();
    if (e.key === 'Enter') { openHit(hits[hitSel]); return; }
    hitSel = Math.max(0, Math.min(hits.length - 1, hitSel + (e.key === 'ArrowDown' ? 1 : -1)));
    render();
    $('.hit.sel')?.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const att = state.view === 'attention';
  if (/^[1-5]$/.test(e.key)) go(VIEWS[e.key - 1]);
  else if (e.key === 'r') state.fluent = !state.fluent;
  else if (e.key === 'w' && live) modal = modal === 'wrapup' ? null : 'wrapup';
  else if (e.key === '/' && live) openSearch();
  else if (att && (e.key === 'j' || e.key === 'k')) {
    const order = visibleOrder(), i = order.indexOf(state.sel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.sel = order[i];
  }
  else if (state.view === 'activity' && (e.key === 'j' || e.key === 'k')) {
    const order = actShown(...(live ? liveActivity() : mockActivity())).map(x => x.id), i = order.indexOf(state.actSel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.actSel = order[i];
  }
  else if (att && state.sel && e.key === 'e') actions.dismiss({ id: state.sel });
  else if (att && state.sel && e.key === 's') actions.snooze({ id: state.sel, for: 'hour' });
  else return;
  e.preventDefault();
  save(); render();
  $('.row.sel')?.scrollIntoView({ block: 'nearest' });
});
window.addEventListener('popstate', () => {
  const v = location.hash.slice(1);
  if (!VIEWS.includes(v)) return;
  Object.assign(state, history.state, { view: v });
  save(); render();
});

if (VIEWS.includes(location.hash.slice(1))) state.view = location.hash.slice(1);
else history.replaceState(null, '', '#' + state.view);
render();
connect();
</script>
</body>
</html>
