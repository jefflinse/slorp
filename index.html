  const needs = activeItems().filter(i => i.effort === e.id).sort(byUrgency);
  const real = e.id !== 'unsorted';
  const stands = !real ? `Nothing here is filed under an effort. Move a session to an effort and Slorp can remember its directory.${modelless() ? ` ${NO_MODEL}, so sessions are filed only by an effort's directories or by you.` : ''}`
    : !sess.length ? 'No open sessions are filed here right now.'
    : e.stands || (modelless() ? `${NO_MODEL} to write this.` : 'Not written yet.');
  const qs = knowledge.questions.filter(q => q.effort === e.id), watch = knowledge.watch.filter(w => w.efforts.includes(e.id));
  if (real) fetchPast(e.id);
  const past = real ? pasts[e.id] : null;
  const others = openEfforts().filter(x => x.id !== e.id).map(x => [x.id, x.name]);
  const menu = real ? actsMenu(e.id, 'Rename, shelve, merge or delete', `<button data-act="effortEdit" data-id="${e.id}">Rename or describe</button>
      <button data-act="effortShelve" data-id="${e.id}" data-to="${e.shelved ? 0 : 1}">${e.shelved ? 'Bring it back' : 'Shelve it'}</button>
      ${others.length ? menuPart('merge', 'Merge into', menuTo('effortMergeTo', e.id, others)) : ''}
      <button data-act="effortDelete" data-id="${e.id}">Delete…</button>`) : '';
  const head = editing === e.id ? `<form class="eedit" data-form="effortEdit" data-id="${e.id}">
      <input class="nm" name="name" data-keep="eedit-name-${e.id}" value="${esc(e.name)}" maxlength="80" required aria-label="Name of the effort">
      <input name="about" data-keep="eedit-about-${e.id}" value="${esc(e.about || '')}" maxlength="300" placeholder="One line on what it covers" aria-label="What it covers">
      <div class="marks" role="group" aria-label="Its mark">${effortMark(e, '', editColor)}
        ${EFFORT_COLORS.map(c => `<button type="button" class="sw ${c === editColor ? 'on' : ''}" data-act="editColor" data-c="${c}" style="--ec:var(--e-${c})" title="${cap(c)}" aria-label="${cap(c)}" aria-pressed="${c === editColor}"></button>`).join('')}
        <input name="glyph" data-keep="eedit-glyph-${e.id}" value="${esc(e.glyph || '')}" maxlength="8" placeholder="${esc(effortGlyph({ ...e, glyph: '' }))}" title="A character or emoji to mark it with, in place of its initial" aria-label="A character or emoji to mark it with">
        <input type="hidden" name="color" value="${editColor}"></div>
      <div class="send"><span>The description is what the model reads when it files sessions.</span>
        <span><button type="button" class="btn" data-act="effortEditCancel">Cancel</button><button class="btn go">Save</button></span></div></form>`
    : `<div class="titled"><h1>${effortMark(e, 'l')}${esc(e.name)}${real ? `<button class="pen" data-act="effortEdit" data-id="${e.id}" title="Rename or describe this effort" aria-label="Rename or describe this effort">✎</button>` : ''}</h1>${menu}</div>
    ${e.about ? `<p class="lede" style="margin-bottom:0">${esc(e.about)}</p>` : real ? `<p class="lede" style="margin-bottom:0"><button class="link" data-act="effortEdit" data-id="${e.id}">Say what it covers</button>, so the model knows what to file here.</p>` : ''}`;
  return `<div class="epage"><div>
    <div class="crumb"><span class="mono">${esc(e.raw)}</span></div>
    ${head}
    ${e.shelved ? `<div class="shelved"><span>Shelved. It is off the board and the model files nothing new here. Everything filed under it is kept.</span><button class="btn" data-act="effortShelve" data-id="${e.id}" data-to="0">Bring it back</button></div>` : ''}
    <div class="sec"><div class="label"><span>${real && e.stands && sess.length ? spark : ''}Where this stands</span></div><p class="prose">${esc(stands)}</p></div>
    <div class="sec"><div class="label"><span>Needs you (${needs.length})</span></div>
      ${needs.length ? `<div style="margin:0 -18px">${needs.map(i => rowHtml(i, 'openItem')).join('')}</div>` : '<div class="none">Nothing. This is moving without you, or not moving at all.</div>'}</div>
    ${effortTabs([
      ['sessions', 'Sessions', sess.length, `${sess.length ? `<div class="rows plain">${sess.map(x => `<div class="srow" ${dragsFrom(x.id, e.id)}><span class="dot ${statusOf(x)[0]}"></span>
          <div class="body"><div class="ttl"><button data-act="openSession" data-id="${x.id}" title="Open this session">${esc(clip(x.label, 90))}</button></div>
            ${x.insight?.title ? `<div class="sub">${esc(clip(x.insight.title, 90))}</div>` : ''}
            <div class="sub">${statusOf(x)[1]} · <span class="mono">${esc(shortPath(x.cwd))}</span>${x.effortVia ? ` · ${VIA[x.effortVia]}` : ''}</div></div>
          ${roleChip(x)}${moveSelect(x)}</div>`).join('')}</div>` : '<div class="none">None are open.</div>'}
        ${effortClosed(e, past)}`, `<button class="btn" data-act="startOpen" data-id="${e.id}">New Session</button>`],
      effortPulls(e),
      real && effortQuestions(e, qs),
      real && effortDays(e, past?.days),
    ])}
  </div>${real ? `<aside>
    ${effortUsage(sess, past)}
    ${watch.length ? `<div class="sec"><div class="label"><span>Watching</span><button data-act="kbGo" data-s="watch">Manage ›</button></div>
      ${watch.map(w => `<div class="srow"><div class="body"><b>${esc(w.name)}</b><div class="sub">${esc(w.why)}</div></div></div>`).join('')}</div>` : ''}
    <div class="sec"><div class="label"><span>Directories filed here automatically</span></div>
      ${e.dirs.length ? e.dirs.map(d => `<div class="srow"><div class="body mono">${esc(tilde(d))}</div><button class="x" data-act="dirRemove" data-id="${e.id}" data-dir="${esc(d)}" title="Stop filing sessions in this directory here" aria-label="Stop filing ${esc(tilde(d))} here">×</button></div>`).join('')
        : '<div class="none">None yet. Move a session here and choose to remember its directory.</div>'}</div>
  </aside>` : ''}</div>`;
}

/* Asks before one effort is merged into another, saying what moves and what is dropped. */
let modalInto = null;
function mergeModal() {
  const e = liveEfforts.find(x => x.id === modalId), into = liveEfforts.find(x => x.id === modalInto);
  if (!e || !into) { modal = null; return ''; }
  const open = live.filter(s => s.effort === e.id).length, closed = pasts[e.id]?.closedCount || 0, days = pasts[e.id]?.days.length || 0;
  const qs = knowledge.questions.filter(q => q.effort === e.id).length, watch = knowledge.watch.filter(w => w.efforts.includes(e.id)).length;
  const moves = [open && plural(open, 'open session'), closed && plural(closed, 'closed session'), e.dirs.length && plural(e.dirs.length, 'directory', 'directories'),
    qs && plural(qs, 'open question'), watch && plural(watch, 'thing', 'things') + ' it watches', days && `its part of ${plural(days, 'day')} of the journal`].filter(Boolean);
  return `<div class="veil" data-act="modalClose"><div class="modal" data-act="noop" role="alertdialog" aria-label="Merge this effort into another">
    <h2>Merge ${esc(e.name)} into ${esc(into.name)}?</h2>
    <ul><li>${moves.length ? `${cap(listOf(moves))} ${moves.length === 1 && /^one /.test(moves[0]) ? 'moves' : 'move'} to ${esc(into.name)}, with any repository you filed here.` : `Nothing is filed under ${esc(e.name)} yet, so nothing moves.`}</li>
      <li>${esc(e.name)} itself is removed: its name, its description, and what the model wrote of where it stands.</li></ul>
    <p class="prose" style="margin-top:14px">This cannot be undone.</p>
    <div class="mfoot"><button class="btn" data-act="modalClose">Cancel</button>
      <span class="bar"><button class="btn go" data-act="effortMergeYes" data-id="${e.id}" data-to="${into.id}">Merge them</button></span></div>
  </div></div>`;
}

/* Asks before an effort is deleted, saying what goes with it and offering to shelve it instead. */
let modalId = null;
function deleteModal() {
  const e = liveEfforts.find(x => x.id === modalId);
  if (!e) { modal = null; return ''; }
  const open = live.filter(s => s.effort === e.id).length, closed = pasts[e.id]?.closedCount || 0;
  const qs = knowledge.questions.filter(q => q.effort === e.id).length, watch = knowledge.watch.filter(w => w.efforts.includes(e.id)).length;
  const sessions = [open && plural(open, 'open session'), closed && plural(closed, 'closed session')].filter(Boolean);
  const goes = [
    sessions.length && `${cap(listOf(sessions))} filed here ${open + closed === 1 ? 'is' : 'are'} left unsorted.`,
    e.dirs.length && `${e.dirs.length === 1 ? 'Its directory stops' : `Its ${num(e.dirs.length)} directories stop`} filing sessions.`,
    qs && `${cap(plural(qs, 'open question'))} ${qs === 1 ? 'is' : 'are'} kept, under no effort.`,
    watch && `${cap(plural(watch, 'thing'))} it watches ${watch === 1 ? 'loses its' : 'lose their'} tie to it.`,
    'Any repository you filed here is unsorted again, and what the model wrote of where it stands is dropped. The journal keeps what it says of it.',
  ].filter(Boolean);
  return `<div class="veil" data-act="modalClose"><div class="modal" data-act="noop" role="alertdialog" aria-label="Delete this effort">
    <h2>Delete ${esc(e.name)}?</h2>
    <ul>${goes.map(g => `<li>${g}</li>`).join('')}</ul>
    <p class="prose" style="margin-top:14px">This cannot be undone.${e.shelved ? '' : ' Shelving it takes it off the board and keeps all of this.'}</p>
    <div class="mfoot"><button class="btn" data-act="modalClose">Cancel</button>
      <span class="bar">${e.shelved ? '' : `<button class="btn" data-act="effortShelve" data-id="${e.id}" data-to="1">Shelve it instead</button>`}<button class="btn danger" data-act="effortDeleteYes" data-id="${e.id}">Delete it</button></span></div>
  </div></div>`;
}

/* The colours an effort can be marked with, and its mark: the glyph the user gave it, or else its initial,
   on its colour, which the service gives every effort and the demo's efforts take from their place. */
const EFFORT_COLORS = ['red', 'orange', 'olive', 'green', 'teal', 'blue', 'violet', 'pink'];
const effortColor = e => e.color || (e.id === 'unsorted' ? '' : EFFORT_COLORS[(SEED_ORDER.includes(e.id) ? SEED_ORDER.indexOf(e.id) * 3 : [...e.id].reduce((n, c) => n + c.charCodeAt(0), 0)) % EFFORT_COLORS.length]);
const effortGlyph = e => e.glyph || (e.id === 'unsorted' ? '?' : [...(e.name || '').trim()][0]?.toUpperCase() || '·');
const effortMark = (e, size = '', color = effortColor(e)) => `<span class="emark ${size}" style="--ec:${color ? `var(--e-${color})` : 'var(--ink3)'}" aria-hidden="true">${esc(effortGlyph(e))}</span>`;
/* An effort by its mark and name, for a row filed under it. */
const effortChip = id => { const e = effortById(id); return `<span class="echip">${effortMark(e, 's')}${esc(e.name)}</span>`; };

/* The efforts there are cards for, in the user's order, with Unsorted last where anything is. */
const cardEfforts = () => !live ? EFFORTS.concat(UNSORTED)
  : openEfforts().concat(live.some(s => !s.effort) || liveItems.some(i => i.effort === 'unsorted') || !openEfforts().length ? [LIVE_UNSORTED] : []);
/* What a card says of an effort: the things in it that need the user, the most pressing first, its sessions,
   each as its status and what to say of it, and how many minutes it is since anything filed under it was
   active, null when nothing ever was. */
function effortFacts(e) {
  const sess = live ? live.filter(s => (s.effort || 'unsorted') === e.id) : SESSIONS.filter(s => sessEffort(s) === e.id);
  if (!live) return { needs: activeMockItems().filter(i => effortOf(i) === e.id).sort(byUrgency), idle: sess.length ? Math.min(...sess.map(s => s.last)) : null,
    dots: sess.map(s => [s.status, `${s.title || s.name || s.id}: ${STATUS[s.status]}`]) };
  const idle = Math.min(e.activeAt ? minsSince(e.activeAt) : Infinity, ...sess.map(s => minsSince(s.activeAt)));
  return { needs: activeItems().filter(i => i.effort === e.id).sort(byUrgency), idle: isFinite(idle) ? idle : null,
    dots: sess.map(s => [statusOf(s)[0], `${clip(s.label, 60)}: ${statusOf(s)[1]}`]) };
}
/* The name a card keeps on the board and in the column. */
const cardName = e => `view-transition-name:effort-${e.id}`;

/* An effort as a card: what it is, where it stands, the first things in it that need the user, and its
   sessions as dots with when it was last active. A mini card is one collapsed in the column beside the effort that is open, and keeps only
   the name, how many things need the user, the dots and the time; sel marks the one that is open. Unsorted, which the
   user did not declare, and a shelved effort stay where they are put. */
function effortCard(e, mini, sel) {
  const { needs, dots, idle } = effortFacts(e), n = needs.length, shown = needs.slice(0, 2), loose = e.id === 'unsorted' || !!e.shelved;
  const line = state.fluent && e.line && (!live || dots.length) ? `<p class="l">${spark}${esc(e.line)}</p>` : e.about ? `<p class="l">${esc(e.about)}</p>` : '';
  const about = `${e.name}: ${n ? `${num(n)} need${n === 1 ? 's' : ''} you` : 'nothing needs you'}, ${plural(dots.length, 'session')}`;
  return `<div class="ecard ${mini ? 'mini' : ''} ${sel ? 'sel' : ''} ${loose ? 'loose' : ''}" role="button" tabindex="0" ${sel ? 'aria-current="true"' : ''} ${loose ? '' : `draggable="true" aria-keyshortcuts="${mini ? 'Shift+ArrowUp Shift+ArrowDown' : 'Shift+ArrowLeft Shift+ArrowRight'}"`} data-act="effort" data-id="${e.id}" style="${cardName(e)}" aria-label="${esc(about)}">
    <div class="eh">${effortMark(e)}${title(e, 't')}${n ? `<span class="count" title="${n} need${n === 1 ? 's' : ''} you">${n}</span>` : ''}${loose || mini ? '' : '<span class="grip" aria-hidden="true" title="Drag to rearrange">⠿</span>'}</div>
    ${mini ? '' : line}
    ${n && !mini ? `<div class="ens">${shown.map(i => `<button class="en" data-act="openItem" data-id="${i.id}" style="${kindColor(i.kind)}">${title(i, 'nt')}
        <span class="w">${i.urgency === 'whenever' ? '' : `<span class="tag ${i.urgency}">${i.urgency}</span>`}<span>${ago(ageOf(i))}</span></span></button>`).join('')}
      ${n > shown.length ? `<span class="more">and ${num(n - shown.length)} more</span>` : ''}</div>` : ''}
    <div class="ef">${dots.length ? `<span class="dots">${dots.slice(0, 12).map(([status, tip]) => `<span class="dot ${status}" title="${esc(tip)}"></span>`).join('')}</span>` : ''}
      <span>${dots.length ? plural(dots.length, 'session') : 'No open sessions'}${idle == null ? '' : ` · ${mini ? '' : 'active '}${ago(idle)}`}</span></div>
  </div>`;
}

const BOARD_LEDE = 'The work you have declared, in the order you keep it. Drag a card to move it, and Attention lists its groups the same way.';
const newEffortCard = () => `<form class="ecard new" data-form="effort">
      <span class="label">New effort</span>
      <input name="name" data-keep="effort-name" placeholder="Name, e.g. Snapshot store" required aria-label="Name of the effort">
      <input name="about" data-keep="effort-about" placeholder="One line on what it covers" aria-label="What it covers">
      <button class="btn go">Add effort</button>
      <p class="none">${modelless() ? `${NO_MODEL}, so sessions are filed by an effort's directories or by you.` : liveEfforts.length ? 'The description is what the model reads when it files sessions.' : 'Declare an effort and Slorp will start filing sessions under it.'}</p>
    </form>`;

/* Whether the form for a new effort is open in the column, and whether its box still wants the cursor. */
let adding = false, addFocus = false;
const newEffortMini = () => adding ? `<form class="ecard mini new" data-form="effort">
      <input name="name" data-keep="effort-name" placeholder="Name of the effort" required aria-label="Name of the effort">
      <input name="about" data-keep="effort-about" placeholder="One line on what it covers" aria-label="What it covers">
      <span class="send"><button type="button" class="btn" data-act="effortAddCancel">Cancel</button><button class="btn go">Add</button></span>
    </form>` : '<button class="ecard mini new" data-act="effortAdd">+ New effort</button>';
/* What makes a session's row one that can be dragged onto an effort, from the effort it is filed under. */
const dragsFrom = (id, from) => `draggable="true" data-session="${esc(id)}" data-from="${from}" title="Drag onto an effort to file it there"`;
/* The open sessions filed under no effort, beneath the column, each to be dragged onto the effort it belongs to. */
function unsortedTray() {
  const list = live ? live.filter(s => !s.effort).map(s => [s.id, statusOf(s), s.label]) : SESSIONS.filter(s => sessEffort(s) === 'unsorted').map(s => [s.id, [s.status, STATUS[s.status]], s.title || s.name]);
  if (!list.length || state.effortSel === 'unsorted') return '';
  return `<div class="tray"><div class="label">Unsorted sessions</div><div class="none">Drag one onto an effort to file it there.</div>
    ${list.map(([id, [dot, word], label]) => `<div class="trow" ${dragsFrom(id, 'unsorted')}><span class="dot ${dot}" title="${word}"></span>${live ? `<button data-act="openSession" data-id="${esc(id)}">${esc(clip(label, 60))}</button>` : `<span>${esc(clip(label, 60))}</span>`}</div>`).join('')}</div>`;
}
/* Files a session under an effort, or under none when given Unsorted, as the menu on a session does. */
function fileSession(id, to) {
  if (live) { changes.liveMove({ id }, { value: to }); return; }
  const prev = state.sessMoved[id];
  state.sessMoved[id] = to;
  toast(to === 'unsorted' ? 'Left unsorted' : `Filed under ${effortById(to).name}`, () => { if (prev) state.sessMoved[id] = prev; else delete state.sessMoved[id]; });
}

/* The efforts the user has shelved, under the board: shut until asked for, unless something in one needs the user. */
function shelf() {
  const list = live ? liveEfforts.filter(e => e.shelved) : [];
  if (!list.length) return '';
  const open = state.shelfOpen || list.some(e => effortFacts(e).needs.length);
  return `<div class="shelf"><div class="ghead"><button class="name" data-act="shelf"><span class="chev ${open ? '' : 'shut'}">▼</span> Shelved</button><span class="n">${list.length}</span></div>
    ${open ? `<div class="board">${list.map(e => effortCard(e, true)).join('')}</div>` : ''}</div>`;
}

/* Efforts: the board of them all, or, with one opened, that one as a large card that fills the view beside
   a column of them all collapsed, where the open one is marked and clicking another opens it instead. */
function viewEfforts() {
  if (live && state.effortSel && state.effortSel !== 'unsorted' && !liveEfforts.some(e => e.id === state.effortSel)) state.effortSel = null;
  if (!state.effortSel) return `<div class="full" data-scroll="eff-board"><div class="page">
    <h1>Efforts</h1><p class="lede">${live && !liveEfforts.length ? 'The work you track across sessions. Nothing is declared yet.' : BOARD_LEDE}</p>
    <div class="board">${cardEfforts().map(e => effortCard(e)).join('')}${live ? newEffortCard() : ''}</div>
    ${shelf()}
  </div></div>`;
  /* The column always has Unsorted, so that a session can be dragged out of an effort, and the open effort, shelved or not. */
  const e = effortById(state.effortSel), all = cardEfforts();
  if (live && !all.includes(LIVE_UNSORTED)) all.push(LIVE_UNSORTED);
  if (!all.some(x => x.id === e.id)) all.push(e);
  return `<div class="split efx">
    <section class="pane estack" data-scroll="eff-stack"><button class="back" data-act="effortBoard" title="Back to the board (Esc)">‹ All efforts</button>
      ${all.map(x => effortCard(x, true, x.id === e.id)).join('')}${live ? newEffortMini() : ''}${unsortedTray()}</section>
    <section class="pane detail" data-scroll="eff-${e.id}"><div class="ebig ${e.id === 'unsorted' ? 'loose' : ''}">${live ? effortDetailLive(e) : effortDetail(e)}</div></section>
  </div>`;
}

/* Puts an effort just ahead of another, or last when there is no other: on the page at once, and for good
   in the service or, in the demo, in what the browser keeps. */
function moveEffort(id, before) {
  const list = live ? liveEfforts : EFFORTS, was = list.map(e => e.id).join(), at = list.findIndex(e => e.id === id);
  if (at < 0 || id === before) return;
  const [e] = list.splice(at, 1), to = before ? list.findIndex(x => x.id === before) : -1;
  list.splice(to < 0 ? list.length : to, 0, e);
  if (list.map(x => x.id).join() === was) return;
  if (live) api('POST', `/api/efforts/${id}/move`, { before: before || '' });
  else state.effortOrder = list.map(x => x.id);
}

/* Dragging a card: the others make room as it passes over them, and where it is let go is where it stays.
   dragged is the card while it is held, dropped whether it was let go on the page, and settling when the
   others will have finished moving aside. */
let dragged = null, dropped = false, settling = 0;
/* Dragging a session's row onto an effort files it there: onto a card in the column, or onto the large card
   for the effort that is open. filing is the row while it is held, and dropOn the effort it is over, if
   that is not the one it is already filed under. */
let filing = null, dropOn = null;
const dropTarget = el => {
  const on = el?.closest?.('.estack .ecard[data-id], .ebig'), to = on && (on.matches('.ebig') ? state.effortSel : on.dataset.id);
  return to && to !== filing.dataset.from ? on : null;
};
function overEffort(on) {
  if (on === dropOn) return;
  dropOn?.classList.remove('drop');
  (dropOn = on)?.classList.add('drop');
}
document.addEventListener('dragstart', e => {
  const row = e.target.closest?.('[data-session][draggable]');
  if (row) {
    filing = row;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', row.dataset.session);
    requestAnimationFrame(() => row.classList.add('dragging'));
    return;
  }
  const card = e.target.closest?.('.ecard[draggable]');
  if (!card) return;
  dragged = card; dropped = false;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', card.dataset.id);
  requestAnimationFrame(() => card.classList.add('dragging'));
});
document.addEventListener('dragover', e => {
  if (filing) {
    overEffort(dropTarget(e.target));
    if (dropOn) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    return;
  }
  if (!dragged) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const over = e.target.closest?.('.ecard[draggable]');
  if (!over || over === dragged || performance.now() < settling) return;
  const cards = [...dragged.parentNode.children], was = new Map(cards.map(c => [c, c.getBoundingClientRect()]));
  over[dragged.compareDocumentPosition(over) & Node.DOCUMENT_POSITION_FOLLOWING ? 'after' : 'before'](dragged);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (const c of cards) {
    const a = was.get(c), b = c.getBoundingClientRect();
    if (c !== dragged && (a.left !== b.left || a.top !== b.top)) c.animate([{ transform: `translate(${a.left - b.left}px, ${a.top - b.top}px)` }, { transform: 'none' }], { duration: 160, easing: 'ease-out' });
  }
  settling = performance.now() + 180;
});
document.addEventListener('drop', e => {
  if (filing && dropOn) { e.preventDefault(); fileSession(filing.dataset.session, dropOn.matches('.ebig') ? state.effortSel : dropOn.dataset.id); }
  if (dragged) { e.preventDefault(); dropped = true; }
});
document.addEventListener('dragend', () => {
  if (filing) { filing = dropOn = null; save(); render(); return; }
  if (!dragged) return;
  const id = dragged.dataset.id, next = dragged.nextElementSibling;
  dragged = null;
  if (dropped) moveEffort(id, next?.matches('.ecard[draggable]') ? next.dataset.id : '');
  save(); render();
});

/* ───────────────────────── Sessions ───────────────────────── */

/* The Sessions list: the sessions in two parts that fold, each a run of rows, beside the page of the one selected. */
function sessionsView(parts, detail, side = '') {
  const rows = ['long', 'short'].map(as => `<button class="${(state.rows || 'long') === as ? 'on' : ''}" data-act="rows" data-as="${as}">${cap(as)}</button>`).join('');
  const list = parts.map(([key, name, n, line, html]) => {
    const shut = state.collapsed['act:' + key];
    return `<div class="ghead"><button class="name" data-act="collapse" data-key="act:${key}"><span class="chev ${shut ? 'shut' : ''}">▼</span> ${name}</button><span class="n">${n}</span></div>
      ${shut ? '' : `${line ? `<div class="gline">${line}</div>` : ''}${html}`}`;
  }).join('');
  return `<div class="split ${side ? 'sided' : ''} ${side && state.sideShut ? 'shut' : ''}">
    <section class="pane list" data-scroll="act-list">
      <div class="listbar"><span class="label">Sessions</span><span class="segs"><span class="seg" role="group" aria-label="How much each row shows" title="Short rows show only the name, how it stands, and what it is doing.">${rows}</span></span></div>
      ${list}
    </section>
    <section class="pane detail" data-scroll="act-${state.actSel}">${detail || '<div class="empty">No session is selected.</div>'}</section>
    ${side}
  </div>`;
}
/* The ids of the sessions the Sessions list shows, top to bottom, given those of its two parts. */
const actShown = (active, closed) => (state.collapsed['act:active'] ? [] : active).concat(state.collapsed['act:closed'] ? [] : closed);
const stat = (dot, word) => `<span class="stat"><span class="dot ${dot}"></span>${word}</span>`;

function viewSessions() {
  if (live) return viewSessionsLive();
  const [active, closed] = mockSessions();
  const all = active.concat(closed);
  if (!all.some(s => s.id === state.actSel)) state.actSel = actShown(active, closed).map(s => s.id)[0] || null;
  const row = s => `<button class="row ${s.id === state.actSel ? 'sel' : ''}" data-act="actSel" data-id="${s.id}" style="${kindColor(s.kind)}">
      <span class="h">${title(s, 't')}<span class="w"><span>${ago(s.last)}</span>${stat(s.status, STATUS[s.status])}</span></span>
      ${state.fluent ? `<span class="st">${esc(s.doing)}</span>` : ''}
      ${state.rows === 'short' ? '' : `<span class="m">${kindBadge(s.kind)}${effortChip(sessEffort(s))}</span>`}
    </button>`;
  const count = k => active.filter(s => s.status === k).length;
  const s = all.find(x => x.id === state.actSel), it = s && activeMockItems().find(i => i.session === s.id);
  const detail = s && `<div class="inner">
    <div class="crumb"><button class="eff" data-act="effort" data-id="${sessEffort(s)}">${effortMark(effortById(sessEffort(s)), 's')}${esc(effortById(sessEffort(s)).name)} ›</button>${kindBadge(s.kind)}${stat(s.status, STATUS[s.status])}<span>active ${ago(s.last)}</span><span>started ${ago(s.started)}</span><span class="mono">${esc(s.where)}</span></div>
    <h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? s.title : s.raw)}</h1>
    ${state.fluent ? `<p class="subt">${spark}${esc(s.doing)}</p>` : ''}
    ${it ? `<div class="need"><div class="label">${spark}What's needed from you</div><p class="ask">${esc(it.ask)}</p><div class="replies"><button class="btn go" data-act="openItem" data-id="${it.id}">Answer it under Attention ›</button></div></div>` : ''}
    <div class="sec"><div class="label"><span>Its last output, verbatim</span></div>${rawBlock(s.tail.map(t => ['last output', t]))}</div>
  </div>`;
  return sessionsView([
    ['active', 'Active', active.length, `${spark}${cap(num(count('waiting')))} awaiting you, ${num(count('error'))} failed overnight, and the rest are getting on with it.`, active.map(row).join('')],
    ['closed', 'Closed', closed.length, '', closed.map(row).join('')],
  ], detail);
}
/* The demo's sessions as Sessions lists them: those still going, the latest to do anything first, and those finished. */
function mockSessions() {
  const recent = (a, b) => a.last - b.last;
  return [SESSIONS.filter(s => s.status !== 'done').sort(recent), SESSIONS.filter(s => s.status === 'done').sort(recent)];
}

/* ───────────────────────── Live sessions ─────────────────────────
   Present only when the page is served by the slorp service. `live` is the
   service's session list; everything outside Sessions is still mock data. */

let live = null, liveItems = [], liveEfforts = [], summarizer = {}, settings = {}, isOffline = false;
let capabilities = {};
const historyReading = new Set();
let knowledge = { watch: [], questions: [], context: [], routing: [], roles: [] }, integrations = [], lookups = [], feeds = {}, pulls = [], limits = [], archive = [], plugins = {}, archiveDocs = {};
/* Fetches a closed session's timeline, once per time it closes. */
const archiveAsked = {};
function fetchArchived(id) {
  const listed = archive.find(a => a.id === id);
  if (!listed || archiveAsked[id] || (archiveDocs[id] && archiveDocs[id].endedAt === listed.endedAt)) return;
  archiveAsked[id] = true;
  fetch(`/api/archive/${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : null).then(doc => { delete archiveAsked[id]; if (doc) { archiveDocs[id] = doc; render(); } })
    .catch(() => { delete archiveAsked[id]; });
}
const LIVE_STATUS = { waiting: ['waiting', 'awaiting you'], failed: ['error', 'failed'], working: ['running', 'working'], idle: ['idle', 'idle'], done: ['done', 'finished'] };
const minsSince = iso => Math.max(0, (Date.now() - new Date(iso).getTime()) / 60000);
const tilde = p => p.replace(/^\/Users\/[^/]+/, '~');
const shortPath = p => { const t = tilde(p); return t.length > 44 ? '…/' + t.split('/').slice(-2).join('/') : t; };
const clip = (t, n) => t.length > n ? t.slice(0, n) + '…' : t;
const srcOf = s => `${KINDS[s.agent] || s.agent} ${s.kind === 'background' ? 'background session' : 'session'}`;
const rawOf = s => `${s.agent} · ${shortPath(s.cwd)} · ${s.id.slice(0, 8)}`;
const statusOf = s => LIVE_STATUS[s.status] || LIVE_STATUS.idle;
/* Whether there is nowhere for pull requests to come from: the service is there and GitHub is not turned on. */
const pullsOff = () => !!live && !integrations.find(i => i.id === 'github')?.enabled;
/* The item a session has under Attention, while the user has yet to deal with it. */
const itemOf = s => liveItems.find(i => i.session && i.session.id === s.id && isActive(i));

async function refresh(force) {
  try {
    const res = await fetch('/api/sessions');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    live = data.sessions;
    liveEfforts = (data.efforts || []).map(e => ({ ...e, raw: e.dirs.length ? e.dirs.map(tilde).join(', ') : `effort ${e.id}` }));
    liveItems = toItems(data);
    summarizer = data.summarizer || {};
    if (summarizer.model) delete state.modelNoticeOff;
    settings = data.settings || {};
    capabilities = data.capabilities || {};
    knowledge = { roles: [], ...(data.knowledge || knowledge) };
    integrations = data.integrations || [];
    lookups = data.lookups || [];
    feeds = data.feeds || {};
    pulls = data.pullRequests || [];
    limits = data.limits || [];
    const listed = JSON.stringify(journal);
    journal = data.journal || [];
    if (journalFound && JSON.stringify(journal) !== listed) runJournalSearch();
    archive = data.archive || [];
    plugins = data.plugins || {};
    isOffline = false;
    announce(liveItems);
  } catch (e) { isOffline = live !== null; }
  render();
}

/* Server items take the mock items' shape so the Attention pane draws both.
   An item with a source came from an integration's feed and has no session. */
function toItems(data) {
  const byId = Object.fromEntries(data.sessions.map(s => [s.id, s]));
  return (data.items || []).filter(i => i.source || byId[i.sessionId]).map(i => {
    if (i.source) return { ...i, live: true, feed: true, effort: i.effort || 'unsorted', kind: i.source, itemKind: i.kind,
      src: KINDS[i.source] || i.source, raw: `${i.source} · ${i.repo} · ${i.kind}` };
    const s = byId[i.sessionId];
    return { ...i, live: true, session: s, effort: s.effort || 'unsorted', kind: s.agent, itemKind: i.kind, src: srcOf(s), raw: rawOf(s) };
  });
}

function api(method, path, body, done) {
  fetch(path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body && JSON.stringify(body) })
    .then(res => { if (!res.ok) throw new Error(res.status); if (done) done(); refresh(true); })
    .catch(() => toast('Could not reach the Slorp service'));
}

/* Asks the service to do something outside itself, and says why when it could not. */
/* Says when Claude Code lacks the Slorp mod, or has an older one than is offered, and offers to put that right. */
let installing = false, removing = false, updating = false;
let opencodeBusy = '';
function claudeNotice() {
  const p = plugins.claude;
  if (live && p && p.installed && p.enabled && p.latest && state.modPassed !== p.latest) return `<div><span>Version ${esc(p.latest)} of the Slorp mod for Claude Code is out. It has ${esc(p.version)}.</span>
    <button class="btn go" data-act="updateMod" ${updating ? 'disabled' : ''}>${updating ? 'Updating…' : 'Update it'}</button><button class="btn" data-act="modPass" data-v="${esc(p.latest)}">Dismiss</button></div>`;
  if (!live || !p || (p.installed && p.enabled)) return '';
  const off = p.installed;
  return `<div><span>${off ? 'The Slorp mod is turned off in Claude Code' : "Claude Code doesn't have the Slorp mod"}, so its sessions can be watched here but not answered.</span>
    <button class="btn go" data-act="installMod" ${installing ? 'disabled' : ''}>${installing ? (off ? 'Turning it on…' : 'Installing…') : off ? 'Turn it on' : 'Install it'}</button></div>`;
}

function modNotice() {
  const p = plugins.opencode;
  let notice = '';
  if (live && p && !p.error && p.source !== 'file' && (!p.installed || p.needsSetup || p.updateAvailable)) {
    const label = p.updateAvailable ? 'Update' : p.installed ? 'Finish setup' : 'Install';
    const why = p.updateAvailable ? 'This Slorp includes an updated OpenCode plugin.' : p.installed ? 'The OpenCode plugin needs its terminal companion to discover reopened sessions.' : 'Install the Slorp plugin to see your OpenCode sessions here.';
    notice = `<div><span>${why}</span><button class="btn go" data-act="opencodePlugin" data-op="${p.updateAvailable ? 'update' : 'install'}" ${opencodeBusy ? 'disabled' : ''}>${opencodeBusy ? 'Working…' : label}</button></div>`;
  }
  return claudeNotice() + notice;
}

function changeOpenCodePlugin(op) {
  if (opencodeBusy) return;
  opencodeBusy = op;
  render();
  fetch(`/api/plugins/opencode${op === 'update' ? '/update' : ''}`, {
    method: op === 'uninstall' ? 'DELETE' : 'POST',
    ...(op === 'uninstall' ? {} : { headers: { 'Content-Type': 'application/json' }, body: '{}' }),
  }).then(async res => {
    if (!res.ok) throw new Error((await res.text()).trim() || res.status);
    toast(op === 'uninstall' ? 'Uninstalled. Restart OpenCode to unload the plugin.' : 'Ready. Quit and restart OpenCode to load both parts of the plugin.');
  }).catch(err => toast(err instanceof TypeError ? 'Could not reach the Slorp service' : `That did not work: ${err.message}`))
    .finally(() => { opencodeBusy = ''; refresh(true); });
}

/* Whether Slorp is running with no local model: one was looked for and not
   found, or Slorp was started without. False until it has looked. */
const modelless = () => !!live && !summarizer.model && !!(summarizer.off || summarizer.error);
const NO_MODEL = 'No local model is running';
/* What is missing without one and why there is none; in full adds how soon one is noticed. */
function modelWhy(full) {
  const where = summarizer.url ? ` at ${summarizer.url}` : '';
  const how = summarizer.off ? (summarizer.fixedUrl ? 'Slorp was started without one.' : 'It is turned off in Settings.')
    : /unreachable/.test(summarizer.error) ? `Slorp looks for an LLM server${where}.`
    : `The LLM server${where} answered, but ${summarizer.error.replace(/^it /, '')}.`;
  return `${NO_MODEL}, so sessions are shown as they are: no summaries, suggested replies, automatic filing or wrap-ups. ${how}${full && !summarizer.off && !/name one/.test(summarizer.error) ? ' It notices a loaded model within half a minute.' : ''}`;
}
/* Says so once, until dismissed, when a model was looked for and not found. */
function modelNotice() {
  if (!modelless() || summarizer.off || state.modelNoticeOff) return '';
  return `<div><span title="${esc(modelWhy(true))}">${esc(modelWhy())}</span><button class="btn" data-act="setGo" data-s="model">Settings</button><button class="btn" data-act="modelNoticeOff">Dismiss</button></div>`;
}

function ask(path, body, done, always) {
  fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(async res => { if (!res.ok) throw new Error((await res.text()).trim() || res.status); if (done) done(); })
    .catch(err => toast(err instanceof TypeError ? 'Could not reach the Slorp service' : `That did not work: ${err.message}`))
    .finally(() => { if (always) always(); refresh(true); });
}

function sendReply(sessionId, text, done) {
  fetch(`/api/sessions/${sessionId}/reply`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })
    .then(res => { if (!res.ok) throw new Error(res.status); done(); })
    .catch(() => toast('Could not reach the Slorp service'));
}

/* The lesser things to do with an item, behind one button beside its title.
   actsFor is the item whose menu is open, and actsSub the part of it that is. */
let actsFor = null, actsSub = null;
const menuPart = (key, name, rows) => `<details data-sub="${key}" ${actsSub === key ? 'open' : ''}><summary>${name}<span>›</span></summary><div>${rows}</div></details>`;
const menuTo = (act, id, list) => list.map(([to, name]) => `<button data-act="${act}" data-id="${id}" data-to="${to}">${esc(name)}</button>`).join('');
const actsMenu = (id, about, rows) => `<details class="menu acts" id="acts" data-id="${id}" ${actsFor === id ? 'open' : ''}><summary class="icon" title="${about}" aria-label="More to do with this">⋯</summary>
    <div class="pop">${rows}</div></details>`;
function itemMenu(it, more) {
  return actsMenu(it.id, 'Snooze, dismiss, move and more', `${menuPart('snooze', 'Snooze', `<button data-act="snooze" data-id="${it.id}" data-for="hour">For an hour</button><button data-act="snooze" data-id="${it.id}" data-for="tomorrow">Until tomorrow</button>`)}
      <button data-act="dismiss" data-id="${it.id}">Dismiss</button>${more}`);
}
/* The user's efforts that are not shelved: the ones on the board, and the ones things can be filed under. */
const openEfforts = () => liveEfforts.filter(e => !e.shelved);
/* The efforts a live session or repository could be filed under other than cur. */
const effortsBut = cur => openEfforts().concat(LIVE_UNSORTED).filter(e => e.id !== cur).map(e => [e.id, e.name]).concat([['__new', 'New effort…']]);
/* The menu beside a session's title: what can be done with the session, after what can be done with its item, if it has one. */
function sessionMenu(s, it) {
  const roles = knowledge.roles.filter(r => !(r.id === s.role && s.roleVia === 'you')).map(r => [r.id, r.name])
    .concat(s.role || s.roleVia !== 'you' ? [['__none', 'No role']] : [], [['__new', 'New role…']]);
  const rows = `${menuPart('move', 'Move to', menuTo('liveMoveTo', s.id, effortsBut(s.effort || 'unsorted')))}
    ${menuPart('role', s.role && s.roleVia === 'you' ? 'Change role' : 'Role', menuTo('liveRoleTo', s.id, roles))}
    ${s.job ? `<button data-act="copyText" data-text="${esc(attachCommand(s))}" title="Copies the command that opens this background session in Claude Code, in a terminal. It keeps running when you leave it.">Copy attach command</button>` : ''}
    ${s.job ? `<button data-act="stop" data-id="${s.id}" title="Stops this background session. Its conversation is kept, and it can be reopened from the closed sessions under Sessions.">Stop session</button>` : ''}`;
  return it ? itemMenu(it, `${s.pending ? '' : `<button data-act="livePark" data-id="${it.id}">Park as open question</button>`}${rows}`)
    : actsMenu(s.id, 'Move, give a role and more', rows);
}
/* The other sessions filed under an effort, as rows, and how many there are. */
const alsoRows = (effort, except) => {
  const others = live.filter(x => x.id !== except && (x.effort || 'unsorted') === effort);
  return { count: others.length, html: others.length ? others.map(x => `<div class="srow"><span class="dot ${(LIVE_STATUS[x.status] || LIVE_STATUS.idle)[0]}"></span>
        <div class="body"><div class="ttl">${esc(clip(x.label, 90))}</div></div>
        <span class="side">${kindBadge(x.agent)} · ${(LIVE_STATUS[x.status] || LIVE_STATUS.idle)[1]}</span></div>`).join('') : '<div class="none">No other sessions here.</div>' };
};
const alsoIn = (effort, except) => `<div class="sec"><div class="label"><span>Also going on in ${esc(effortById(effort).name)}</span></div>
      ${alsoRows(effort, except).html}</div>`;

/* A feed item: nothing to reply to, only somewhere to go. Moving it files its
   whole repository, since that is what the next items from there go by. */
/* The sessions working on the branch a pull request's item is about, each with a box to tell it so. */
const pullOfItem = it => pulls.find(x => it.pull ? pullKey(x) === it.pull : x.url && x.url === it.url);
const onBranch = it => branchSessions(pullOfItem(it));
function branchSessions(p) {
  const on = p ? sessionsOn(p) : [];
  if (!on.length) return '';
  return `<div class="sec"><div class="label"><span>${on.length === 1 ? 'A session is' : `${cap(num(on.length))} sessions are`} on this branch</span></div>
    ${on.map(s => `<div class="srow"><span class="dot ${(LIVE_STATUS[s.status] || LIVE_STATUS.idle)[0]}"></span>
        <div class="body"><div class="ttl">${esc(clip(s.label, 90))}</div><div class="sub">${(LIVE_STATUS[s.status] || LIVE_STATUS.idle)[1]} · <span class="mono">${esc(s.branch)}</span></div></div>
        <span class="side">${kindBadge(s.agent)}</span></div>
      ${s.canReply
        ? `<div class="livebox">${pullAsks(p, `live-${s.id}`) ? `<div class="replies">${pullAsks(p, `live-${s.id}`)}</div>` : ''}<textarea data-keep="live-${s.id}" placeholder="Tell this session…"></textarea>
            <div class="send"><span>Suggestions fill the box; nothing is sent until you press Send.</span><button class="btn go" data-act="liveSend" data-id="${s.id}">Send</button></div></div>`
        : `<div class="none" style="margin:4px 0 12px">It isn't running the Slorp mod, so tell it in its terminal: <span class="mono">${esc(shortPath(s.cwd))}</span></div>`}`).join('')}</div>`;
}

function feedItemDetail(it) {
  const real = it.effort !== 'unsorted', p = pullOfItem(it), point = p && it.point && (p.points || []).find(x => x.id === it.point);
  const menu = itemMenu(it, `<button data-act="livePark" data-id="${it.id}">Park as open question</button>
    ${menuPart('move', `File ${esc(it.repo)} under`, menuTo('repoMoveTo', it.id, effortsBut(it.effort)))}`);
  return `<div class="inner">
    <div class="crumb">${real ? `<button class="eff" data-act="effort" data-id="${it.effort}">${effortMark(effortById(it.effort), 's')}${esc(effortById(it.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${real && VIA_REPO[it.effortVia] ? `<span>${VIA_REPO[it.effortVia]}</span>` : ''}${kindBadge(it.kind, it.src)}<span>${ago(ageOf(it))}</span><span class="tag ${it.urgency}">${it.urgency}</span><span class="mono">${esc(it.repo)}</span></div>
    <div class="titled"><h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? it.title : it.raw)}</h1>${menu}</div>
    <div class="need"><div class="label">${it.point ? spark : ''}What's needed from you</div>${point ? pointHtml(p, point) : `<p class="ask">${esc(it.ask)}</p>`}
      ${/^https:\/\//.test(it.url || '') ? `<div class="replies" ${point ? 'style="margin-top:14px"' : ''}>${point ? '' : `<a class="btn go" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">Open on ${esc(it.src)} ↗</a>`}
        ${p ? `<button class="btn" data-act="pullOpen" data-id="${esc(pullKey(p))}">Its discussion, under PRs ›</button>` : ''}
        <span class="none" style="align-self:center">Slorp only reads ${esc(it.src)}. Anything you do there, you do there.</span></div>` : ''}</div>
    ${onBranch(it)}
    ${it.point && p ? `<div class="sec"><div class="label"><span>${p.brief ? spark : ''}Where it stands</span></div>${pullStands(p)}
        <div class="none" style="margin-top:8px">${spark}The local model picked this out of the discussion of <span class="mono">${esc(it.pull)}</span>, as ${esc(it.src)} had it ${ago(minsSince(p.readAt || it.at))}.</div></div>`
      : `<div class="sec"><div class="label"><span>What's going on</span></div><p class="prose">${esc(it.summary)}</p>
      <div class="none" style="margin-top:8px">As ${esc(it.src)} reported it ${ago(minsSince((feeds[it.source] || {}).at || it.at))}. No model wrote any of this.</div></div>`}
    ${alsoIn(it.effort, '')}
  </div>`;
}

/* Renders the Markdown an agent wrote. All of it is escaped before any
   markup is added, so nothing in the text becomes markup of its own, and a
   link is made only for an https address. Text cut off mid-block still
   renders: an unclosed code fence runs to the end. */
function md(src) {
  const inline = text => {
    const code = [];
    return esc(text).replace(/`([^`]+)`/g, (_, c) => `\u0000${code.push(c) - 1}\u0000`)
      .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\s][^*]*)\*(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
      .replace(/(^|[\s(])_([^_\s][^_]*)_(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
      .replace(/\u0000(\d+)\u0000/g, (_, n) => `<code>${code[n]}</code>`);
  };
  const cells = row => row.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const item = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/, lines = String(src).replace(/\r/g, '').split('\n'), out = [];
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const body = [];
      for (i++; i < lines.length && !/^\s*```\s*$/.test(lines[i]); i++) body.push(lines[i]);
      i++;
      out.push(`<pre><code>${esc(body.join('\n'))}</code></pre>`);
    } else if (!line.trim()) {
      i++;
    } else if (/^#{1,6}\s/.test(line)) {
      const [, marks, text] = line.match(/^(#{1,6})\s+(.*)$/);
      out.push(`<h4 class="h${marks.length}">${inline(text)}</h4>`);
      i++;
    } else if (/^\s*([-*_])\s*\1\s*\1[-*_\s]*$/.test(line)) {
      out.push('<hr>');
      i++;
    } else if (/^\s*\|/.test(line) && /^\s*\|?[\s:|-]*-[\s:|-]*$/.test(lines[i + 1] || '')) {
      const head = cells(line), rows = [];
      for (i += 2; i < lines.length && /^\s*\|/.test(lines[i]); i++) rows.push(cells(lines[i]));
      out.push(`<table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    } else if (item.test(line)) {
      const tag = /^\s*\d/.test(line) ? 'ol' : 'ul', items = [];
      for (; i < lines.length && (item.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length)); i++) {
        const m = lines[i].match(item);
        if (m) items.push([Math.min(4, Math.floor(m[1].length / 2)), m[3]]);
        else items[items.length - 1][1] += ' ' + lines[i].trim();
      }
      out.push(`<${tag}>${items.map(([depth, text]) => `<li${depth ? ` style="margin-left:${depth * 18}px"` : ''}>${inline(text)}</li>`).join('')}</${tag}>`);
    } else if (/^\s*>/.test(line)) {
      const quote = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); i++) quote.push(lines[i].replace(/^\s*>\s?/, ''));
      out.push(`<blockquote>${quote.map(inline).join('<br>')}</blockquote>`);
    } else {
      const para = [lines[i++]];
      for (; i < lines.length && lines[i].trim() && !/^\s*(```|#{1,6}\s|>|\|)/.test(lines[i]) && !item.test(lines[i]); i++) para.push(lines[i]);
      out.push(`<p>${para.map(inline).join('<br>')}</p>`);
    }
  }
  return `<div class="md">${out.join('')}</div>`;
}

/* ── Subagents: the agents a session started to do parts of its work. ── */

/* How long a subagent may say nothing before it is no longer taken to be running, in minutes. */
const SUB_QUIET = 10;
const newTokens = u => (u?.in || 0) + (u?.cacheWrite || 0) + (u?.out || 0);
const subQuiet = a => a.activeAt ? minsSince(a.activeAt) : 0;
/* How a subagent stands by its session's own word, where the session runs the Slorp mod and so says. */
const SUB_SAID = { running: ['running', 'running'], waiting: ['waiting', 'waiting'], pending: ['idle', 'yet to start'], idle: ['idle', 'idle'], completed: ['done', 'finished'], failed: ['error', 'failed'], killed: ['error', 'stopped'] };
const subRunning = a => a.status ? ['running', 'waiting', 'pending'].includes(a.status) : !a.done && subQuiet(a) < SUB_QUIET;
/* How a subagent stands, as a dot and a word: as its session says, else as its record suggests. One in a closed session that never finished did not finish. */
function subStatus(a, closed) {
  if (closed && !['completed', 'failed', 'killed'].includes(a.status)) return a.done ? ['done', 'finished'] : ['idle', 'did not finish'];
  return SUB_SAID[a.status] || (a.done ? ['done', 'finished'] : subRunning(a) ? ['running', 'running'] : ['idle', `no word for ${span(subQuiet(a))}`]);
}
/* A subagent's latest token readings as a line. */
function sparkline(v) {
  if (!v || v.length < 2) return '';
  const lo = Math.min(...v), hi = Math.max(...v), w = 64, h = 14;
  const pts = v.map((n, i) => `${(i * w / (v.length - 1)).toFixed(1)},${(h - 1 - (hi === lo ? 0 : (n - lo) * (h - 2) / (hi - lo))).toFixed(1)}`).join(' ');
  return `<svg class="sparkl" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="Its tokens over the last minute or so"><title>Its tokens over the last minute or so: ${tokens(v[0])} to ${tokens(v[v.length - 1])}</title><polyline points="${pts}"/></svg>`;
}
const lasted = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s` : `${Math.floor(s / 3600)}h ${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}m`; };
function subChip(s) {
  const all = s.subagents || [], going = all.filter(subRunning).length, failed = all.filter(a => a.status === 'failed').length;
  if (!all.length) return '';
  return `<span class="subs ${going ? 'live' : ''}" title="Agents this session started to do parts of its work">${going ? `<span class="dot running"></span>${going} of ${all.length}` : all.length} subagent${all.length === 1 ? '' : 's'}${going ? ' running' : ''}${failed ? `<b>, ${failed} failed</b>` : ''}</span>`;
}

/* What each subagent was asked and reported, fetched when its lane is opened and again as it gets further. */
const subDocs = {}, subAsked = {};
const subVersion = (a, closed) => JSON.stringify([a.reportRevision || 0, a.activeAt || '', a.status || '', !!a.done, !!closed]);
function fetchSub(sessionId, a, closed) {
  const key = `${sessionId}/${a.id}`, version = subVersion(a, closed);
  if (subAsked[key]?.version === version || subDocs[key]?.version === version) return;
  const request = { version };
  subAsked[key] = request;
  fetch(`/api/sessions/${encodeURIComponent(sessionId)}/subagents/${encodeURIComponent(a.id)}`, { cache: 'no-store' }).then(r => {
    if (r.status === 404) return { missing: true };
    if (!r.ok) throw new Error(`Report request failed: ${r.status}`);
    return r.json();
  }).then(doc => {
    if (subAsked[key] === request) subDocs[key] = { ...doc, version };
  }).catch(() => {
    if (subAsked[key] === request) subDocs[key] = { failed: true, version };
  }).finally(() => {
    if (subAsked[key] !== request) return;
    delete subAsked[key];
    render();
  });
}

/* The subagents in the runs they were started in: those whose times overlap, or nearly, share a run and its time scale. */
function subRuns(list, closed) {
  const now = Date.now(), runs = [];
  const spans = list.map(a => { const from = a.startedAt ? +new Date(a.startedAt) : now; return { a, from, to: Math.max(from, subRunning(a) && !closed ? now : +new Date(a.activeAt || from)) }; }).sort((x, y) => x.from - y.from);
  for (const sp of spans) {
    const run = runs[runs.length - 1];
    if (run && sp.from <= run.to + 60000) { run.spans.push(sp); run.to = Math.max(run.to, sp.to); }
    else runs.push({ from: sp.from, to: sp.to, spans: [sp] });
  }
  return runs;
}

/* A session's subagents: each a lane on the time scale of its run, opening onto what it was asked and reported. */
function subsBody(sessionId, list, closed, used) {
  const theirs = list.reduce((n, a) => n + newTokens(a.used), 0), mine = used ? newTokens(used) - theirs : 0;
  const today = new Date().toDateString();
  const runs = subRuns(list, closed).reverse().map(run => {
    const began = new Date(run.from), width = Math.max(1, run.to - run.from);
    const lanes = run.spans.map(({ a, from, to }) => {
      const [dot, word] = subStatus(a, closed), cacheKey = `${sessionId}/${a.id}`, key = `sub:${cacheKey}`, open = state.expanded[key];
      const cached = subDocs[cacheKey], doc = cached?.version === subVersion(a, closed) ? cached : null;
      if (open) fetchSub(sessionId, a, closed);
      const parent = a.parentId && list.find(x => x.id === a.parentId);
      const about = [a.type, a.model && modelName(a.model), a.effort, a.tools || a.startedAt ? plural(a.tools || 0, 'tool call') : '', a.background ? 'in the background' : '', a.costUsd ? `≈${money(a.costUsd)}` : '',
        parent ? `started by ${clip(parent.description || parent.type || 'another subagent', 40)}` : ''].filter(Boolean).map(esc).join(' · ');
      const live = subRunning(a) && !closed;
      const said = !open ? '' : !doc ? '<div class="subdoc"><div class="none">Fetching what it was asked and reported…</div></div>'
        : doc.missing || doc.failed ? `<div class="subdoc"><div class="none">${doc.missing ? 'No record is available for this subagent.' : 'Could not load what this subagent was asked and reported. Try again.'}</div>
            <button class="link" data-act="subRetry" data-id="${esc(cacheKey)}">Retry loading report</button></div>`
        : `<div class="subdoc">${doc.prompt ? `<div class="said ${state.expanded['said:' + key] ? 'open' : ''}"><div class="label">What it was asked</div><div class="tx">${esc(doc.prompt)}</div>
            <button class="link" data-act="expand" data-id="said:${esc(key)}" hidden>${state.expanded['said:' + key] ? 'Show less' : 'Show all of it'}</button></div>` : ''}
          <div class="label" style="margin-bottom:6px">${doc.handed ? 'What it reported' : a.done || closed ? 'The last thing it said' : 'The last thing it has said'}</div>
          ${doc.report ? md(doc.report) : '<div class="none">Nothing yet.</div>'}</div>`;
      return `<button class="lane ${open ? 'open' : ''}" data-act="expand" data-id="${esc(key)}" style="${a.depth > 1 ? `padding-left:${(a.depth - 1) * 16}px` : ''}" aria-expanded="${!!open}">
          <span class="what"><span class="t">${esc(a.description || a.type || a.id)}</span>${live && a.doing ? `<span class="doing" title="What it says it is doing">${esc(a.doing)}</span>` : ''}<span class="m">${about}</span></span>
          <span class="track" title="${esc(`${new Date(from).toLocaleTimeString()} to ${subRunning(a) && !closed ? 'now' : new Date(to).toLocaleTimeString()}`)}"><i class="${dot}" style="left:${(100 * (from - run.from) / width).toFixed(2)}%;width:${(100 * (to - from) / width).toFixed(2)}%"></i></span>
          <span class="num"><span>${lasted(to - from)}</span><span>${tokens(newTokens(a.used) || (a.samples || []).at(-1) || 0)}</span></span>
          <span class="stand">${stat(dot, word)}${live ? sparkline(a.samples) : ''}</span>
        </button>${said}`;
    }).join('');
    return `<div class="run"><div class="rhead"><span>${began.toDateString() === today ? '' : `${began.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}, `}${began.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        <span>${run.spans.length > 1 ? `${num(run.spans.length)} together over ${lasted(run.to - run.from)}` : ''}</span></div>${lanes}</div>`;
  }).join('');
  return `<p class="none" style="margin-bottom:6px">${cap(plural(list.length, 'subagent'))} took ${tokens(theirs)} tokens${list.length > 1 ? ' between them' : ''}${mine > 0 ? `, beside ${tokens(mine)} in the conversation itself` : ''}. Each bar is when it ran, on the scale of the run it was started in; the figures are how long it took and the new tokens it used.</p>${runs}`;
}

/* What Slorp knows of a session that its page does not otherwise say. */
function aboutSession(s) {
  const fresh = (s.used?.in || 0) + (s.used?.cacheWrite || 0), out = s.used?.out || 0, read = s.used?.cacheRead || 0;
  const subs = s.subagents || [], theirs = subs.reduce((n, a) => n + newTokens(a.used), 0);
  const squeezed = (s.timeline || []).filter(m => m.compacted);
  const facts = [
    ['Directory', `<span class="mono">${esc(tilde(s.cwd))}</span>`],
    s.branch && ['Branch', `<span class="mono">${esc(s.branch)}</span>`],
    ['Agent', `${esc(srcOf(s))}, ${s.canReply ? 'running the Slorp mod' : 'not running the Slorp mod'}`],
    ['Started', `<span title="${esc(new Date(s.startedAt).toLocaleString())}">${ago(minsSince(s.startedAt))}</span>`],
    ['Last active', `<span title="${esc(new Date(s.activeAt).toLocaleString())}">${ago(minsSince(s.activeAt))}</span>`],
    s.model && ['Model', runsOn(s)],
    s.contextTokens && ['Context', contextUse(s)],
    squeezed.length && ['Compacted', `${squeezed.length === 1 ? '' : `${num(squeezed.length)} times, last `}<span title="${esc(new Date(squeezed.at(-1).at).toLocaleString())}">${ago(minsSince(squeezed.at(-1).at))}</span>`],
    fresh + out > 0 && ['Used', `<span title="Tokens sent for the first time, tokens the model wrote, and tokens read back from the cache.">${tokens(fresh)} new, ${tokens(out)} written${read ? `, ${tokens(read)} cached` : ''}</span>`],
    s.costUsd && ['Cost', `<span title="What its agent puts its use at, at list prices.">about ${money(s.costUsd)}</span>`],
    theirs && ['Subagents', `${num(subs.length)}, using ${tokens(theirs)} of the new tokens`],
    ['Filed under', `${esc(effortById(s.effort || 'unsorted').name)}${s.effort && VIA[s.effortVia] ? `, ${VIA[s.effortVia]}` : ''}`],
    s.role && roleById(s.role) && ['Role', `${esc(roleById(s.role).name)}, ${s.roleVia === 'guess' ? 'guessed by the model' : 'given by you'}`],
    ['Session', `<span class="mono">${esc(s.id)}</span> <button class="link" data-act="copyText" data-text="${esc(s.id)}">copy</button>`],
    s.job && ['Attach', `<span class="mono">${esc(attachCommand(s))}</span> <button class="link" data-act="copyText" data-text="${esc(attachCommand(s))}" title="Copy the command that opens this background session in Claude Code, in a terminal">copy</button>`],
  ].filter(Boolean);
  const sent = (s.replies || []).map(r => `<div><b>${esc(r.state)}</b> · ${esc(r.text)}</div>`).join('');
  return `<div class="label tlhead"><span>Details</span></div><dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    ${sent ? `<div class="label" style="margin-top:22px">Sent from here</div><div class="livebox"><div class="sent">${sent}</div></div>` : ''}`;
}

/* The tabs under a session: the latest of its conversation, rendered or as it
   was written, its subagents, and what else is going on in the same effort. */
function detailTabs(s) {
  const effort = s.effort || 'unsorted', others = alsoRows(effort, s.id), subs = s.subagents || [];
  const on = ['also'].concat(subs.length ? 'subs' : []).includes(state.detailTab) ? state.detailTab : 'source';
  const tab = (key, name) => `<button class="label ${on === key ? 'on' : ''}" data-act="detailTab" data-t="${key}">${name}</button>`;
  const shown = state.sourceRaw ? `<div class="rawblock"><div class="tx">${esc(s.lastReply)}</div></div>` : md(s.lastReply);
  const open = state.expanded['said:' + s.id];
  const source = () => `${s.lastPrompt ? `<div class="said ${open ? 'open' : ''}"><div class="label">You said</div><div class="tx">${esc(s.lastPrompt)}</div>
      <button class="link" data-act="expand" data-id="said:${s.id}" hidden>${open ? 'Show less' : 'Show all of it'}</button></div>` : ''}
    ${s.lastReply ? shown : '<div class="none">No response found for this session.</div>'}
    <div class="none mono" style="margin-top:12px">${esc(rawOf(s))}</div>`;
  return `<div class="tabs" role="tablist">${tab('source', 'Conversation')}${subs.length ? tab('subs', `Subagents<span class="n">${subs.length}</span>`) : ''}${tab('also', `Also In ${esc(effortById(effort).name)}<span class="n">${others.count}</span>`)}
      ${on !== 'source' ? '' : `<span class="tools">${s.lastReply ? `<button class="btn" data-act="copyReply" data-id="${s.id}" title="Copy the response as it was written">Copy</button>` : ''}
        <span class="seg" role="group" aria-label="How the response is shown"><button class="${state.sourceRaw ? '' : 'on'}" data-act="sourceRaw" data-on="0">Rendered</button><button class="${state.sourceRaw ? 'on' : ''}" data-act="sourceRaw" data-on="1">Raw</button></span></span>`}</div>
    <div class="tabbody">${on === 'also' ? others.html : on === 'subs' ? subsBody(s.id, subs, false, s.used) : source()}</div>`;
}

/* The local model's account of a session: beside its page where there is room, within it where there is not.
   Stale says the session has been working since the account was written. */
function goingOn(s, summary, stale) {
  const looked = s.insight?.lookups || [];
  return `<p class="prose">${summary ? esc(summary) : `<span class="none">${modelless() ? `${NO_MODEL}, so this is not summarized. What the session last said is in full on the left.` : 'Not summarized yet.'}</span>`}</p>
    ${summary && stale ? '<div class="none" style="margin-top:8px">Written when it last stopped. It has been working since.</div>' : ''}
    ${looked.length ? `<div class="none" style="margin-top:8px">${spark}Checked ${esc(listOf(looked))} to write this.</div>` : ''}`;
}

/* What a timeline says of a compaction: who set it off, and the tokens in context either side of it where the agent said. */
const compactedLine = c => `Context compacted${c.auto ? ' automatically' : ''}${c.before && c.after ? `, ${tokens(c.before)} → ${tokens(c.after)} tokens` : ''}`;

/* What the user said in a session, newest first, each with the model's line on how it came out, and among them its compactions. */
function timeline(s, open) {
  const moments = (s.timeline || []).slice().reverse();
  /* Only an open session whose agent keeps a transcript can have its earlier history read, and only when asked. */
  const fill = !(open && capabilities[s.agent]?.history) ? ''
    : historyReading.has(s.id) ? '<span class="none">Reading earlier history…</span>'
    : s.backfilling ? `<span class="none">${spark}Filling in ${plural(s.backfilling, 'earlier exchange')}…</span>`
    : modelless() ? `<button class="link off" disabled title="${NO_MODEL} to say how earlier exchanges came out.">Fill in earlier history</button>`
    : `<button class="link" data-act="backfill" data-id="${s.id}" title="Reads this session's transcript and has the local model say how up to forty earlier exchanges came out. It happens only when you ask.">Fill in earlier history</button>`;
  if (!moments.length && !fill) return '';
  return `<div class="label tlhead"><span>Timeline</span>${fill}</div>${moments.length ? (modelless() && moments.some(m => !m.line) ? `<div class="none">${NO_MODEL}, so new entries are only what you said.</div>` : '') : '<div class="none">Nothing has been said in it since Slorp began watching.</div>'}<ol class="tl">${moments.map(m => `<li class="${m.compacted ? 'mark' : ''}"><span class="when" title="${esc(new Date(m.at).toLocaleString())}">${minsSince(m.at) < 1 ? 'now' : span(minsSince(m.at))}</span>
    <div>${m.compacted ? `<div class="you" title="Its agent replaced the conversation up to here with a summary of it, to make room in its context.">${compactedLine(m.compacted)}</div>`
      : `${m.line ? `<div class="line" title="${esc(m.summary || '')}">${spark}${esc(m.line)}</div>` : ''}<div class="you" title="${esc(m.prompt)}">${esc(m.prompt)}</div>`}</div></li>`).join('')}</ol>`;
}

/* What a session's page offers for answering it: its item's reply box, else its prompt, else a box to say something. */
function answerBox(s, it) {
  const terminal = `<span class="mono">${esc(shortPath(s.cwd))}</span>`;
  if (s.pending) return pendingBox(s);
  if (s.waitingFor === 'permission prompt') return `<div class="none">Slorp was not shown this permission prompt, so answer it in the session's terminal: ${terminal}</div>`;
  if (!s.canReply) return `<div class="none">This session isn't running the Slorp mod, so ${it ? `answer it in its terminal: ${terminal}` : 'it can be watched but not replied to.'}</div>`;
  const box = it ? `item-${it.id}` : `live-${s.id}`;
  const quick = (it ? it.replies : []).map(r => `<button class="btn" data-act="liveSuggest" data-id="${it.id}" data-text="${esc(r)}">${esc(r)}</button>`).join('');
  const asks = pullAsks(pullOf(s), box);
  return `${quick || asks ? `<div class="replies">${quick}${asks}</div>` : ''}
    <textarea data-keep="${box}" placeholder="${it ? 'Reply to this session…' : 'Say something to this session…'}"></textarea>
    <div class="send"><span>${quick || asks ? `${quick ? spark : ''}Suggestions fill the box; nothing is sent until you press Send.` : 'Arrives as your next message once the session is idle.'}</span>
    <button class="btn go" data-act="${it ? 'liveItemSend' : 'liveSend'}" data-id="${it ? it.id : s.id}">Send</button></div>`;
}

/* A session's page. With the item it has under Attention it leads with what is needed; stands is how it stands, for its first line. */
function sessionPage(s, it, stands) {
  const subtitle = it ? it.subtitle : s.status !== 'working' && s.insight?.title;
  const summary = it ? it.summary : s.insight?.summary;
  const needs = it ? `<div class="label">${it.summary ? spark : ''}What's needed from you</div><p class="ask">${esc(it.ask)}</p>`
    : s.pending ? `<div class="label" style="margin-bottom:10px">${s.pending.question || askedQuestions(s.pending) ? 'Waiting for your answer' : 'Waiting for your permission'}</div>`
    : s.canReply ? '<div class="label">Say something to it</div>' : '';
  return `<div class="inner">
    <div class="crumb">${s.effort ? `<button class="eff" data-act="effort" data-id="${s.effort}">${effortMark(effortById(s.effort), 's')}${esc(effortById(s.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${s.effortVia === 'guess' ? `<span>${spark}filed by the model</span>` : ''}${kindBadge(s.agent, srcOf(s))}${roleChip(s)}${stands}${s.branch ? `<span class="mono">${esc(s.branch)}</span>` : ''}${pullChip(s, true)}${s.model ? `<span>${runsOn(s)}</span>` : ''}${contextUse(s)}</div>
    <div class="titled">${renaming === s.id
      ? `<form class="rename" data-form="name" data-id="${s.id}"><input name="name" data-keep="name-${s.id}" value="${esc(s.label)}" maxlength="80" placeholder="Leave empty to go back to its own title" aria-label="Name for this session">
          <button class="btn go">Save</button><button type="button" class="btn" data-act="renameCancel">Cancel</button></form>`
      : `<h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? s.label : rawOf(s))}${state.fluent ? `<button class="pen" data-act="rename" data-id="${s.id}" title="${s.labelVia === 'you' ? 'You named this session. Rename it' : 'Give this session a name of your own'}" aria-label="Rename this session">✎</button>` : ''}</h1>`}${sessionMenu(s, it)}</div>
    ${subtitle && state.fluent ? `<p class="subt">${spark}${esc(subtitle)}</p>` : ''}
    ${it ? '' : roleNote(s)}
    <div class="need ${needs ? '' : 'bare'}">${needs}${answerBox(s, it)}</div>
    <div class="sec going"><div class="label"><span>${summary ? spark : ''}What's going on</span></div>${goingOn(s, summary, !it && s.status === 'working')}</div>
    ${detailTabs(s)}
    <div class="going">${aboutSession(s)}${timeline(s, true)}</div>
  </div>`;
}

/* The pane beside a session's page: the model's account of it, its particulars and its timeline, or the rail that brings them back. */
function sessionSide(s, summary, stale, key) {
  const label = `<span class="label">${summary ? spark : ''}What's going on</span>`;
  return state.sideShut
    ? `<aside class="pane side"><button class="rail" data-act="side" title="Show what's going on" aria-expanded="false"><span>‹</span>${label}</button></aside>`
    : `<aside class="pane side" data-scroll="${key}"><div class="head">${label}<button data-act="side" title="Hide this panel" aria-expanded="true">›</button></div>${goingOn(s, summary, stale)}${aboutSession(s)}${timeline(s, true)}</aside>`;
}

function liveItemDetail(it) {
  return it.feed ? feedItemDetail(it) : sessionPage(it.session, it, `<span>${ago(ageOf(it))}</span><span class="tag ${it.urgency}">${it.urgency}</span>`);
}

function connect() {
  if (location.protocol === 'file:') return;
  refresh(true);
  const events = new EventSource('/api/events');

/* The questions a session put to the user through its question tool, or
   null when the prompt is not one or its input cannot be read. */
function askedQuestions(p) {
  try {
    const qs = JSON.parse(p.input).questions;
    return Array.isArray(qs) && qs.length && qs.every(q => q && typeof q.question === 'string') ? qs : null;
  } catch (e) { return null; }
}

/* What the user has picked so far for a question prompt: for each of its
   questions by position, the positions of the options picked. */
const picksFor = id => state.picks[id] || {};
const selectionsFor = (p, qs) => qs.map((q, n) => {
  const picks = picksFor(p.id), selected = (picks[n] || []).map(i => q.options[i]?.label).filter(Boolean);
  const text = p.ordered && q.custom ? (picks.custom?.[n] || '').trim() : '';
  return text ? (q.multiSelect ? [...new Set([...selected, text])] : [text]) : selected;
});

/* The questions laid out; with a prompt Slorp may answer, each option is a
   button that picks it. */
function questionBox(qs, p) {
  const picks = p ? picksFor(p.id) : {};
  return qs.map((q, n) => `<div class="asked">${q.header ? `<div class="label">${esc(q.header)}</div>` : ''}
      <p class="q">${esc(q.question)}</p>
      ${(Array.isArray(q.options) ? q.options : []).map((o, i) => {
        const inner = `<span class="k">${i + 1}</span><b>${esc(o.label ?? '')}</b><span>${esc(o.description ?? '')}</span>`;
        return p ? `<button class="opt ${(picks[n] || []).includes(i) ? 'on' : ''}" data-act="pick" data-id="${p.id}" data-q="${n}" data-o="${i}" data-many="${q.multiSelect ? 1 : 0}" aria-pressed="${(picks[n] || []).includes(i)}">${inner}</button>`
          : `<div class="opt">${inner}</div>`;
      }).join('')}
      ${p?.ordered && q.custom ? `<input class="opt" data-question-custom="${p.id}" data-q="${n}" data-many="${q.multiSelect ? 1 : 0}" data-keep="answer-${p.id}-${n}" value="${esc(picks.custom?.[n] || '')}" maxlength="8000" placeholder="Or type your own answer…" aria-label="Your answer to ${esc(q.question)}">` : ''}
      ${q.multiSelect ? '<div class="none" style="margin-top:6px">More than one may be chosen.</div>' : ''}</div>`).join('');
}

/* Which of a session's subagents put a prompt to the user, when one did. */
function askedBy(s) {
  if (!s.pending.agentId) return '';
  const a = (s.subagents || []).find(x => x.id === s.pending.agentId);
  return `<div class="none" style="margin-bottom:8px">Asked by its subagent${a ? `, ${esc(a.description || a.type)}` : ''}.</div>`;
}

function pendingBox(s) {
  return askedBy(s) + promptBox(s);
}
function promptBox(s) {
  const p = s.pending, qs = askedQuestions(p);
  const inTerminal = `<div class="none" style="margin-top:10px">Answer in the session's terminal. Slorp cannot pick an option for you.</div>`;
  if (qs && p.answerable) {
    const ready = selectionsFor(p, qs).every(a => a.length);
    return `${questionBox(qs, p)}<div class="replies" style="margin-top:12px">
      <button class="btn go" data-act="liveAnswer" data-id="${p.id}" ${ready ? '' : 'disabled'}>Send answer</button>
      ${p.ordered ? `<button class="btn" data-act="livePermit" data-id="${p.id}" data-behavior="deny">Dismiss</button>` : ''}
      <span class="none" style="align-self:center">${ready ? 'The terminal is asking too; whichever you answer first decides.' : `Answer ${qs.length === 1 ? 'the question' : 'each question'}${p.ordered && qs.some(q => q.custom) ? ' using the options or your own text.' : '. To type something else, answer in the terminal.'}`}</span></div>`;
  }
  if (qs) return questionBox(qs) + inTerminal;
  if (p.question) return `<div class="asked"><p class="q" style="white-space:pre-wrap">${esc(p.input || p.summary)}</p></div>${inTerminal}`;
  const what = `<div class="rawblock" style="margin-bottom:10px;max-height:280px;overflow:auto"><div class="who" style="margin-bottom:4px">${esc(p.tool)}</div><div class="tx">${esc(p.input || p.summary)}</div></div>`;
  if (!p.answerable) return `${what}<div class="none">Answer this one in the session's terminal.</div>`;
  return `${what}<div class="replies">
      <button class="btn go" data-act="livePermit" data-id="${p.id}" data-behavior="allow">Allow once</button>
      <button class="btn" data-act="livePermit" data-id="${p.id}" data-behavior="deny">Deny</button>
      <span class="none" style="align-self:center">The terminal is asking too; whichever you answer first decides.</span></div>
    <textarea data-keep="deny-${p.id}" placeholder="If you deny, you can tell it why…" style="display:block;width:100%;min-height:44px;margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical"></textarea>`;
}

/* What a session's row says under its name: what it waits on, else the model's line on it, else what the user last said. */
const doingNow = s => s.pending ? (s.pending.question ? `Asks: ${s.pending.summary}` : `Wants to run ${s.pending.tool}: ${s.pending.summary}`)
  : s.status !== 'working' && s.insight?.title ? s.insight.title : s.lastPrompt ? `You last said: ${s.lastPrompt}` : '';

/* The sessions as Sessions lists them: the open ones, the latest to do anything first, and the closed, the latest to close first.
   Open sessions whose ages read the same keep one order between them, so two that are both working do not trade places. */
function liveSessions() {
  const age = s => Math.floor(minsSince(s.activeAt));
  return [live.slice().sort((a, b) => age(a) - age(b) || new Date(b.startedAt) - new Date(a.startedAt) || a.id.localeCompare(b.id)), archive];
}

function sessionRowLive(s) {
  const long = state.rows !== 'short', sub = doingNow(s), [dot, word] = statusOf(s);
  const name = state.fluent ? `<span class="t">${esc(clip(s.label, 90))}</span>` : `<span class="mono t">${esc(rawOf(s))}</span>`;
  return `<button class="row ${s.id === state.actSel ? 'sel' : ''}" data-act="actSel" data-id="${s.id}" style="${kindColor(s.agent)}">
    <span class="h">${name}<span class="w"><span>${ago(minsSince(s.activeAt))}</span>${stat(dot, word)}</span></span>
    ${state.fluent && sub ? `<span class="st">${esc(clip(sub, 160))}</span>` : ''}
    ${long ? `<span class="m">${kindBadge(s.agent)}${roleChip(s)}${pullChip(s)}${subChip(s)}${s.effort ? `${effortChip(s.effort)}` : ''}</span>` : ''}

function closedRow(a, act = 'actSel') {
  const name = state.fluent ? `<span class="t">${esc(clip(a.label, 90))}</span>` : `<span class="mono t">${esc(`${a.agent} · ${shortPath(a.cwd || '')} · ${a.id.slice(0, 8)}`)}</span>`;
  const tag = act ? 'button' : 'div';
  return `<${tag} class="row ${act === 'actSel' && a.id === state.actSel ? 'sel' : ''}" ${act ? `data-act="${act}" data-id="${a.id}"` : 'title="Closed too long ago to be listed under Sessions"'} style="${kindColor(a.agent)}">

    ${state.fluent && a.title ? `<span class="st">${esc(clip(a.title, 160))}</span>` : ''}
    ${state.rows === 'short' || act !== 'actSel' ? '' : `<span class="m">${a.agent ? kindBadge(a.agent) : ''}${a.effort ? `${effortChip(a.effort)}` : ''}</span>`}
  </${tag}>`;
}

/* A closed session's page: how it stood when it closed, a way back into it, and its timeline. */
const shellWord = s => /^[\w./-]+$/.test(s) ? s : `'${s.replace(/'/g, `'\\''`)}'`;
/* The command that opens a session running in the background in Claude Code, in a terminal. */
const attachCommand = s => `claude attach ${shellWord(s.job)}`;
