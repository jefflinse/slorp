<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slorp</title>
<style>
:root {
  --bg: #f3f1ea; --panel: #faf9f4; --raised: #ffffff; --sel: #e9e7db;
  --ink: #1b1c18; --ink2: #55574e; --ink3: #8b8d82; --line: #e1ded3;
  --accent: #4f6b00; --fill: #c8f05a; --fill-ink: #1c2700;
  --warn: #a85a09; --err: #b3261e; --toast-act: #c8f05a;
  --k-claude: #d97757; --k-opencode: #3b82c4; --k-slack: #8e5bb5;
  --k-worker: #5f8a8b; --k-local: #6a9a23; --k-kb: #b8930f;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #272925; --panel: #2d2f2a; --raised: #353832; --sel: #40433b;
    --ink: #eeede7; --ink2: #c0c2b7; --ink3: #9c9e93; --line: #464940;
    --accent: #c3ee5c; --fill: #c3ee5c; --fill-ink: #172000;
    --warn: #f0a35e; --err: #f2857c; --toast-act: #4f6b00;
  }
}
:root[data-theme="dark"] {
  --bg: #272925; --panel: #2d2f2a; --raised: #353832; --sel: #40433b;
  --ink: #eeede7; --ink2: #c0c2b7; --ink3: #9c9e93; --line: #464940;
  --accent: #c3ee5c; --fill: #c3ee5c; --fill-ink: #172000;
  --warn: #f0a35e; --err: #f2857c; --toast-act: #4f6b00;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Model-written text carries the spark; verbatim source text is mono. */
.mono { font-family: var(--mono); font-size: 0.86em; letter-spacing: -0.01em; }
.spark { color: var(--accent); font-size: 11px; margin-right: 6px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink3); }

/* Top bar */
.top { height: var(--top); display: flex; align-items: center; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -0.03em; }
.blob { width: 22px; height: 20px; background: var(--fill); border-radius: 60% 40% 55% 45% / 55% 50% 50% 45%; position: relative; display: inline-block; }
.blob::before, .blob::after { content: ""; position: absolute; top: 7px; width: 3px; height: 4px; border-radius: 50%; background: var(--fill-ink); }
.blob::before { left: 6px; } .blob::after { right: 6px; }
.nav { display: flex; gap: 2px; }
.nav button { white-space: nowrap; padding: 6px 12px; border-radius: 7px; color: var(--ink2); font-weight: 500; }
.nav button:hover { background: var(--sel); }
.nav button.on { color: var(--ink); background: var(--sel); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--fill); color: var(--fill-ink); font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.model { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); margin-right: 6px; vertical-align: 1px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--raised); }
.seg button { padding: 3px 10px; font-size: 12px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: var(--bg); }
.icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--ink2); border: 1px solid var(--line); background: var(--raised); list-style: none; cursor: pointer; }
.icon::-webkit-details-marker { display: none; }
.menu { position: relative; }
.menu .pop { position: absolute; right: 0; top: 34px; width: 230px; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 6px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.16); }
.menu .pop button { display: block; width: 100%; padding: 7px 9px; border-radius: 6px; }
.menu .pop button:hover { background: var(--sel); }
.menu .pop p { padding: 6px 9px 4px; color: var(--ink3); font-size: 12px; }

/* Panes */
.split { display: grid; grid-template-columns: minmax(320px, 410px) 1fr; height: calc(100vh - var(--top)); }
.split.narrow { grid-template-columns: 250px 1fr; }
.pane { overflow-y: auto; min-width: 0; }
.pane.list { border-right: 1px solid var(--line); background: var(--panel); }
.pane.detail { padding: 28px 36px 60px; }
.inner { max-width: 740px; }
.page { padding: 28px 36px 60px; max-width: 1240px; margin: 0 auto; }

/* Briefing */
.brief { padding: 18px 18px 16px; border-bottom: 1px solid var(--line); }
.brief .when { display: flex; justify-content: space-between; margin-bottom: 8px; }
.brief p { font-size: 15px; line-height: 1.5; }
.listbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; }

/* Groups and rows */
.ghead { display: flex; align-items: baseline; gap: 8px; padding: 14px 18px 4px; }
.ghead .name { font-weight: 650; font-size: 13px; flex: 1; min-width: 0; }
.ghead .name:hover { color: var(--accent); }
.ghead .n { color: var(--ink3); font-size: 12px; }
.ghead .open { color: var(--ink3); font-size: 12px; }
.ghead .open:hover { color: var(--accent); }
.gline { padding: 0 18px 6px 18px; color: var(--ink3); font-size: 12.5px; }
.chev { display: inline-block; width: 10px; color: var(--ink3); font-size: 10px; transition: transform 0.12s; }
.chev.shut { transform: rotate(-90deg); }
.row { display: block; width: 100%; padding: 9px 18px 10px 16px; border-left: 3px solid transparent; }
.row:hover { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.row.sel { background: var(--sel); border-left-color: var(--ink); }
.row.blocking { border-left-color: var(--fill); }
.row.sel.blocking { border-left-color: var(--accent); }
.row .t { display: block; font-size: 14px; font-weight: 500; line-height: 1.35; }
.row .t.mono { font-size: 12px; font-weight: 400; line-height: 1.45; word-break: break-word; }
.row .m { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--ink3); font-size: 12px; }
.row.fresh { animation: arrive 1.6s ease-out; }
@keyframes arrive { 0% { background: var(--fill); } 100% { background: transparent; } }
.kind { display: inline-flex; align-items: center; white-space: nowrap; }
.kind i { width: 7px; height: 7px; border-radius: 2px; margin-right: 5px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.tag.blocking { background: var(--fill); color: var(--fill-ink); }
.tag.soon { color: var(--warn); border: 1px solid currentColor; }
.tag.whenever { color: var(--ink3); border: 1px solid var(--line); }
.foot { padding: 16px 18px 24px; color: var(--ink3); font-size: 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.foot .link, .link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.handled { margin: 8px 0 12px; }
.handled div { display: flex; gap: 8px; justify-content: space-between; padding: 4px 0; }
.handled .gen { color: var(--ink2); font-size: 13px; }

/* Detail */
.crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; color: var(--ink3); font-size: 12.5px; margin-bottom: 10px; }
.crumb .eff { color: var(--ink2); font-weight: 600; }
.crumb .eff:hover { color: var(--accent); }
h1 { font-weight: 650; font-size: 25px; line-height: 1.2; letter-spacing: -0.02em; }
h1.mono { font-family: var(--mono); font-size: 16px; font-weight: 500; line-height: 1.5; word-break: break-word; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
.btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn.go { background: var(--fill); color: var(--fill-ink); border-color: transparent; font-weight: 600; }
.btn.go:hover { filter: brightness(0.95); }
.btn.quiet { border-color: transparent; background: none; color: var(--ink2); }
.btn.quiet:hover { background: var(--sel); }
select.btn { appearance: none; padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.need { margin-top: 22px; padding: 16px 18px; background: var(--raised); border: 1px solid var(--line); border-radius: 11px; }
.need .ask { font-size: 16px; font-weight: 500; line-height: 1.4; margin: 4px 0 14px; }
.need .replies { display: flex; flex-wrap: wrap; gap: 8px; }
.need textarea { display: block; width: 100%; min-height: 64px; margin-top: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; line-height: 1.45; }
.need textarea.drafted { min-height: 104px; }
.need .send { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; color: var(--ink3); font-size: 12px; }
.sec { margin-top: 30px; }
.sec > .label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sec > .label button { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink3); font-size: 12px; }
.sec > .label button:hover { color: var(--accent); }
.prose { font-size: 15px; line-height: 1.6; max-width: 70ch; }
.prose.thinking { color: transparent; border-radius: 6px; background: linear-gradient(90deg, var(--sel) 25%, var(--line) 50%, var(--sel) 75%); background-size: 200% 100%; animation: shimmer 0.9s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.rawblock { font-family: var(--mono); font-size: 12px; line-height: 1.55; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; overflow-x: auto; }
.rawblock .ln { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 2px 0; }
.rawblock .who { color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rawblock .tx { white-space: pre-wrap; word-break: break-word; }
.srow { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.srow .body { flex: 1; min-width: 0; }
.srow .ttl { font-size: 14px; font-weight: 500; }
.srow .ttl.mono { font-size: 12px; font-weight: 400; }
.srow .sub { color: var(--ink2); font-size: 13px; }
.srow .side { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.empty { color: var(--ink3); font-size: 15px; padding: 60px 0; text-align: center; }
.none { color: var(--ink3); font-size: 13px; padding: 4px 0; }

/* Session status dots */
.dot.running { background: var(--k-local); animation: pulse 1.8s ease-in-out infinite; }
.dot.waiting { background: var(--fill); box-shadow: 0 0 0 1.5px var(--accent); }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink3); }
.dot.done { background: var(--ink3); }
.dot.error { background: var(--err); }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Efforts list */
.erow { display: block; width: 100%; padding: 13px 18px; border-left: 3px solid transparent; border-bottom: 1px solid var(--line); }
.erow:hover { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.erow.sel { background: var(--sel); border-left-color: var(--ink); }
.erow .t { display: block; font-size: 15px; font-weight: 600; }
.erow .t.mono { font-size: 12px; font-weight: 500; }
.erow .l { display: block; color: var(--ink2); font-size: 13px; margin-top: 2px; }
.erow .m { display: flex; gap: 10px; margin-top: 7px; font-size: 12px; color: var(--ink3); }
.erow .m b { color: var(--accent); font-weight: 600; }
.time { display: grid; grid-template-columns: 62px 1fr; gap: 4px 12px; }
.time .a { color: var(--ink3); font-size: 12px; padding-top: 3px; }
.time .what { font-size: 14px; }

/* Activity table */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 14px; }
.chip { padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--raised); font-size: 12.5px; color: var(--ink2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr.s { cursor: pointer; }
.tbl tr.s:hover td { background: var(--panel); }
.tbl .ttl { font-size: 14px; font-weight: 500; }
.tbl .ttl.mono { font-size: 12px; font-weight: 400; }
.tbl .doing { color: var(--ink2); font-size: 13px; margin-top: 1px; }
.tbl .dim { color: var(--ink3); font-size: 12.5px; white-space: nowrap; }
.tbl tr.x td { padding-top: 0; border-bottom: 1px solid var(--line); }
.tbl tr.s.open td { border-bottom-color: transparent; }
.st { white-space: nowrap; font-size: 12.5px; color: var(--ink2); }

/* Knowledge base */
.kbnav button { display: flex; justify-content: space-between; width: 100%; padding: 9px 18px; color: var(--ink2); border-left: 3px solid transparent; }
.kbnav button:hover { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.kbnav button.on { background: var(--sel); color: var(--ink); border-left-color: var(--ink); font-weight: 600; }
.kbnav span { color: var(--ink3); font-weight: 400; }
.kbnav .label { padding: 18px 18px 8px; }
.lede { color: var(--ink2); font-size: 14.5px; margin: 6px 0 22px; max-width: 62ch; }
.card { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
.card .glyph { width: 30px; height: 30px; border-radius: 8px; background: var(--sel); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; flex: none; }
.card .body { flex: 1; min-width: 0; }
.card .nm { font-weight: 600; font-size: 15px; }
.card .why { color: var(--ink2); margin-top: 1px; }
.card .seen { color: var(--ink2); font-size: 13px; margin-top: 6px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--ink3); font-size: 12px; }
.card .q { font-size: 14.5px; }
.card input[type="checkbox"] { width: 17px; height: 17px; margin: 4px 0 0 6px; accent-color: var(--accent); flex: none; }
.x { color: var(--ink3); padding: 2px 8px; border-radius: 6px; font-size: 16px; line-height: 1.2; }
.x:hover { background: var(--sel); color: var(--err); }
.add { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 0; border-top: 1px solid var(--line); }
.add input, .add select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
.add input { flex: 1; min-width: 180px; }

/* Toast */
#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 80px); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; display: flex; gap: 14px; align-items: center; transition: transform 0.18s; z-index: 20; max-width: calc(100vw - 32px); }
#toast.show { transform: translate(-50%, 0); }
#toast button { color: var(--toast-act); font-weight: 600; }

@media (max-width: 860px) {
  .top { gap: 10px; overflow-x: auto; }
  .model { display: none; }
  .split, .split.narrow { grid-template-columns: 1fr; height: auto; }
  .pane.list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 48vh; }
  .pane.detail, .page { padding: 20px 16px 48px; }
  h1 { font-size: 24px; }
  .rawblock .ln { grid-template-columns: 1fr; gap: 0; }
  .tbl .hide { display: none; }
}
</style>
</head>

<main id="main"></main>

/* ───────────────────────── State ───────────────────────── */

const KEY = 'slorp.proto.v1';
const VIEWS = ['attention', 'efforts', 'activity', 'knowledge'];
const fresh = () => ({ view: 'attention', sel: null, effortSel: 'snap', kbSel: 'watch', groupBy: 'effort', fluent: true, theme: 'auto',
  handled: {}, moved: {}, sessMoved: {}, extra: [], arrived: {}, collapsed: {}, showHandled: false, variant: {}, rawOpen: {},

try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage unavailable: run in memory */ }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };
let freshId = null;

/* ───────────────────────── Helpers ───────────────────────── */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const num = n => WORDS[n] ?? String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const listOf = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const ago = m => m < 1 ? 'just now' : m < 60 ? `${Math.round(m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
const span = m => m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;

const allItems = () => ITEMS.concat(state.extra.map(id => POOL.find(p => p.id === id)).filter(Boolean));
const itemById = id => allItems().find(i => i.id === id);
const effortById = id => EFFORTS.find(e => e.id === id) || UNSORTED;
const effortOf = it => state.moved[it.id] || it.effort;
const sessEffort = s => state.sessMoved[s.id] || s.effort;
const ageOf = it => state.arrived[it.id] ? (Date.now() - state.arrived[it.id]) / 60000 : it.age;
const isActive = it => { const h = state.handled[it.id]; return !h || (h.how === 'snoozed' && h.until < Date.now()); };
const activeItems = () => allItems().filter(isActive);
const URG_W = { blocking: 0, soon: 1, whenever: 2 };
const byUrgency = (a, b) => URG_W[a.urgency] - URG_W[b.urgency] || ageOf(a) - ageOf(b);

/* A title in whichever voice is switched on: the model's, or the source's. */
const title = (x, cls = '') => state.fluent
  ? `<span class="gen ${cls}">${esc(x.title || x.name)}</span>`
  : `<span class="mono ${cls}">${esc(x.raw)}</span>`;
const kindBadge = (kind, label) => `<span class="kind"><i style="background:var(--k-${kind})"></i>${esc(label || KINDS[kind])}</span>`;
const spark = '<span class="spark" title="Written by the local model">✦</span>';

function groupItems(items) {
  const sorted = items.slice().sort(byUrgency);
  let defs;
  if (state.groupBy === 'urgency') defs = Object.keys(URGENCY).map(k => ({ key: 'u:' + k, name: URGENCY[k], test: i => i.urgency === k }));
  else if (state.groupBy === 'source') defs = Object.keys(KINDS).map(k => ({ key: 'k:' + k, name: KINDS[k], test: i => i.kind === k }));
  else defs = EFFORTS.concat(UNSORTED).map(e => ({ key: 'e:' + e.id, effort: e, name: e.name, test: i => effortOf(i) === e.id }));
  return defs.map(d => ({ ...d, items: sorted.filter(d.test) })).filter(g => g.items.length);
}
const visibleOrder = () => groupItems(activeItems()).filter(g => !state.collapsed[g.key]).flatMap(g => g.items.map(i => i.id));

let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button id="undo">Undo</button>' : ''}`;
  t.classList.add('show');
  if (undo) $('#undo').onclick = () => { undo(); save(); render(); t.classList.remove('show'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
}

function resolve(id, how, note, opts = {}) {
  const order = visibleOrder(), i = order.indexOf(id), it = itemById(id);
  state.handled[id] = { how, note: note || '', at: Date.now(), until: opts.until || 0 };
  if (state.sel === id) state.sel = order[i + 1] || order[i - 1] || null;
  const msg = opts.msg || { answered: `Sent to ${it.src}`, dismissed: 'Dismissed', snoozed: `Snoozed ${note}` }[how];
  toast(msg, () => { delete state.handled[id]; state.sel = id; if (opts.undo) opts.undo(); });
}

function go(view) {
  state.view = view;
  history.replaceState(null, '', '#' + view);
}

function briefing(items) {

    text += blocking.length
      ? `${cap(num(blocking.length))} ${blocking.length === 1 ? 'is' : 'are'} holding work up right now, in ${listOf(where)}.${items.length > blocking.length ? ' The rest will keep.' : ''}`
      : 'Nothing is stopped waiting on you, so all of it will keep.';
  }
  const day = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<div class="brief"><div class="when"><span class="label">${day}</span><span class="label">${spark}briefing</span></div><p>${esc(text)}</p></div>`;
}

function rowHtml(it, act = 'select') {
  const meta = state.groupBy === 'effort' || act !== 'select' ? kindBadge(it.kind, it.src) : `<span>${esc(effortById(effortOf(it)).name)}</span>`;
  return `<button class="row ${it.urgency} ${state.view === 'attention' && it.id === state.sel ? 'sel' : ''} ${it.id === freshId ? 'fresh' : ''}" data-act="${act}" data-id="${it.id}">
    ${title(it, 't')}
    <span class="m">${meta}<span>${ago(ageOf(it))}</span>${it.urgency === 'blocking' ? '<span class="tag blocking">blocking</span>' : ''}</span>
  </button>`;
}

function handledFooter() {
  const done = allItems().filter(i => !isActive(i));
  const legend = `<p>${spark}marks text written by the local model. <span class="mono">Mono</span> is verbatim from the source.</p>`;
  if (!done.length) return `<div class="foot">${legend}</div>`;
  const list = state.showHandled ? `<div class="handled">${done.map(i => `<div><span class="gen">${esc(i.title)}</span><span style="white-space:nowrap">${esc(state.handled[i.id].how)} · <button class="link" data-act="restore" data-id="${i.id}">restore</button></span></div>`).join('')}</div>` : '';
  return `<div class="foot"><p style="margin-bottom:8px">${done.length} handled or snoozed · <button class="link" data-act="toggleHandled">${state.showHandled ? 'hide' : 'show'}</button></p>${list}${legend}</div>`;
}

function rawBlock(lines) {
  return `<div class="rawblock">${lines.map(([who, tx]) => `<div class="ln"><span class="who">${esc(who)}</span><span class="tx">${esc(tx)}</span></div>`).join('')}</div>`;
}

function sessionRow(s) {
  return `<div class="srow"><span class="dot ${s.status}" title="${STATUS[s.status]}"></span>
    <div class="body"><div>${title(s, 'ttl')}</div>${state.fluent ? `<div class="sub">${esc(s.doing)}</div>` : ''}</div>
    <span class="side">${kindBadge(s.kind)} · ${STATUS[s.status]}</span></div>`;
}

function itemDetail(it) {
  const eff = effortById(effortOf(it));
  const v = (state.variant[it.id] || 0) % it.summary.length;
  const siblings = SESSIONS.filter(s => sessEffort(s) === eff.id && s.id !== it.session);
  const rawOpen = state.rawOpen[it.id] ?? !state.fluent;
  let answer;
  if (it.route) {
    answer = `<div class="replies">${EFFORTS.map(e => `<button class="btn" data-act="route" data-id="${it.id}" data-effort="${e.id}">${esc(e.name)}</button>`).join('')}
      <button class="btn quiet" data-act="dismiss" data-id="${it.id}">Leave unsorted</button></div>`;
  } else {
    const quick = (it.replies || []).map((r, i) => `<button class="btn ${i === 0 ? 'go' : ''}" data-act="reply" data-id="${it.id}" data-text="${esc(r)}">${esc(r)}</button>`).join('');
    answer = `${quick ? `<div class="replies">${quick}</div>` : ''}
      <textarea id="reply" data-id="${it.id}" class="${it.draft ? 'drafted' : ''}" placeholder="Or say something else…">${esc(it.draft || '')}</textarea>
      <div class="send"><span>${it.draft ? `${spark}Drafted for you. Edit before sending.` : `Goes back to the ${esc(it.src.toLowerCase())}.`}</span>
      <button class="btn ${quick ? '' : 'go'}" data-act="send" data-id="${it.id}">Send</button></div>`;
  }
  return `<div class="inner">
    <div class="crumb"><button class="eff" data-act="effort" data-id="${eff.id}">${esc(eff.name)} ›</button>${kindBadge(it.kind, it.src)}<span>${ago(ageOf(it))}</span><span class="tag ${it.urgency}">${it.urgency}</span></div>
    <h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? it.title : it.raw)}</h1>
    <div class="need"><div class="label">${spark}What's needed from you</div><p class="ask">${esc(it.ask)}</p>${answer}</div>
    <div class="bar">
      <button class="btn" data-act="snooze" data-id="${it.id}" data-for="hour">Snooze 1h</button>
      <button class="btn" data-act="snooze" data-id="${it.id}" data-for="tomorrow">Until tomorrow</button>
      <button class="btn" data-act="dismiss" data-id="${it.id}">Dismiss</button>
      <button class="btn" data-act="park" data-id="${it.id}">Park as open question</button>
      <select class="btn" data-change="move" data-id="${it.id}" aria-label="Move to another effort">
        <option value="">Move to…</option>
        ${EFFORTS.concat(UNSORTED).filter(e => e.id !== eff.id).map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}
      </select>
    </div>
    <div class="sec"><div class="label"><span>${spark}What's going on</span><button data-act="rephrase" data-id="${it.id}">↻ ${v === 0 ? 'Shorter' : 'Fuller'}</button></div>
      <p class="prose" id="summary">${esc(it.summary[v])}</p></div>
    <div class="sec"><div class="label"><span>From the source, verbatim</span><button data-act="toggleRaw" data-id="${it.id}">${rawOpen ? 'Hide' : 'Show'}</button></div>
      ${rawOpen ? rawBlock(it.lines) : `<div class="none mono">${esc(it.raw)}</div>`}</div>
    <div class="sec"><div class="label"><span>Also going on in ${esc(eff.name)}</span></div>
      ${siblings.length ? siblings.map(sessionRow).join('') : '<div class="none">Nothing else is running here.</div>'}</div>
  </div>`;
}

function viewAttention() {
  const items = activeItems();
  if (!items.some(i => i.id === state.sel)) state.sel = visibleOrder()[0] || null;
  const groups = groupItems(items).map(g => {
    const shut = state.collapsed[g.key];
    const name = g.effort ? title(g.effort) : esc(g.name);
    return `<div class="ghead">
        <button class="name" data-act="collapse" data-key="${g.key}"><span class="chev ${shut ? 'shut' : ''}">▼</span> ${name}</button>
        <span class="n">${g.items.length}</span>
        ${g.effort ? `<button class="open" data-act="effort" data-id="${g.effort.id}" title="Open this effort">open ›</button>` : ''}
      </div>
      ${g.effort && state.fluent && !shut ? `<div class="gline">${esc(g.effort.line)}</div>` : ''}
      ${shut ? '' : g.items.map(i => rowHtml(i)).join('')}`;
  }).join('');
  const seg = ['effort', 'urgency', 'source'].map(b => `<button class="${state.groupBy === b ? 'on' : ''}" data-act="group" data-by="${b}">${cap(b)}</button>`).join('');
  const sel = state.sel && itemById(state.sel);
  return `<div class="split">
    <section class="pane list" data-scroll="att-list">
      ${briefing(items)}
      <div class="listbar"><span class="label">Needs you</span><span class="seg" role="group" aria-label="Group by">${seg}</span></div>
      ${groups}
      ${handledFooter()}
    </section>
    <section class="pane detail" data-scroll="att-${state.sel}">${sel ? itemDetail(sel) : `<div class="empty">${spark}All clear. Go make something.</div>`}</section>
  </div>`;
}

/* ───────────────────────── Efforts ───────────────────────── */

function effortDetail(e) {
  const needs = activeItems().filter(i => effortOf(i) === e.id).sort(byUrgency);
  const sess = SESSIONS.filter(s => sessEffort(s) === e.id);
  const qs = state.kb.questions.filter(q => q.effort === e.id);
  const watch = state.kb.watch.filter(w => w.efforts.includes(e.id));
  return `<div class="inner">
    <div class="crumb"><span class="mono">${esc(e.raw)}</span></div>
    <h1>${esc(e.name)}</h1>
    <div class="sec"><div class="label"><span>${spark}Where this stands</span></div><p class="prose">${esc(e.stands)}</p></div>
    <div class="sec"><div class="label"><span>Needs you (${needs.length})</span></div>
      ${needs.length ? `<div style="margin:0 -18px">${needs.map(i => rowHtml(i, 'openItem')).join('')}</div>` : '<div class="none">Nothing. This effort is moving without you.</div>'}</div>
    <div class="sec"><div class="label"><span>Sessions and workers (${sess.length})</span></div>
      ${sess.length ? sess.map(sessionRow).join('') : '<div class="none">Nothing running.</div>'}</div>
    <div class="sec"><div class="label"><span>Open questions (${qs.length})</span><button data-act="kbGo" data-s="questions">Manage ›</button></div>
      ${qs.length ? qs.map(q => `<div class="srow"><div class="body">${esc(q.text)}</div><span class="side">${ago(q.age)}</span></div>`).join('') : '<div class="none">None recorded.</div>'}</div>
    <div class="sec"><div class="label"><span>Watching</span><button data-act="kbGo" data-s="watch">Manage ›</button></div>
      ${watch.length ? watch.map(w => `<div class="srow"><div class="body"><b>${esc(w.name)}</b><div class="sub">${esc(w.seen)}</div></div><span class="side">${ago(w.seenAge)}</span></div>`).join('') : '<div class="none">No people or channels tied to this effort.</div>'}</div>
    ${e.lately.length ? `<div class="sec"><div class="label"><span>${spark}Lately</span></div><div class="time">${e.lately.map(([a, x]) => `<span class="a">${ago(a)}</span><span class="what">${esc(x)}</span>`).join('')}</div></div>` : ''}
  </div>`;
}

function viewEfforts() {
  const all = EFFORTS.concat(UNSORTED);
  const rows = all.map(e => {
    const n = activeItems().filter(i => effortOf(i) === e.id).length;
    const live = SESSIONS.filter(s => sessEffort(s) === e.id && s.status === 'running').length;
    const total = SESSIONS.filter(s => sessEffort(s) === e.id).length;
    return `<button class="erow ${e.id === state.effortSel ? 'sel' : ''}" data-act="effortSel" data-id="${e.id}">
      ${title(e, 't')}${state.fluent ? `<span class="l">${esc(e.line)}</span>` : ''}
      <span class="m">${n ? `<b>${n} need${n === 1 ? 's' : ''} you</b>` : '<span>nothing needs you</span>'}<span>${total} session${total === 1 ? '' : 's'}, ${live ? live : 'none'} running</span></span>
    </button>`;
  }).join('');
  return `<div class="split">
    <section class="pane list" data-scroll="eff-list"><div class="listbar"><span class="label">Work efforts</span></div>${rows}</section>
    <section class="pane detail" data-scroll="eff-${state.effortSel}">${effortDetail(effortById(state.effortSel))}</section>
  </div>`;
}

/* ───────────────────────── Activity ───────────────────────── */

function viewActivity() {
  const order = Object.keys(STATUS);
  const count = k => SESSIONS.filter(s => s.status === k).length;
  const lede = `${cap(num(SESSIONS.length))} things are running or recently finished. ${cap(num(count('waiting')))} are stopped waiting on you, ${num(count('error'))} failed overnight, and the rest are getting on with it.`;
  const filters = [['all', 'Everything']].concat(Object.entries(KINDS).filter(([k]) => SESSIONS.some(s => s.kind === k)))
    .map(([k, n]) => `<button class="chip ${state.actFilter === k ? 'on' : ''}" data-act="actFilter" data-f="${k}">${esc(n)}</button>`).join('');
  const rows = SESSIONS.filter(s => state.actFilter === 'all' || s.kind === state.actFilter)
    .sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status) || a.last - b.last)
    .map(s => {
      const open = state.expanded[s.id];
      const it = activeItems().find(i => i.session === s.id);
      return `<tr class="s ${open ? 'open' : ''}" data-act="expand" data-id="${s.id}">
        <td class="st"><span class="dot ${s.status}"></span>${STATUS[s.status]}</td>
        <td><div>${title(s, 'ttl')}</div>${state.fluent ? `<div class="doing">${esc(s.doing)}</div>` : ''}</td>
        <td class="dim">${kindBadge(s.kind)}</td>
        <td class="dim hide">${esc(effortById(sessEffort(s)).name)}</td>
        <td class="dim hide mono">${esc(s.where)}</td>
        <td class="dim hide">${span(s.started)}</td>
        <td class="dim">${ago(s.last)}</td>
      </tr>${open ? `<tr class="x"><td></td><td colspan="6">${rawBlock(s.tail.map(t => ['last output', t]))}
        <div class="bar" style="margin:10px 0 14px">${it ? `<button class="btn go" data-act="openItem" data-id="${it.id}">See what it needs ›</button>` : ''}<button class="btn" data-act="effort" data-id="${sessEffort(s)}">Open effort ›</button></div></td></tr>` : ''}`;
    }).join('');
  return `<div class="page">
    <h1>Everything that's running</h1>
    <p class="prose" style="margin-top:10px">${spark}${esc(lede)}</p>
    <div class="chips">${filters}</div>
    <table class="tbl"><thead><tr><th class="label">Status</th><th class="label">What</th><th class="label">Kind</th><th class="label hide">Effort</th><th class="label hide">Where</th><th class="label hide">Age</th><th class="label">Last activity</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

/* ───────────────────────── Knowledge base ───────────────────────── */

const effortOptions = () => EFFORTS.map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('');
const GLYPH = { person: '@', channel: '#', dm: '✉' };

function kbBody(sec) {
  const list = state.kb[sec];
  const rm = id => `<button class="x" data-act="kbRemove" data-sec="${sec}" data-id="${id}" title="Remove" aria-label="Remove">×</button>`;
  if (sec === 'watch') return list.map(w => `<div class="card"><span class="glyph">${GLYPH[w.type]}</span>
      <div class="body"><div class="nm">${esc(w.name)}</div><div class="why">${esc(w.why)}</div>
      ${w.seen ? `<div class="seen">${spark}${esc(w.seen)} <span class="dim" style="color:var(--ink3)">${ago(w.seenAge)}</span></div>` : ''}
      <div class="meta"><span>checked ${esc(w.cadence)}</span>${w.efforts.map(id => `<button class="link" data-act="effort" data-id="${id}">${esc(effortById(id).name)}</button>`).join('')}</div></div>${rm(w.id)}</div>`).join('')
    + `<form class="add" data-form="watch"><select name="type" aria-label="Type"><option value="person">Person</option><option value="channel">Channel</option><option value="dm">DM</option></select>
      <input name="name" placeholder="Name or #channel" required><input name="why" placeholder="Why it's worth watching" required>
      <select name="effort" aria-label="Effort">${effortOptions()}</select><button class="btn go">Add</button></form>`;
  if (sec === 'questions') return list.map(q => `<div class="card"><input type="checkbox" data-change="kbResolve" data-id="${q.id}" aria-label="Mark resolved">
      <div class="body"><div class="q">${esc(q.text)}</div>
      <div class="meta"><button class="link" data-act="effort" data-id="${q.effort}">${esc(effortById(q.effort).name)}</button><span>${ago(q.age)}</span><span>${esc(q.origin)}</span></div></div>${rm(q.id)}</div>`).join('')
    + `<form class="add" data-form="questions"><input name="text" placeholder="Something you haven't decided yet" required>
      <select name="effort" aria-label="Effort">${effortOptions()}</select><button class="btn go">Add</button></form>`;
  return list.map(c => `<div class="card fact"><div class="body"><div class="q">${esc(c.text)}</div></div>${rm(c.id)}</div>`).join('')
    + `<form class="add" data-form="${sec}"><input name="text" placeholder="${sec === 'context' ? 'A fact the summarizer should always know' : 'A rule for filing things under efforts'}" required><button class="btn go">Add</button></form>`;
}

function viewKnowledge() {
  const nav = Object.entries(KB_SECTIONS).map(([k, s]) => `<button class="${state.kbSel === k ? 'on' : ''}" data-act="kbSel" data-s="${k}">${s.name}<span>${state.kb[k].length}</span></button>`).join('');
  const s = KB_SECTIONS[state.kbSel];
  return `<div class="split narrow">
    <section class="pane list kbnav"><div class="label">Knowledge base</div>${nav}</section>
    <section class="pane detail" data-scroll="kb-${state.kbSel}"><div class="inner"><h1>${s.name}</h1><p class="lede">${s.lede}</p>${kbBody(state.kbSel)}</div></section>
  </div>`;
}

/* ───────────────────────── Shell ───────────────────────── */

const RENDER = { attention: viewAttention, efforts: viewEfforts, activity: viewActivity, knowledge: viewKnowledge };

function render() {
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const draft = $('#reply') && { id: $('#reply').dataset.id, value: $('#reply').value };
  const menuOpen = $('#menu')?.open;

  document.documentElement.dataset.theme = state.theme;
  const main = RENDER[state.view]();  // first: it may settle the selection
  const n = activeItems().length;
  $('#nav').innerHTML = VIEWS.map(v => `<button class="${state.view === v ? 'on' : ''}" data-act="view" data-view="${v}">${cap(v)}${v === 'attention' && n ? `<span class="count">${n}</span>` : ''}</button>`).join('');
  $('#tools').innerHTML = `
    <span class="model"><span class="dot running"></span>qwen3:14b · local · caught up</span>
    <span class="seg" role="group" aria-label="Voice" title="Fluent shows what the model wrote. Raw shows what the sources said. (r)">
      <button class="${state.fluent ? 'on' : ''}" data-act="fluent" data-on="1">Fluent</button><button class="${state.fluent ? '' : 'on'}" data-act="fluent" data-on="0">Raw</button></span>
    <button class="icon" data-act="theme" title="Light or dark" aria-label="Toggle theme">◐</button>
    <details class="menu" id="menu" ${menuOpen ? 'open' : ''}><summary class="icon" title="Prototype controls" aria-label="Prototype controls">⋯</summary>
      <div class="pop"><p>Prototype controls</p>
        <button data-act="simulate">Simulate an incoming item</button>
        <button data-act="reset">Reset the demo</button>
        <p>Keys: j/k move · e dismiss · s snooze · r fluent/raw · 1–4 views</p></div></details>`;
  $('#main').innerHTML = main;

  document.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll]; });
  const ta = $('#reply');
  if (ta && draft && draft.id === ta.dataset.id) ta.value = draft.value;
  freshId = null;
}

const actions = {
  view: d => go(d.view),
  select: d => { state.sel = d.id; },
  group: d => { state.groupBy = d.by; },
  collapse: d => { state.collapsed[d.key] = !state.collapsed[d.key]; },
  fluent: d => { state.fluent = d.on === '1'; },
  theme: () => {
    const dark = state.theme === 'dark' || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    state.theme = dark ? 'light' : 'dark';
  },
  reply: d => resolve(d.id, 'answered', d.text),
  send: d => {
    const ta = $('#reply'), text = ta.value.trim();
    if (!text) { ta.focus(); return false; }
    ta.value = '';
    resolve(d.id, 'answered', text);
  },
  dismiss: d => resolve(d.id, 'dismissed'),
  snooze: d => {
    const until = new Date();
    if (d.for === 'tomorrow') { until.setDate(until.getDate() + 1); until.setHours(9, 0, 0, 0); } else until.setHours(until.getHours() + 1);
    const note = d.for === 'tomorrow' ? 'until tomorrow at 9:00' : `until ${until.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    resolve(d.id, 'snoozed', note, { until: until.getTime() });
  },
  park: d => {
    const it = itemById(d.id), qid = 'q' + (++state.seq);
    state.kb.questions.unshift({ id: qid, text: it.title, effort: effortOf(it) === 'unsorted' ? 'slorp' : effortOf(it), age: 0, origin: `parked from a ${it.src.toLowerCase()}` });
    resolve(d.id, 'parked', '', { msg: 'Parked as an open question', undo: () => { state.kb.questions = state.kb.questions.filter(q => q.id !== qid); } });
  },
  route: d => {
    const it = itemById(d.id), name = effortById(d.effort).name;
    state.moved[it.id] = d.effort;
    if (it.session) state.sessMoved[it.session] = d.effort;
    resolve(d.id, 'filed', '', { msg: `Filed under ${name}`, undo: () => { delete state.moved[it.id]; delete state.sessMoved[it.session]; } });
  },
  restore: d => { delete state.handled[d.id]; state.sel = d.id; },
  toggleHandled: () => { state.showHandled = !state.showHandled; },
  toggleRaw: d => { state.rawOpen[d.id] = !(state.rawOpen[d.id] ?? !state.fluent); },
  rephrase: d => {
    $('#summary').classList.add('thinking');  // stand-in for local model latency
    setTimeout(() => { state.variant[d.id] = (state.variant[d.id] || 0) + 1; save(); render(); }, 650);
    return false;
  },
  effort: d => { state.effortSel = d.id; go('efforts'); },
  effortSel: d => { state.effortSel = d.id; },
  openItem: d => { state.sel = d.id; go('attention'); },
  expand: d => { state.expanded[d.id] = !state.expanded[d.id]; },
  actFilter: d => { state.actFilter = d.f; },
  kbSel: d => { state.kbSel = d.s; },
  kbGo: d => { state.kbSel = d.s; go('knowledge'); },
  kbRemove: d => {
    const list = state.kb[d.sec], i = list.findIndex(x => x.id === d.id), gone = list.splice(i, 1)[0];
    toast('Removed', () => { state.kb[d.sec].splice(i, 0, gone); });
  },
  simulate: () => {
    const next = POOL.find(p => !state.extra.includes(p.id));
    if (!next) { toast('No more canned items. Reset the demo to replay them.'); return false; }
    state.extra.push(next.id);
    state.arrived[next.id] = Date.now();
    freshId = next.id;
    toast(`New in ${effortById(next.effort).name}: ${next.title}`);
  },
  reset: () => { const { view, theme } = state; state = Object.assign(fresh(), { view, theme }); toast('Demo reset'); },
};
const changes = {
  move: (d, el) => {
    if (!el.value) return false;
    const prev = state.moved[d.id];
    state.moved[d.id] = el.value;
    toast(`Moved to ${effortById(el.value).name}`, () => { if (prev) state.moved[d.id] = prev; else delete state.moved[d.id]; });
  },
  kbResolve: d => {
    const i = state.kb.questions.findIndex(q => q.id === d.id), gone = state.kb.questions.splice(i, 1)[0];
    toast('Resolved', () => { state.kb.questions.splice(i, 0, gone); });
  },
};

document.addEventListener('click', e => {
  if (!e.target.closest('#menu')) $('#menu')?.removeAttribute('open');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (actions[el.dataset.act](el.dataset, el) !== false) { save(); render(); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change](el.dataset, el) !== false) { save(); render(); }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form)), sec = form.dataset.form, id = sec[0] + (++state.seq);
  if (sec === 'watch') state.kb.watch.push({ id, type: f.type, name: f.name, why: f.why, efforts: [f.effort], cadence: 'daily', seen: '', seenAge: 0 });
  else if (sec === 'questions') state.kb.questions.unshift({ id, text: f.text, effort: f.effort, age: 0, origin: 'you wrote this down' });
  else state.kb[sec].push({ id, text: f.text });
  save(); render();
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const att = state.view === 'attention';
  if (/^[1-4]$/.test(e.key)) go(VIEWS[e.key - 1]);
  else if (e.key === 'r') state.fluent = !state.fluent;
  else if (att && (e.key === 'j' || e.key === 'k')) {
    const order = visibleOrder(), i = order.indexOf(state.sel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.sel = order[i];
  }
  else if (att && state.sel && e.key === 'e') actions.dismiss({ id: state.sel });
  else if (att && state.sel && e.key === 's') actions.snooze({ id: state.sel, for: 'hour' });
  else return;
  e.preventDefault();
  save(); render();
  $('.row.sel')?.scrollIntoView({ block: 'nearest' });
});
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (VIEWS.includes(v) && v !== state.view) { state.view = v; render(); }
});

if (VIEWS.includes(location.hash.slice(1))) state.view = location.hash.slice(1);
render();
</script>
