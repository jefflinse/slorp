    <div class="crumb">${a.effort ? `<button class="eff" data-act="effort" data-id="${a.effort}">${effortMark(effortById(a.effort), 's')}${esc(effortById(a.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${a.agent ? kindBadge(a.agent) : ''}${stat('done', `closed ${ago(minsSince(a.endedAt))}`)}${ran}${a.branch ? `<span class="mono">${esc(a.branch)}</span>` : ''}${a.cwd ? `<span class="mono" title="${esc(a.cwd)}">${esc(shortPath(a.cwd))}</span>` : ''}</div>
    <h1>${esc(a.label)}</h1>
    ${a.title && state.fluent ? `<p class="subt">${spark}${esc(a.title)}</p>` : ''}
    ${cmd ? `<div class="need"><div class="label">Pick it back up</div>
      <div class="cmd"><span class="mono">${esc(cmd)}</span><button class="btn" data-act="copyText" data-text="${esc(cmd)}" title="Copy the command that reopens this session in a terminal">Copy</button></div>
      <div class="replies"><button class="btn go" data-act="reopen" data-id="${a.id}">Reopen in the background</button>
        <span class="none" style="align-self:center">Its conversation is kept. Reopened, it waits for a message.</span></div></div>` : ''}
    <div class="sec"><div class="label"><span>${a.summary ? spark : ''}How it stood</span></div>
      <p class="prose">${a.summary ? esc(a.summary) : `<span class="none">${modelless() ? `${NO_MODEL}, so it was not summarized.` : 'The model wrote nothing about it before it closed.'}</span>`}</p></div>
    ${doc && (doc.subagents || []).length ? `<div class="sec"><div class="label"><span>Subagents (${doc.subagents.length})</span></div>${subsBody(a.id, doc.subagents, true)}</div>` : ''}
    ${doc ? timeline(doc) || '<div class="label tlhead"><span>Timeline</span></div><div class="none">Nothing was said in it while Slorp was watching.</div>' : '<div class="none" style="margin-top:28px">Fetching its timeline…</div>'}
  </div>`;
}

function viewSessionsLive() {
  const [open, closed] = liveSessions();
  const find = id => open.find(s => s.id === id) || closed.find(a => a.id === id);
  if (!find(state.actSel)) state.actSel = actShown(open, closed).map(x => x.id)[0] || null;
  const sel = find(state.actSel), isOpen = sel && open.includes(sel), it = isOpen && itemOf(sel);
  if (sel && !isOpen) fetchArchived(sel.id);
  const n = k => open.filter(s => s.status === k).length;
  const line = `${open.length ? `${cap(num(n('waiting')))} awaiting you, ${num(n('working'))} working, ${num(n('idle') + n('done') + n('failed'))} quiet.` : 'No agent sessions are open on this machine.'}${isOffline ? ' <b>The Slorp service stopped responding; this is the last it reported.</b>' : ''}`;
  let detail = '', side = '';
  if (isOpen) {
    const [dot, word] = statusOf(sel), stale = !it && sel.status === 'working';
    detail = sessionPage(sel, it, `${stat(dot, sel.waitingFor ? `${word}, ${esc(sel.waitingFor)}` : word)}<span>active ${ago(minsSince(sel.activeAt))}</span>`);
    side = sessionSide(sel, it ? it.summary : sel.insight?.summary, stale, 'act-side');
  } else if (sel) detail = closedPage(sel);
  return sessionsView([
    ['active', 'Active', open.length, line, open.map(sessionRowLive).join('')],
    ['closed', 'Closed', closed.length, closed.length ? 'Each as it stood when it closed.' : 'Sessions are kept here once they close.', closed.map(a => closedRow(a)).join('')],
  ], detail, side);
}

const fileLine = x => x.path ? `${x.path.split('/').pop()}${x.line ? `:${x.line}` : ''}` : '';
const who = (name, d) => d && name && name.toLowerCase() === (d.viewer || '').toLowerCase() ? 'you' : name || 'someone';

/* The whole of a pull request's discussion is fetched when its page is opened, and again when it has been read afresh. */
let pullDocs = {}, pullAsked = {};
function fetchPull(p) {
  const key = pullKey(p), stamp = `${p.readAt || ''}`;
  if (!live || pullAsked[key] === stamp) return;
  pullAsked[key] = stamp;
  fetch(`/api/pulls/${encodeURIComponent(p.source)}/${p.number}?repo=${encodeURIComponent(p.repo)}`).then(r => r.ok ? r.json() : null)
    .then(doc => { if (doc) { pullDocs[key] = doc.discussion; render(); } }).catch(() => { delete pullAsked[key]; });
}
const discussionOf = p => live ? pullDocs[pullKey(p)] : MOCK_DISCUSSIONS[pullKey(p)];

/* The pull requests as their list shows them: those where the next move is the user's, those waiting on someone else, and drafts. */
function pullGroups() {
  const test = (PULL_FILTERS.find(([k]) => k === state.pullFilter) || PULL_FILTERS[0])[2], shown = allPulls().filter(test);
  return [['you', 'Your move', shown.filter(yourMove)], ['others', 'Waiting on others', shown.filter(p => !yourMove(p) && !p.draft)], ['drafts', 'Drafts', shown.filter(p => !yourMove(p) && p.draft)]];
}
const pullsShown = () => pullGroups().flatMap(([key, , list]) => state.collapsed['pr:' + key] ? [] : list);

function pullRow(p, act = 'pullSel') {
  const [word, tone] = pullState(p), open = openPoints(p).length, next = state.fluent && p.brief?.next;
  return `<button class="row ${act === 'pullSel' && pullKey(p) === state.pullSel ? 'sel' : ''}" data-act="${act}" data-id="${esc(pullKey(p))}" style="${kindColor('github')}">
    <span class="h"><span class="t">${esc(clip(p.title, 90))}</span><span class="w"><span>${ago(pullAt(p))}</span>${p.urgency === 'blocking' || p.urgency === 'awaiting' ? `<span class="tag ${p.urgency}">${p.urgency}</span>` : ''}</span></span>
    <span class="st">${next ? spark + esc(next) : esc(p.needs)}</span>
    ${state.rows === 'short' ? '' : `<span class="m"><span class="mono">${esc(p.repo.split('/').pop())}#${p.number}</span><span>${p.mine ? 'yours' : `by ${esc(p.author || 'someone')}`}${p.reviewed ? ', reviewed' : ''}</span>
      <span class="pr ${tone}">${word}</span>${open ? `<span class="pr warn" title="Things in its discussion that wait on you">${open} for you</span>` : ''}</span>`}
  </button>`;
}

/* One point of a discussion that waits on the user: what the model made of it, who said it where, and what was said. */
function pointHtml(p, x) {
  const [word, tone] = SORTS[x.sort] || [], open = state.expanded['pt:' + x.id], where = fileLine(x);
  return `<div class="pt">
    <div class="pth">${word ? `<span class="tag ${tone}">${word}</span>` : ''}<span class="ptl">${x.gist ? spark + esc(x.gist) : `${esc(x.who)} ${where ? `on ${esc(where)}` : POINT_KINDS[x.kind] || 'spoke last'}`}</span></div>
    <div class="said ${open ? 'open' : ''}"><div class="tx">${esc(x.text)}</div><button class="link" data-act="expand" data-id="pt:${esc(x.id)}" hidden>${open ? 'Show less' : 'Show all of it'}</button></div>
    <div class="ptm"><span>${esc(x.who)}</span>${where ? `<span class="mono" title="${esc(x.path)}">${esc(where)}</span>` : `<span>${POINT_KINDS[x.kind] || ''}</span>`}<span title="${esc(new Date(x.at).toLocaleString())}">${ago(minsSince(x.at))}</span>
      ${/^https:\/\//.test(x.url || '') ? `<a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Answer on GitHub ↗</a>` : ''}</div>
  </div>`;
}

/* What a pull request's page leads with: the points open for the user, or failing any, what it waits on. */
function pullNeeds(p) {
  const open = openPoints(p), rest = (p.points || []).filter(x => x.sort === 'settled'), more = state.expanded['settled:' + pullKey(p)];
  const sorted = (p.points || []).some(x => x.sort), link = /^https:\/\//.test(p.url || '') ? `<a class="btn ${open.length ? '' : 'go'}" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Open on GitHub ↗</a>` : '';
  const reading = live && !p.readAt ? '<div class="none">Reading its discussion…</div>' : '';
  return `<div class="need"><div class="label">${open.length ? `${sorted ? spark : ''}Open for you (${open.length})` : p.onYou ? "What's needed from you" : 'Nothing is waiting on you'}</div>
    ${open.length ? '' : `<p class="ask">${esc(p.needs)}</p>`}${open.map(x => pointHtml(p, x)).join('')}${reading}
    ${open.length && !sorted ? `<div class="none">${modelless() ? `${NO_MODEL}, so these are everything where someone else spoke last, unsorted.` : 'Not sorted by the model yet: these are everything where someone else spoke last.'}</div>` : ''}
    ${rest.length ? `<button class="link" data-act="expand" data-id="settled:${esc(pullKey(p))}">${more ? 'Hide' : 'Show'} ${plural(rest.length, 'more')} the model reads as needing nothing</button>${more ? rest.map(x => pointHtml(p, x)).join('') : ''}` : ''}
    <div class="replies" style="margin-top:14px">${link}<span class="none" style="align-self:center">Slorp only reads GitHub. Anything you do there, you do there.</span></div></div>`;
}

/* A pull request's discussion as conversations, the latest spoken in first: each thread on a line of the change, and each comment or review on its own. */
function pullTalk(p, d) {
  const msg = (c, state) => `<div class="msg"><div class="by"><b>${esc(who(c.author, d))}</b>${state ? `<span>${esc(state)}</span>` : ''}<span title="${esc(new Date(c.at).toLocaleString())}">${ago(minsSince(c.at))}</span>
      ${/^https:\/\//.test(c.url || '') ? `<a class="link" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">↗</a>` : ''}</div>${c.body ? `<div class="tx">${md(c.body)}</div>` : ''}</div>`;
  const convs = d.threads.filter(t => t.comments.length).map(t => {
    const key = `th:${pullKey(p)}:${t.path}:${t.line}:${t.comments[0].at}`, shut = t.resolved && !state.expanded[key];
    return { at: t.comments.at(-1).at, html: `<div class="conv ${t.resolved ? 'resolved' : ''}"><button class="convh" data-act="${t.resolved ? 'expand' : 'noop'}" data-id="${esc(key)}"><span class="mono" title="${esc(t.path)}">${esc(fileLine(t))}</span>
        <span>${t.resolved ? 'resolved' : 'unresolved'}${t.outdated ? ', on a line since changed' : ''}</span><span>${plural(t.comments.length, 'comment')}</span>${t.resolved ? `<span class="chev ${shut ? 'shut' : ''}">▼</span>` : ''}</button>
        ${shut ? '' : t.comments.map(c => msg(c)).join('')}</div>` };
  }).concat(d.comments.map(c => ({ at: c.at, html: `<div class="conv">${msg(c, 'commented')}</div>` })),
    d.reviews.filter(r => r.body || r.state !== 'commented').map(r => ({ at: r.at, html: `<div class="conv">${msg(r, r.state === 'commented' ? 'reviewed' : r.state)}</div>` })));
  return convs.sort((a, b) => new Date(b.at) - new Date(a.at)).map(c => c.html).join('') || '<div class="none">Nothing has been said on it yet.</div>';
}

function pullTabs(p, d) {
  const on = ['commits', 'about'].includes(state.pullTab) ? state.pullTab : 'talk';
  const tab = (key, name) => `<button class="label ${on === key ? 'on' : ''}" data-act="pullTab" data-t="${key}">${name}</button>`;
  if (!d) return `<div class="tabs" role="tablist">${tab('talk', 'Discussion')}</div><div class="tabbody"><div class="none">${live && p.readAt ? 'Fetching its discussion…' : live ? 'Its discussion has not been read yet. Pull requests are read a few at a time, this one next.' : 'No discussion in this demo.'}</div></div>`;
  const commits = () => `${d.commitCount > d.commits.length ? `<div class="none">The latest ${num(d.commits.length)} of ${num(d.commitCount)}.</div>` : ''}${d.commits.slice().reverse().map(c => `<div class="srow"><span class="mono" style="font-size:12px">${esc(c.id)}</span>
      <div class="body"><div class="ttl">${esc(c.headline)}</div></div><span class="side">${esc(who(c.author, d))} · ${ago(minsSince(c.at))}</span></div>`).join('') || '<div class="none">No commits were listed.</div>'}`;
  return `<div class="tabs" role="tablist">${tab('talk', 'Discussion')}${tab('commits', `Commits<span class="n">${d.commitCount || d.commits.length}</span>`)}${tab('about', 'Description')}</div>
    <div class="tabbody">${on === 'commits' ? commits() : on === 'about' ? (d.body ? md(d.body) : '<div class="none">It has no description.</div>') : pullTalk(p, d)}</div>`;
}

/* The model's account of a pull request, or why there is none. */
function pullStands(p) {
  const b = p.brief;
  if (b) return `<p class="prose">${esc(b.stands)}</p>${b.next ? `<p class="prose" style="margin-top:8px"><b>Next.</b> ${esc(b.next)}</p>` : ''}
    ${p.behind && !modelless() ? '<div class="none" style="margin-top:8px">Written before its latest changes. It is being written again.</div>' : p.behind ? `<div class="none" style="margin-top:8px">Written before its latest changes, and ${NO_MODEL.toLowerCase()} to write it again.</div>` : ''}`;
  return `<p class="prose"><span class="none">${!live ? 'Not written for this one.' : modelless() ? `${NO_MODEL}, so this is not summarized. What is waiting on you is still picked out, by who spoke last.` : p.readAt ? 'Being written…' : 'Its discussion has not been read yet.'}</span></p>`;
}

/* What was pushed to a pull request since the user reviewed it: the model's account, and the files that changed. */
function pullSince(p, d) {
  const c = d && d.since, told = p.brief && p.brief.since;
  if (!c) return '';
  const lines = c.files.reduce((n, f) => [n[0] + f.additions, n[1] + f.deletions], [0, 0]), open = state.expanded['since:' + pullKey(p)];
  const files = c.files.map(f => `<div class="srow"><div class="body"><span class="mono" style="font-size:12px">${esc(f.path)}</span></div><span class="side">${f.status === 'modified' ? '' : `${esc(f.status)} · `}+${f.additions} −${f.deletions}</span></div>`).join('');
  return `<div class="sec"><div class="label"><span>${told ? spark : ''}Since you reviewed</span></div>
    <p class="prose">${told ? esc(told) : `<span class="none">${modelless() ? `${NO_MODEL}, so what was pushed is not summarized.` : 'Not summarized yet.'}</span>`}</p>
    ${c.rebuilt ? '<div class="none" style="margin-top:8px">The branch was rebuilt since, so this covers everything it now changes, not only what is new.</div>' : ''}
    <div class="none" style="margin-top:8px">${cap(plural(c.commits, 'commit'))} since <span class="mono">${esc(c.from)}</span>, changing ${plural(c.files.length + (c.more || 0), 'file')} of the pull request${c.files.length ? ` by +${lines[0]} −${lines[1]}` : ''}.
      ${c.files.length ? `<button class="link" data-act="expand" data-id="since:${esc(pullKey(p))}">${open ? 'Hide them' : 'List them'}</button>` : ''}
      ${/^https:\/\//.test(c.url || '') ? `<a class="link" href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">See the changes on GitHub ↗</a>` : ''}</div>
    ${open ? `${files}${c.more ? `<div class="none">And ${plural(c.more, 'more')}.</div>` : ''}` : ''}</div>`;
}

/* What is known of a pull request that its page does not otherwise say. */
function aboutPull(p, d) {
  const on = live ? sessionsOn(p) : [], real = p.effort && p.effort !== 'unsorted';
  const reviews = [p.approvals && `${num(p.approvals)} approved`, p.changesRequested && `<span class="bad">${num(p.changesRequested)} asked for changes</span>`,
    d && d.requested.length ? `still to review: ${esc(listOf(d.requested.map(n => who(n, d))))}` : p.awaiting && `${num(p.awaiting)} still to review`].filter(Boolean);
  const facts = [
    ['Repository', `<span class="mono">${esc(p.repo)}#${p.number}</span>`],
    ['Author', p.mine ? 'you' : esc(p.author || 'someone')],
    p.branch && ['Branch', `<span class="mono">${esc(p.branch)}</span>${p.base ? ` into <span class="mono">${esc(p.base)}</span>` : ''}`],
    ['Reviews', reviews.join(', ') || 'none yet'],
    ['Checks', `<span class="${p.checks === 'failing' ? 'bad' : ''}">${esc(p.checks)}</span>${d && d.failing.length ? `: ${esc(listOf(d.failing))}` : ''}`],
    ['Merge', p.conflicts ? '<span class="bad">conflicts with its base</span>' : p.draft ? 'a draft' : 'no conflicts reported'],
    d && ['Size', `+${d.additions} −${d.deletions} in ${plural(d.files, 'file')}, ${plural(d.commitCount, 'commit')}`],
    ['Filed under', real ? `<button class="link" data-act="effort" data-id="${p.effort}">${esc(effortById(p.effort).name)}</button>` : 'Unsorted'],
    on.length && ['Sessions', on.map(s => `<button class="link" data-act="openSession" data-id="${s.id}">${esc(clip(s.label, 40))}</button>`).join(', ')],
    ['Changed', `<span title="${esc(p.at ? new Date(p.at).toLocaleString() : '')}">${ago(pullAt(p))}</span>`],
    p.readAt && ['Read', `<span title="When Slorp last read its discussion from GitHub">${ago(minsSince(p.readAt))}</span>`],
  ].filter(Boolean);
  return `<div class="label tlhead"><span>Details</span></div><dl class="facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
}

/* What has been said and done on a pull request, newest first, a line each. */
function pullTimeline(d) {
  if (!d) return '';
  const did = { approved: 'approved', 'changes requested': 'asked for changes', commented: 'reviewed', dismissed: 'had a review dismissed' };
  const ev = d.comments.map(c => ({ at: c.at, line: `${who(c.author, d)} commented`, text: c.body }))
    .concat(d.reviews.map(r => ({ at: r.at, line: `${who(r.author, d)} ${did[r.state] || 'reviewed'}`, text: r.body })),
      d.threads.flatMap(t => t.comments.map(c => ({ at: c.at, line: `${who(c.author, d)} on ${fileLine(t)}`, text: c.body }))),
      d.commits.map(c => ({ at: c.at, line: `${who(c.author, d)} pushed`, text: c.headline })))
    .sort((a, b) => new Date(b.at) - new Date(a.at)).slice(0, 40);
  return `<div class="label tlhead"><span>Timeline</span></div>${ev.length ? '' : '<div class="none">Nothing has happened on it yet.</div>'}<ol class="tl">${ev.map(e => `<li><span class="when" title="${esc(new Date(e.at).toLocaleString())}">${minsSince(e.at) < 1 ? 'now' : span(minsSince(e.at))}</span>
    <div><div class="line">${esc(e.line)}</div>${e.text ? `<div class="you" title="${esc(clip(e.text, 600))}">${esc(clip(e.text, 200))}</div>` : ''}</div></li>`).join('')}</ol>`;
}

function pullPage(p, d) {
  const real = p.effort && p.effort !== 'unsorted', [word, tone] = pullState(p), on = live ? sessionsOn(p) : [];
  return `<div class="inner">
    <div class="crumb">${real ? `<button class="eff" data-act="effort" data-id="${p.effort}">${effortMark(effortById(p.effort), 's')}${esc(effortById(p.effort).name)} ›</button>` : '<span class="eff">Unsorted</span>'}${kindBadge('github')}
      ${p.urgency === 'blocking' || p.urgency === 'awaiting' ? `<span class="tag ${p.urgency}">${p.urgency}</span>` : ''}<span class="mono">${esc(p.repo)}#${p.number}</span><span>${p.mine ? 'yours' : `by ${esc(p.author || 'someone')}`}</span><span class="pr ${tone}">${word}</span><span>changed ${ago(pullAt(p))}</span></div>
    <div class="titled"><h1>${esc(p.title)}</h1></div>
    <p class="subt">${esc(p.needs)}</p>
    ${pullNeeds(p)}
    ${pullSince(p, d)}
    ${on.length ? branchSessions(p) : ''}
    <div class="sec going"><div class="label"><span>${p.brief ? spark : ''}Where it stands</span></div>${pullStands(p)}</div>
    ${pullTabs(p, d)}
    <div class="going">${aboutPull(p, d)}${pullTimeline(d)}</div>
  </div>`;
}

function viewPulls() {
  const all = allPulls(), github = integrations.find(i => i.id === 'github'), feed = feeds.github, groups = pullGroups();
  if (!all.some(p => pullKey(p) === state.pullSel)) state.pullSel = pullsShown().map(pullKey)[0] || null;
  const sel = all.find(p => pullKey(p) === state.pullSel), d = sel && discussionOf(sel);
  if (sel) fetchPull(sel);
  const off = live && !github.available;
  const status = off ? `Pull requests come from GitHub, which is turned on but unavailable. <button class="link" data-act="setGo" data-s="integrations">Open integrations ›</button>`
    : live ? `${!feed ? 'Checking GitHub now…' : feed.error ? `The last check, ${ago(minsSince(feed.at))}, failed: ${esc(feed.error)}` : `As GitHub listed them ${ago(minsSince(feed.at))}.`} <button class="link" data-act="feedCheck">Check now</button>` : '';
  const chips = PULL_FILTERS.map(([k, name, t]) => `<button class="chip ${state.pullFilter === k ? 'on' : ''}" data-act="pullFilter" data-f="${k}">${name} <span class="n">${all.filter(t).length}</span></button>`).join('');
  const rows = ['long', 'short'].map(as => `<button class="${(state.rows || 'long') === as ? 'on' : ''}" data-act="rows" data-as="${as}">${cap(as)}</button>`).join('');
  const points = all.reduce((n, p) => n + openPoints(p).length, 0), blocking = all.filter(p => p.urgency === 'blocking').length;
  const lines = { you: `${blocking ? `${cap(num(blocking))} ${blocking === 1 ? 'is' : 'are'} blocking someone. ` : ''}${points ? `${cap(plural(points, 'thing'))} in their discussions ${points === 1 ? 'waits' : 'wait'} on you.` : ''}` };
  const list = groups.map(([key, name, items]) => {
    const shut = state.collapsed['pr:' + key];
    return !items.length && key !== 'you' ? '' : `<div class="ghead"><button class="name" data-act="collapse" data-key="pr:${key}"><span class="chev ${shut ? 'shut' : ''}">▼</span> ${name}</button><span class="n">${items.length}</span></div>
      ${shut ? '' : `${lines[key] ? `<div class="gline">${lines[key]}</div>` : ''}${items.map(p => pullRow(p)).join('') || (key === 'you' ? '<div class="gline">Nothing here is yours to move.</div>' : '')}`}`;
  }).join('');
  const side = !sel ? '' : state.sideShut
    ? `<aside class="pane side"><button class="rail" data-act="side" title="Show where it stands" aria-expanded="false"><span>‹</span><span class="label">${sel.brief ? spark : ''}Where it stands</span></button></aside>`
    : `<aside class="pane side" data-scroll="pr-side"><div class="head"><span class="label">${sel.brief ? spark : ''}Where it stands</span><button data-act="side" title="Hide this panel" aria-expanded="true">›</button></div>${pullStands(sel)}${aboutPull(sel, d)}${pullTimeline(d)}</aside>`;
  return `<div class="split ${side ? 'sided' : ''} ${side && state.sideShut ? 'shut' : ''}">
    <section class="pane list" data-scroll="pr-list">
      <div class="listbar"><span class="label">Pull requests</span><span class="segs"><span class="seg" role="group" aria-label="How much each row shows">${rows}</span></span></div>
      <div class="chips">${chips}</div>
      ${status ? `<div class="gline" style="padding-top:8px">${status}</div>` : ''}
      ${off ? '' : list}
    </section>
    <section class="pane detail" data-scroll="pr-${esc(state.pullSel || '')}">${sel ? pullPage(sel, d) : `<div class="empty">${off ? 'Nothing is listed while GitHub is unavailable.' : all.length ? 'No pull request is selected.' : 'No open pull request is yours, or waiting on your review, or reviewed by you.'}</div>`}</section>
    ${side}
  </div>`;
}

/* ───────────────────────── Journal ─────────────────────────
   A page for each day: what moved in each effort, as the local model wrote it from the sessions' timelines, under the tags it and the user gave the day. */
const dayKey = back => { const d = new Date(); d.setDate(d.getDate() - back); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const dayDate = key => new Date(key + 'T12:00');
const dayName = key => dayDate(key).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
const MOCK_JOURNAL = [
  { day: dayKey(0), state: 'ready', at: minsAgo(25), moments: 31, headline: 'The snapshot store got its benchmarks and the fork now builds on v0.14, with both stopped on a decision of yours.',

      { id: 'snap', name: 'Estoria snapshot store', summary: 'Saving and loading work against Postgres and the benchmark harness landed. Pruning is paused on the retention policy.',
