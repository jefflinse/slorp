<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slorp</title>
<style>
:root {
  --bg: #f3f1ea; --panel: #faf9f4; --raised: #ffffff; --sel: #e9e7db;
  --ink: #1b1c18; --ink2: #55574e; --ink3: #8b8d82; --line: #e1ded3;
  --accent: #4f6b00; --fill: #c8f05a; --fill-ink: #1c2700;
  --warn: #a85a09; --err: #b3261e; --toast-act: #c8f05a;
  --k-claude: #d97757; --k-opencode: #8b949e; --k-slack: #8e5bb5;
  --k-worker: #5f8a8b; --k-local: #6a9a23; --k-kb: #b8930f; --k-github: #1f6feb;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --e-red: #cf5a44; --e-orange: #d28a2c; --e-olive: #8a972c; --e-green: #3f9d6c; --e-teal: #2e95a3; --e-blue: #4a7fd6; --e-violet: #8566cf; --e-pink: #c95c97;
  --top: 52px;
  --notice: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #272925; --panel: #2d2f2a; --raised: #353832; --sel: #40433b;
    --ink: #eeede7; --ink2: #c0c2b7; --ink3: #9c9e93; --line: #464940;
    --accent: #c3ee5c; --fill: #c3ee5c; --fill-ink: #172000;
    --warn: #f0a35e; --err: #f2857c; --toast-act: #4f6b00;
  }
}
:root[data-theme="dark"] {
  --bg: #272925; --panel: #2d2f2a; --raised: #353832; --sel: #40433b;
  --ink: #eeede7; --ink2: #c0c2b7; --ink3: #9c9e93; --line: #464940;
  --accent: #c3ee5c; --fill: #c3ee5c; --fill-ink: #172000;
  --warn: #f0a35e; --err: #f2857c; --toast-act: #4f6b00;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Model-written text carries the spark; verbatim source text is mono. */
.mono { font-family: var(--mono); font-size: 0.86em; letter-spacing: -0.01em; }
.spark { color: var(--accent); font-size: 11px; margin-right: 6px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink3); }

/* Top bar */
.top { height: var(--top); display: flex; align-items: center; gap: 20px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 18px; letter-spacing: -0.03em; }
.blob { width: 22px; height: 20px; background: var(--fill); border-radius: 60% 40% 55% 45% / 55% 50% 50% 45%; position: relative; display: inline-block; }
.blob::before, .blob::after { content: ""; position: absolute; top: 7px; width: 3px; height: 4px; border-radius: 50%; background: var(--fill-ink); }
.blob::before { left: 6px; } .blob::after { right: 6px; }
.nav { display: flex; gap: 2px; }
.nav button { white-space: nowrap; padding: 6px 12px; border-radius: 7px; color: var(--ink2); font-weight: 500; }
.nav button:hover { background: var(--sel); }
.nav button.on { color: var(--ink); background: var(--sel); }
.count { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--fill); color: var(--fill-ink); font-size: 11px; font-weight: 700; text-align: center; line-height: 18px; }
.tools { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.model { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.used { display: inline-flex; align-items: center; padding: 2px 10px 2px 8px; border-radius: 99px; color: var(--ink2); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums;
  background: color-mix(in srgb, var(--k, var(--ink3)) 14%, transparent); border: 1px solid color-mix(in srgb, var(--k, var(--ink3)) 32%, transparent); }
.veil { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: center; align-items: flex-start; padding: 9vh 16px 16px; overflow-y: auto; background: color-mix(in srgb, #000 48%, transparent); }
.modal { width: min(720px, 100%); padding: 22px 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35); }
.modal .mfoot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink3); font-size: 12px; }
.modal.search { padding: 14px 16px 12px; }
.modal.search input { display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); font-size: 16px; }
.modal.search .hits { max-height: 56vh; margin-top: 8px; overflow-y: auto; }
.modal.search .mfoot { margin-top: 10px; padding-top: 10px; }
.hit { display: block; width: 100%; padding: 9px 10px; border-radius: 8px; text-align: left; }
.hit:hover, .hit.sel { background: var(--sel); }
.hit .hl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hit .hl .ttl { font-size: 14px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .hl .dim { margin-left: auto; color: var(--ink3); font-size: 12px; white-space: nowrap; }
.hit .tx { display: block; margin-top: 3px; color: var(--ink2); font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
.hit mark, .row mark { padding: 0 1px; border-radius: 3px; background: color-mix(in srgb, var(--fill) 45%, transparent); color: var(--ink); }
.need .cmd { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 12px; padding: 8px 10px 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.need .cmd .mono { font-size: 12px; overflow-wrap: anywhere; }
.need.bare { padding: 0; border: 0; background: none; }
.stat { display: inline-flex; align-items: center; white-space: nowrap; }
.facts { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 0; font-size: 13.5px; line-height: 1.5; }
.facts dt { color: var(--ink3); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts .mono { font-size: 12px; }
.facts .bad { color: var(--err); }
.pt { padding: 12px 0; border-top: 1px solid var(--line); }
.label + .pt { margin-top: 10px; }
.pt .pth { display: flex; align-items: baseline; gap: 9px; }
.pt .pth .tag { flex: none; }
.pt .ptl { font-size: 15px; font-weight: 500; line-height: 1.4; }
.pt .said { margin: 8px 0 0; }
.pt .ptm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 7px; color: var(--ink3); font-size: 12.5px; }
.conv { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.conv.resolved { opacity: .75; }
.convh { display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--ink3); font-size: 12.5px; text-align: left; }
.convh .mono { color: var(--ink2); font-size: 12px; }
.convh .chev { margin-left: auto; }
.conv > .convh:last-child { border-bottom: 0; }
.msg { padding: 10px 14px; }
.msg + .msg { border-top: 1px solid var(--line); }
.msg .by { display: flex; align-items: baseline; gap: 10px; color: var(--ink3); font-size: 12.5px; }
.msg .by b { color: var(--ink); font-size: 13.5px; font-weight: 600; }
.msg .tx { margin-top: 4px; font-size: 14px; overflow-wrap: anywhere; }
.msg .tx > :first-child { margin-top: 0; } .msg .tx > :last-child { margin-bottom: 0; }
.lim { color: var(--ink3); font-size: 12px; }
.lim .meter { width: 44px; }
.pr { display: inline-flex; align-items: center; white-space: nowrap; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink2); font-size: 11.5px; font-weight: 500; line-height: 1.5; text-decoration: none; }
a.pr:hover, button.pr:hover { border-color: var(--k-github); color: var(--ink); }
.pr.bad { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
.pr.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.pr.good { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.btn .kd { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: var(--k); vertical-align: middle; }
.used i { width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: var(--k, var(--ink3)); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink3); margin-right: 6px; vertical-align: 1px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--raised); }
.seg button { padding: 3px 10px; font-size: 12px; color: var(--ink2); }
.seg button.on { background: var(--ink); color: var(--bg); }
.icon { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--ink2); border: 1px solid var(--line); background: var(--raised); list-style: none; cursor: pointer; }
.icon::-webkit-details-marker { display: none; }
.menu { position: relative; }
.menu .pop { position: absolute; right: 0; top: 34px; width: 230px; background: var(--raised); border: 1px solid var(--line); border-radius: 9px; padding: 6px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.16); }
.menu .pop button { display: block; width: 100%; padding: 7px 9px; border-radius: 6px; }
.menu .pop button:hover { background: var(--sel); }
.menu .pop p { padding: 6px 9px 4px; color: var(--ink3); font-size: 12px; }
.menu .pop summary { display: flex; justify-content: space-between; padding: 7px 9px; border-radius: 6px; cursor: pointer; list-style: none; }
.menu .pop summary::-webkit-details-marker { display: none; }
.menu .pop summary:hover { background: var(--sel); }
.menu .pop summary span { color: var(--ink3); transition: transform 0.12s; }
.menu .pop details[open] > summary span { transform: rotate(90deg); }
.menu .pop details > div { margin: 2px 0 4px 9px; padding-left: 6px; border-left: 1px solid var(--line); }
.menu .pop button { text-align: left; }
.acts .pop { z-index: 4; font-size: 13px; font-weight: 400; letter-spacing: 0; line-height: 1.45; }
.titled { display: flex; align-items: flex-start; gap: 12px; }
.titled > h1, .titled > form { flex: 1; min-width: 0; }

/* Panes */
.split { display: grid; grid-template-columns: minmax(320px, 410px) 1fr; height: calc(100vh - var(--top) - var(--notice)); }
#notice { height: var(--notice); overflow: hidden; }
#notice:empty { display: none; }
#notice div { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--sel); font-size: 13px; }
#notice span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.off, .link.off { color: var(--ink3); cursor: default; text-decoration: none; }
.split.narrow { grid-template-columns: 250px 1fr; }
.pane { overflow-y: auto; min-width: 0; }
.pane.list { border-right: 1px solid var(--line); background: var(--panel); }
.pane.detail { padding: 28px 36px 60px; }
.inner { max-width: 740px; }
.split.sided { grid-template-columns: minmax(320px, 410px) minmax(520px, 1fr) minmax(240px, 340px); }
.split.sided.shut { grid-template-columns: minmax(320px, 410px) minmax(520px, 1fr) 40px; }
.split.sided .going { display: none; }
.pane.side { border-left: 1px solid var(--line); background: var(--panel); padding: 26px 22px 40px; }
.pane.side .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.pane.side .head button { color: var(--ink3); padding: 2px 6px; border-radius: 6px; }
.pane.side .head button:hover, .rail:hover { color: var(--accent); background: var(--sel); }
.pane.side .prose { font-size: 14.5px; }
.split.shut .pane.side { padding: 0; overflow: hidden; }
.tlhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 28px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); }
.tlhead .link, .tlhead .none { padding: 0; font-size: 12px; font-weight: 500; letter-spacing: 0; text-transform: none; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.tl li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 8px; font-size: 13px; line-height: 1.45; }
.tl .when { padding-top: 1px; color: var(--ink3); font-size: 12px; font-variant-numeric: tabular-nums; }
.tl .line { color: var(--ink); }
.tl .you { color: var(--ink3); overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.tl .line + .you { margin-top: 2px; }
.tl .mark { padding: 7px 0; border-block: 1px dashed var(--line); font-size: 12px; }
.rail { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; height: 100%; padding: 26px 0; color: var(--ink3); }
.rail .label { writing-mode: vertical-rl; color: inherit; white-space: nowrap; }
.full { height: calc(100vh - var(--top) - var(--notice)); overflow-y: auto; }
.page { padding: 28px 36px 60px; }

/* Journal */
.jq { display: block; width: calc(100% - 36px); margin: 0 18px 10px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 13.5px; }
.jt { display: inline-flex; align-items: center; white-space: nowrap; padding: 0 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink2); font-size: 11.5px; line-height: 1.6; }
.jtags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 14px; }
.jtags .jt { padding: 2px 3px 2px 10px; background: var(--raised); font-size: 12.5px; }
.jtags .jt .spark { margin-right: 5px; }
.jtags .jt button:first-of-type:hover { color: var(--accent); }
.jtags .jt .x { margin-left: 2px; padding: 0 5px; font-size: 14px; }
.jtags input { width: 130px; padding: 3px 10px; border: 1px dashed var(--ink3); border-radius: 99px; background: transparent; color: var(--ink); font-size: 12.5px; }
.jr h3 { font-size: 16px; font-weight: 650; }
.jr h3 button:hover { color: var(--accent); }
.jr .sec { margin-top: 28px; }
.jr .sec .prose { margin-top: 4px; }
.jr ul { margin: 8px 0 0; padding-left: 20px; max-width: 78ch; }
.jr li { margin: 4px 0; font-size: 14.5px; line-height: 1.5; }
.jr ul.open li { color: var(--ink2); }
.jr .pm { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; margin-left: 8px; vertical-align: 1px; color: var(--ink3); font-size: 12px; }
.jr .pm .link, .jr .jmeta .link { color: var(--ink2); }
.jr .pm .link:hover, .jr .jmeta .link:hover { color: var(--accent); }
.jr .jmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 10px; color: var(--ink3); font-size: 12.5px; }
/* Briefing */
.brief { padding: 18px 18px 16px; border-bottom: 1px solid var(--line); }
.brief .when { display: flex; justify-content: space-between; margin-bottom: 8px; }
.brief p { font-size: 15px; line-height: 1.5; }
.listbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 8px; padding: 10px 18px; }
.listbar .segs { display: flex; gap: 6px; }

/* Groups and rows */
.ghead { display: flex; align-items: baseline; gap: 8px; padding: 14px 18px 4px; }
.ghead .name { font-weight: 650; font-size: 13px; flex: 1; min-width: 0; }
.ghead .name:hover { color: var(--accent); }
.ghead .n { color: var(--ink3); font-size: 12px; }
.ghead .open { color: var(--ink3); font-size: 12px; }
.ghead .open:hover { color: var(--accent); }
.gline { padding: 0 18px 6px 18px; color: var(--ink3); font-size: 12.5px; }
.chev { display: inline-block; width: 10px; color: var(--ink3); font-size: 10px; transition: transform 0.12s; }
.chev.shut { transform: rotate(-90deg); }
.row { display: block; width: 100%; padding: 9px 18px 10px 16px; border-left: 3px solid var(--k, transparent); }
.row:hover { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.row.sel { background: var(--sel); }
.row .h { display: flex; align-items: baseline; gap: 10px; }
.row .h .t { flex: 1; min-width: 0; }
.row .h .w { flex: none; display: inline-flex; align-items: center; gap: 8px; color: var(--ink3); font-size: 12px; white-space: nowrap; }
.row .t { display: block; font-size: 14px; font-weight: 500; line-height: 1.35; }
.row .t.mono { font-size: 12px; font-weight: 400; line-height: 1.45; word-break: break-word; }
.row .st { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; white-space: normal; overflow-wrap: anywhere; margin-top: 1px; color: var(--ink2); font-size: 13px; line-height: 1.4; }
.subt { margin-top: 7px; color: var(--ink2); font-size: 15.5px; line-height: 1.45; max-width: 70ch; }
h1 .pen { margin-left: 10px; padding: 2px 6px; border-radius: 6px; color: var(--ink3); font-size: 15px; font-weight: 400; letter-spacing: 0; vertical-align: middle; }
h1 .pen:hover { color: var(--accent); background: var(--sel); }
.rename { display: flex; align-items: center; gap: 8px; }
.rename input { flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 20px; font-weight: 600; }
.row .m { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px; color: var(--ink3); font-size: 12px; }
.row.fresh { animation: arrive 1.6s ease-out; }
@keyframes arrive { 0% { background: var(--fill); } 100% { background: transparent; } }
.kind { display: inline-flex; align-items: center; white-space: nowrap; padding: 1px 8px 1px 6px; border-radius: 99px; font-size: 11.5px; font-weight: 600; line-height: 1.5;
  color: color-mix(in srgb, var(--k) 50%, var(--ink)); background: color-mix(in srgb, var(--k) 15%, transparent); }
.kind i, .chip i { width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; background: var(--k); }
.chip i { display: inline-block; vertical-align: 1px; }
.tabs { display: flex; flex-wrap: wrap-reverse; align-items: center; gap: 8px 20px; margin-top: 30px; border-bottom: 1px solid var(--line); }
.tabs > button { padding: 0 0 9px; margin-bottom: -1px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs > button:hover { color: var(--ink); }
.tabs > button.on { color: var(--ink); border-bottom-color: var(--ink); }
.tabs > button .n { margin-left: 6px; font-weight: 500; letter-spacing: 0; }
.tabs .tools { display: flex; align-items: center; gap: 8px; margin: 0 0 7px auto; }
.tabs .tools .btn { padding: 3px 10px; font-size: 12px; }
.said { margin-bottom: 14px; padding-left: 12px; border-left: 3px solid var(--line); }
.said .tx { margin-top: 3px; color: var(--ink2); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.said.open .tx { display: block; }
.said .link { margin-top: 4px; font-size: 12px; }
.tabbody { padding-top: 14px; }
.md { font-size: 14.5px; line-height: 1.6; max-width: 80ch; overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 10px 0 0; }
.md h4 { margin: 18px 0 0; font-size: 15px; font-weight: 650; }
.md h4.h1 { font-size: 18px; } .md h4.h2 { font-size: 16.5px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin-top: 3px; }
.md code { font-family: var(--mono); font-size: 0.86em; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; border: 0; padding: 0; font-size: 12px; line-height: 1.55; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--ink2); }
.md table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
.md th { background: var(--panel); font-weight: 600; }
.md a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0 0; }
.asked + .asked { margin-top: 16px; }
.asked .q { font-size: 15px; font-weight: 500; margin: 2px 0 8px; }
.asked .opt { display: flex; gap: 10px; align-items: baseline; padding: 8px 11px; margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.asked .opt .k { color: var(--ink3); font-family: var(--mono); font-size: 12px; }
.asked .opt b { font-weight: 600; white-space: nowrap; }
.asked button.opt { width: 100%; text-align: left; cursor: pointer; }
.asked button.opt:hover { border-color: var(--ink3); }
.asked button.opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.asked button.opt.on .k { color: var(--accent); }
.asked .opt span:last-child { color: var(--ink2); font-size: 13px; }
.role { display: inline-flex; align-items: center; white-space: nowrap; padding: 0 7px; border-radius: 99px; border: 1px solid var(--ink3); color: var(--ink2); font-size: 11.5px; font-weight: 500; line-height: 1.5; }
.role .spark { margin-right: 4px; }
.subs { display: inline-flex; align-items: center; white-space: nowrap; color: var(--ink3); font-size: 12px; }
.subs.live { color: var(--ink2); }
.subs b { color: var(--err); font-weight: 600; }
.lane .doing { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-top: 1px; color: var(--ink2); font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
.lane .stand { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sparkl { flex: none; overflow: visible; }
.sparkl polyline { fill: none; stroke: var(--k-local); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.run { margin-top: 16px; }
.rhead { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--ink3); font-size: 12px; font-variant-numeric: tabular-nums; }
.lane { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(90px, 1fr) 128px; gap: 3px 16px; align-items: center; width: 100%; padding: 9px 0; border-bottom: 1px solid var(--line); text-align: left; }
.lane:hover .t { color: var(--accent); }
.lane .what { grid-row: span 2; min-width: 0; }
.lane .t { display: block; font-size: 14px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.lane .m { display: block; margin-top: 1px; color: var(--ink3); font-size: 12px; }
.lane .track { position: relative; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--line) 55%, transparent); }
.lane .track i { position: absolute; top: 0; bottom: 0; min-width: 3px; border-radius: 99px; background: var(--ink3); }
.lane .track i.running { background: var(--k-local); animation: pulse 1.8s ease-in-out infinite; }
.lane .track i.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink3); }
.lane .track i.waiting { background: var(--fill); box-shadow: inset 0 0 0 1.5px var(--accent); }
.lane .track i.error { background: var(--err); }
.lane .num { display: flex; gap: 12px; justify-content: flex-end; color: var(--ink2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.lane .num span:last-child { min-width: 44px; text-align: right; }
.lane .stand { grid-column: 2 / -1; color: var(--ink3); font-size: 12px; }
.subdoc { padding: 12px 0 16px 14px; margin: 0 0 4px 2px; border-left: 3px solid var(--line); }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; }
.tag.blocking { background: var(--fill); color: var(--fill-ink); }
.tag.awaiting { color: var(--warn); border: 1px solid currentColor; }
.tag.whenever { color: var(--ink3); border: 1px solid var(--line); }
.foot { padding: 16px 18px 24px; color: var(--ink3); font-size: 12px; border-top: 1px solid var(--line); margin-top: 14px; }
.foot .link, .link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.handled { margin: 8px 0 12px; }
.handled div { display: flex; gap: 8px; justify-content: space-between; padding: 4px 0; }
.handled .gen { color: var(--ink2); font-size: 13px; }

/* Detail */
.crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; color: var(--ink3); font-size: 12.5px; margin-bottom: 10px; }
.crumb .eff { color: var(--ink2); font-weight: 600; }
.crumb .eff:hover { color: var(--accent); }
.ctx { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meter { width: 60px; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; background: var(--accent); }
.ctx.high .meter i { background: var(--warn); }
.ctx.full { color: var(--err); }
.ctx.full .meter i { background: var(--err); }
h1 { font-weight: 650; font-size: 25px; line-height: 1.2; letter-spacing: -0.02em; }
h1.mono { font-family: var(--mono); font-size: 16px; font-weight: 500; line-height: 1.5; word-break: break-word; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }
.btn { padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--ink3); }
.btn.go { background: var(--fill); color: var(--fill-ink); border-color: transparent; font-weight: 600; }
.btn.go:hover { filter: brightness(0.95); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.quiet { border-color: transparent; background: none; color: var(--ink2); }
.btn.quiet:hover { background: var(--sel); }
a.btn { display: inline-block; text-decoration: none; color: inherit; }
select.btn { appearance: none; padding-right: 24px; background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.need { margin-top: 22px; padding: 16px 18px; background: var(--raised); border: 1px solid var(--line); border-radius: 11px; }
.need .ask { font-size: 16px; font-weight: 500; line-height: 1.4; margin: 4px 0 14px; }
.need .replies, .livebox .replies { display: flex; flex-wrap: wrap; gap: 8px; }
.livebox .replies { margin-bottom: 10px; }
.need textarea { display: block; width: 100%; min-height: 64px; margin-top: 12px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); resize: vertical; line-height: 1.45; }
.need textarea.drafted { min-height: 104px; }
.need .send { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; color: var(--ink3); font-size: 12px; }
.sec { margin-top: 30px; }
.sec > .label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sec > .label button { text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink3); font-size: 12px; }
.sec > .label button:hover { color: var(--accent); }
.prose { font-size: 15px; line-height: 1.6; max-width: 70ch; }
.prose.thinking { color: transparent; border-radius: 6px; background: linear-gradient(90deg, var(--sel) 25%, var(--line) 50%, var(--sel) 75%); background-size: 200% 100%; animation: shimmer 0.9s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.rawblock { font-family: var(--mono); font-size: 12px; line-height: 1.55; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; overflow-x: auto; }
.rawblock .ln { display: grid; grid-template-columns: 150px 1fr; gap: 12px; padding: 2px 0; }
.rawblock .who { color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rawblock .tx { white-space: pre-wrap; word-break: break-word; }
.srow { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.srow .body { flex: 1; min-width: 0; }
.srow .ttl { font-size: 14px; font-weight: 500; }
.srow .ttl.mono { font-size: 12px; font-weight: 400; }
.srow .sub { color: var(--ink2); font-size: 13px; }
.srow .side { color: var(--ink3); font-size: 12px; white-space: nowrap; }
.empty { color: var(--ink3); font-size: 15px; padding: 60px 0; text-align: center; }
.none { color: var(--ink3); font-size: 13px; padding: 4px 0; }

/* Session status dots */
.dot.running { background: var(--k-local); animation: pulse 1.8s ease-in-out infinite; }
.dot.waiting { background: var(--fill); box-shadow: 0 0 0 1.5px var(--accent); }
.dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink3); }
.dot.done { background: var(--ink3); }
.dot.error { background: var(--err); }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Efforts board: a card for each effort, in the order the user keeps them */
.board { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.ecard { display: flex; flex-direction: column; gap: 10px; min-height: 168px; padding: 15px 16px 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }
.ecard:hover { border-color: var(--ink3); box-shadow: 0 4px 16px rgb(0 0 0 / 0.07); }
.ecard.dragging { opacity: 0.35; border-style: dashed; box-shadow: none; }
.ecard .eh { display: flex; align-items: flex-start; gap: 8px; }
.ecard .t { flex: 1; min-width: 0; font-size: 16px; font-weight: 650; line-height: 1.3; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.ecard .t.mono { font-size: 12px; font-weight: 500; letter-spacing: 0; line-height: 1.5; }
.ecard .count { flex: none; margin: 2px 0 0; }
.ecard .grip { flex: none; color: var(--ink3); line-height: 1.3; opacity: 0; cursor: grab; transition: opacity 0.12s; }
.ecard:hover .grip, .ecard:focus-visible .grip { opacity: 1; }
.ecard .l { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; color: var(--ink2); font-size: 13.5px; line-height: 1.45; }
.ecard .ens { display: flex; flex-direction: column; gap: 6px; }
.en { display: block; width: 100%; padding: 6px 9px 7px; border-left: 3px solid var(--k, var(--line)); border-radius: 0 7px 7px 0; background: var(--bg); }
.en:hover { background: var(--sel); }
.en .nt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-size: 13px; font-weight: 500; line-height: 1.35; overflow-wrap: anywhere; }
.en .nt.mono { font-size: 11.5px; font-weight: 400; }
.en .w { display: flex; align-items: center; gap: 8px; margin-top: 3px; color: var(--ink3); font-size: 12px; }
.ecard .more { padding-left: 12px; color: var(--ink3); font-size: 12px; }
.ecard .ef { display: flex; align-items: center; gap: 9px; margin-top: auto; padding-top: 2px; color: var(--ink3); font-size: 12px; }
.ecard .ef .dots { display: inline-flex; align-items: center; gap: 5px; }
.ecard .ef .dot { margin: 0; }
.ecard.loose, .ecard.new { background: transparent; border-style: dashed; }
.ecard.new { gap: 8px; cursor: default; }
.ecard.new:hover { border-color: var(--line); box-shadow: none; }
.ecard.new input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
.ecard.new .btn { align-self: flex-start; }
/* An effort opened: all of them collapsed in a column, the open one marked, and it as one large card beside them */
.split.efx { grid-template-columns: 300px 1fr; }
.estack { display: flex; flex-direction: column; gap: 8px; padding: 26px 8px 40px 36px; }
.estack .back { align-self: flex-start; margin-bottom: 8px; color: var(--ink2); font-size: 12.5px; font-weight: 600; }
.estack .back:hover { color: var(--accent); }
.ecard.mini { flex: none; gap: 7px; min-height: 0; padding: 10px 12px 9px; border-radius: 10px; }
.ecard.mini .t { font-size: 14px; font-weight: 600; }
.ecard.mini .t.mono { font-size: 11.5px; font-weight: 400; }
.ecard.mini .count { margin: 1px 0 0; }
.ecard.mini.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.split.efx .pane.detail { padding: 26px 36px 28px 8px; }
.ebig { min-height: 100%; padding: 26px 32px 40px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); container-type: inline-size; }
.ebig.loose { background: transparent; border-style: dashed; }
/* An effort's mark: its glyph, or else its initial, on its colour */
.emark { display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 1; letter-spacing: 0;
  background: color-mix(in srgb, var(--ec) 24%, transparent); color: color-mix(in srgb, var(--ec) 60%, var(--ink)); }
.emark.s { width: 16px; height: 16px; border-radius: 4px; font-size: 10px; }
.emark.l { width: 32px; height: 32px; border-radius: 9px; font-size: 16px; }
.echip { display: inline-flex; align-items: center; gap: 5px; }
.crumb .eff, .ghead .name, .jr h3 button { display: inline-flex; align-items: center; gap: 6px; }
.ghead .name { display: flex; }
.titled > h1 .emark { margin-right: 10px; vertical-align: 4px; }
.ecard.mini .emark { width: 18px; height: 18px; border-radius: 5px; font-size: 11px; margin-top: 1px; }
.eedit .marks { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.eedit .marks input { width: 76px; text-align: center; }
.eedit .sw { width: 20px; height: 20px; border-radius: 50%; background: var(--ec); }
.eedit .sw.on { box-shadow: 0 0 0 2px var(--raised), 0 0 0 4px var(--ink); }
.srow input[type="checkbox"] { flex: none; width: 16px; height: 16px; margin: 0; align-self: center; accent-color: var(--accent); }
.ebig .tabbody .add { padding: 14px 0 0; border-top: 0; }
/* Sessions that can be dragged onto an effort to file them there */
.tray { margin-top: 14px; }
.tray .label { margin-bottom: 2px; }
.tray .none { padding: 0 0 6px; font-size: 12px; }
.trow { display: flex; align-items: baseline; gap: 2px; padding: 6px 8px; border-radius: 7px; cursor: grab; }
.trow:hover { background: var(--sel); }
.trow button { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.trow button:hover { color: var(--accent); }
.srow[draggable] { cursor: grab; }
.trow.dragging, .srow.dragging { opacity: 0.4; }
.ecard.drop, .ebig.drop { border-color: var(--accent); border-style: solid; box-shadow: 0 0 0 2px var(--accent); }
.shelf { margin-top: 34px; }
.shelf .ghead { padding: 0 0 10px; }
.shelf .ghead .name { flex: none; }
button.ecard.new { cursor: pointer; color: var(--ink2); font-size: 13px; font-weight: 600; }
button.ecard.new:hover { border-color: var(--ink3); color: var(--ink); }
.ecard.mini.new .send { display: flex; justify-content: flex-end; gap: 8px; }
.eedit { display: flex; flex-direction: column; gap: 8px; max-width: 740px; }
.eedit input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.eedit input.nm { font-size: 20px; font-weight: 600; }
.eedit .send { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink3); font-size: 12px; }
.eedit .send span:last-child { display: flex; gap: 8px; }
.shelved { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-top: 16px; padding: 10px 12px 10px 14px; border: 1px dashed var(--ink3); border-radius: 9px; color: var(--ink2); font-size: 13.5px; }
.ebig .jday { margin-top: 18px; }
.ebig .jday:first-child { margin-top: 0; }
.ebig .tabbody .rows > .srow:first-child { padding-top: 2px; border-top: 0; }
.ebig .tabbody .rows { margin: 0 -18px; }
.ebig .tabbody .rows.plain { margin: 0; }
.ebig .tabbody .label { margin: 24px 0 8px; }
.ebig .jday h3 { font-size: 14.5px; }
.ebig .jday .prose { font-size: 14.5px; }
.srow .ttl button:hover { color: var(--accent); }
.btn.danger { background: var(--err); color: var(--bg); border-color: transparent; font-weight: 600; }
.modal h2 { margin: 0; font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
.modal ul { margin: 12px 0 0; padding-left: 20px; }
.modal li { margin: 5px 0; font-size: 14.5px; line-height: 1.5; }
.modal .mfoot .bar { margin: 0; }
/* The dialog a session is started from */
.modal.start { width: min(620px, 100%); }
.modal.start form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; margin-top: 16px; }
.modal.start .wide { grid-column: 1 / -1; }
.modal.start label, .modal.start .field { display: grid; gap: 5px; min-width: 0; align-content: start; }
.modal.start label > span, .modal.start .field > span { font-size: 12px; font-weight: 600; color: var(--ink2); }
.modal.start label > span i { font-style: normal; font-weight: 400; color: var(--ink3); }
.modal.start input, .modal.start textarea, .modal.start select.btn { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background-color: var(--bg); color: var(--ink); font-size: 14px; }
.modal.start select.btn { padding-right: 26px; }
.modal.start textarea { display: block; min-height: 130px; resize: vertical; line-height: 1.45; }
.modal.start .seg { justify-self: start; }
.modal.start .seg button { padding: 6px 14px; font-size: 13px; }
.modal.start .seg button:disabled { color: var(--ink3); opacity: 0.6; cursor: not-allowed; }
.modal.start .mfoot { margin-top: 6px; }
.modal.start .mfoot > span:first-child { flex: 1; min-width: 200px; }
.epage { display: grid; grid-template-columns: minmax(0, 740px) minmax(240px, 360px); gap: 0 56px; align-items: start; }
.epage aside { padding-top: 34px; }
.epage aside .sec:first-child { margin-top: 0; }
@container (max-width: 940px) { .epage { grid-template-columns: minmax(0, 740px); } .epage aside { padding-top: 0; } .epage aside .sec:first-child { margin-top: 30px; } }
/* A card keeps its name as it goes between the board and the column, so each is seen to move there. */
::view-transition-group(*) { animation-duration: 0.22s; }
::view-transition-old(*), ::view-transition-new(*) { block-size: 100%; object-fit: none; object-position: left top; overflow: clip; }
.time { display: grid; grid-template-columns: 62px 1fr; gap: 4px 12px; }
.time .a { color: var(--ink3); font-size: 12px; padding-top: 3px; }
.time .what { font-size: 14px; }

/* Chips and tables */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 18px 0 14px; }
.chip { padding: 3px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--raised); font-size: 12.5px; color: var(--ink2); }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .n { opacity: .6; margin-left: 2px; }
.list .chips { margin: 0; padding: 0 18px 4px; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl .ttl { font-size: 14px; font-weight: 500; }
.tbl .ttl.mono { font-size: 12px; font-weight: 400; }
.tbl .doing { color: var(--ink2); font-size: 13px; margin-top: 1px; }
.tbl .dim { color: var(--ink3); font-size: 12.5px; white-space: nowrap; }
.st { white-space: nowrap; font-size: 12.5px; color: var(--ink2); }
.tbl a.ttl { color: inherit; text-decoration: none; }
.tbl a.ttl:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.tbl .bad { color: var(--err); }

.livebox { margin: 12px 0 16px; max-width: 760px; }
.livebox textarea { display: block; width: 100%; min-height: 60px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); resize: vertical; line-height: 1.45; }
.livebox .send { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 8px; color: var(--ink3); font-size: 12px; }
.livebox .sent { margin-top: 10px; font-size: 12.5px; color: var(--ink2); }
.livebox .sent b { font-weight: 600; color: var(--accent); }

/* Knowledge base */
.kbnav button { display: flex; justify-content: space-between; width: 100%; padding: 9px 18px; color: var(--ink2); border-left: 3px solid transparent; }
.kbnav button:hover { background: color-mix(in srgb, var(--sel) 55%, transparent); }
.kbnav button.on { background: var(--sel); color: var(--ink); border-left-color: var(--ink); font-weight: 600; }
.kbnav span { color: var(--ink3); font-weight: 400; }
.kbnav .label { padding: 18px 18px 8px; }
.lede { color: var(--ink2); font-size: 14.5px; margin: 6px 0 22px; max-width: 62ch; }
.card { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--line); }
.card .glyph { width: 30px; height: 30px; border-radius: 8px; background: var(--sel); display: grid; place-items: center; font-family: var(--mono); font-weight: 600; flex: none; }
.card .body { flex: 1; min-width: 0; }
.card .nm { font-weight: 600; font-size: 15px; }
.card .why { color: var(--ink2); margin-top: 1px; }
.card .seen { color: var(--ink2); font-size: 13px; margin-top: 6px; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 6px; color: var(--ink3); font-size: 12px; }
.card .q { font-size: 14.5px; }
.card .does { display: flex; flex-direction: column; gap: 8px; flex: none; }
.card.set { align-items: center; }
.check { margin: 0 0 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--raised); font-size: 13.5px; line-height: 1.5; }
.check > div + div { margin-top: 4px; }
.add.model { flex-direction: column; gap: 16px; padding-top: 18px; }
.add.model label { display: grid; gap: 2px; }
.add.model .nm { font-weight: 600; font-size: 15px; color: var(--ink); }
.add.model .why { color: var(--ink2); font-size: 13.5px; max-width: 58ch; }
.add.model input { margin-top: 6px; max-width: 460px; font-size: 13px; }
.add.model input:disabled { opacity: 0.6; }
.add.model .send { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--ink3); font-size: 12px; }
.add.model .send span:last-child { display: flex; gap: 8px; }
.none.warn { color: var(--warn); }
.card.set .why { max-width: 58ch; font-size: 13.5px; }
.icon.on { background: var(--sel); color: var(--ink); border-color: var(--ink3); }
.facts.keys { gap: 9px 26px; }
.card input[type="checkbox"] { width: 17px; height: 17px; margin: 4px 0 0 6px; accent-color: var(--accent); flex: none; }
.x { color: var(--ink3); padding: 2px 8px; border-radius: 6px; font-size: 16px; line-height: 1.2; }
.x:hover { background: var(--sel); color: var(--err); }
.add { display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 0; border-top: 1px solid var(--line); }
.add input, .add select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); }
.add input { flex: 1; min-width: 180px; }

/* Toast */
#toast, #news { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 80px); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; display: flex; gap: 14px; align-items: center; transition: transform 0.18s; z-index: 20; max-width: calc(100vw - 32px); }
#toast.show, #news.show { transform: translate(-50%, 0); }
#toast button, #news button { color: var(--toast-act); font-weight: 600; }
#news { bottom: 70px; transform: translate(-50%, 140px); }
#news span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (max-width: 1320px) { .model { display: none; } }
@media (max-width: 1140px) { .lim .meter { display: none; } }
@media (max-width: 1020px) { .used, .tbl .hide { display: none; } }
@media (max-width: 1180px) {
  .split.sided, .split.sided.shut { grid-template-columns: minmax(320px, 410px) 1fr; }
  .split.sided .going { display: block; }
  .pane.side { display: none; }
}
@media (max-width: 860px) {
  .top { gap: 10px; overflow-x: auto; }
  .model, .used, .lim { display: none; }
  .split, .split.narrow, .split.efx, .split.sided, .split.sided.shut { grid-template-columns: 1fr; height: auto; }
  .full { height: auto; overflow: visible; }
  .estack { padding: 20px 16px 0; }
  .split.efx .pane.detail { padding: 14px 16px 48px; }
  .ebig { padding: 20px 18px 32px; }
  .pane.list { border-right: 0; border-bottom: 1px solid var(--line); max-height: 48vh; }
  .pane.detail, .page { padding: 20px 16px 48px; }
  h1 { font-size: 24px; }
  .rawblock .ln { grid-template-columns: 1fr; gap: 0; }
  .tbl .hide { display: none; }
}

    { id: 'w2', type: 'channel', name: '#platform-eng', why: 'Where dependency and fork policy gets argued out.', efforts: ['fork'], cadence: 'twice a day', seen: 'A thread about pinning the fork for the quarter is still going.', seenAge: 170 },
    { id: 'w3', type: 'dm', name: 'Marcus Oyelaran', why: 'Owns the outbox service. Decisions there change what the fork needs.', efforts: ['fork'], cadence: 'on every message', seen: 'Nothing new since Friday.', seenAge: 4200 },
    { id: 'w4', type: 'channel', name: '#incidents', why: 'Only matters if the event store is named.', efforts: ['fork'], cadence: 'hourly', seen: 'Quiet. No mention of the event store this week.', seenAge: 55 },
    { id: 'w5', type: 'channel', name: '#es-go (Gophers Slack)', why: 'Occasional Estoria questions from strangers.', efforts: ['snap', 'docs'], cadence: 'daily', seen: 'Someone asked whether snapshots are supported yet.', seenAge: 1300 },
  ],
  questions: [
    { id: 'q1', text: 'Is keeping the newest three snapshots per stream the right default, or should retention be opt-in?', effort: 'snap', age: 12, origin: 'raised by a Claude session' },
    { id: 'q2', text: 'Do I want a bump window for the fork instead of ad hoc upgrades?', effort: 'fork', age: 170, origin: 'from the #platform-eng thread' },
    { id: 'q3', text: 'Where does the knowledge base live: Markdown files, SQLite, or an event stream?', effort: 'slorp', age: 12960, origin: 'you wrote this down' },
    { id: 'q4', text: 'Should Slorp ever act on my behalf, or only draft?', effort: 'slorp', age: 2900, origin: 'you wrote this down' },
  ],
  context: [
    { id: 'c1', text: 'The work fork never diverges from upstream. It only lags.' },
    { id: 'c2', text: 'At work, only the Postgres event store matters.' },
    { id: 'c3', text: 'Agents prepare changes locally. Nothing gets pushed without me saying so.' },
    { id: 'c4', text: 'Thursday is planning. Anything that needs a team decision should be ready by Wednesday night.' },
  ],
  routing: [
    { id: 'r1', text: 'Anything under ~/dev/estoria belongs to an Estoria effort. Use the branch name to pick which one.' },
    { id: 'r2', text: 'Messages from Priya, or in #platform-eng, are about the work fork unless they say otherwise.' },
    { id: 'r3', text: 'Sessions in ~/dev/scratch stay unsorted until I file them.' },
  ],
};
const KB_SECTIONS = {
  watch: { name: 'Slack watchlist', lede: 'People, channels and DMs worth checking now and then. The reason you give is what the model uses to decide whether a message is worth surfacing.' },
  questions: { name: 'Open questions', lede: 'Things you have not decided yet. They resurface under Attention when something starts depending on the answer.' },
  context: { name: 'Standing context', lede: 'Facts the summarizer should always know. Plain sentences; it reads them before every pass.' },
  routing: { name: 'Routing hints', lede: 'How things get filed under efforts. Written in plain language, and added to whenever you correct a guess.' },
};

/* ───────────────────────── State ───────────────────────── */

const KEY = 'slorp.proto.v1';
const VIEWS = ['attention', 'efforts', 'sessions', 'pulls', 'journal', 'knowledge', 'settings'];
/* The views the top bar names, in its order; Settings is reached by its own button. Pull requests are named only while GitHub is turned on to list them. */
const nav = () => VIEWS.filter(v => v !== 'settings' && !(v === 'pulls' && pullsOff()));
const VIEW_NAMES = { pulls: 'PRs' };
const fresh = () => ({ view: 'attention', sel: null, effortSel: null, effortOrder: null, kbSel: 'watch', setSel: 'general', groupBy: 'effort', srcFilter: 'all', pullFilter: 'all', notify: false, picks: {}, detailTab: 'source', effortTab: 'sessions', sourceRaw: false, sideShut: false, fluent: true, theme: 'auto',
  handled: {}, moved: {}, sessMoved: {}, extra: [], arrived: {}, collapsed: {}, showHandled: false, variant: {}, rawOpen: {},
  actSel: null, pullSel: null, journalSel: null, pullTab: 'talk', expanded: {}, kb: structuredClone(KB_SEED), seq: 100 });
let state = fresh();
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* storage unavailable: run in memory */ }
/* The view a name leads to, whether it is one or what one used to be called. */
const viewNamed = v => VIEWS.includes(v) ? v : { activity: 'sessions' }[v];
state.view = viewNamed(state.view) || 'attention';
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };
let freshId = null;
/* Which overlay is open, if any. */
let modal = null;
/* The journal: its days as last listed, what its search is looking for and the days that found, the tag its list is narrowed to, and each day's entry as last fetched. */
let journal = [], journalQuery = '', journalFound = null, journalTag = '', journalSeq = 0, journalTimer, journalDocs = {}, journalAsked = {};
/* The search in the overlay: what is being looked for, what it found, which hit is picked. */
let query = '', hits = [], hitSel = 0, searchSeq = 0, searchTimer, modalFocus = false;
/* The session whose name is being edited, and whether its box still wants the cursor. */
let renaming = null, renameFocus = false;

/* ───────────────────────── Helpers ───────────────────────── */

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const WORDS = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const num = n => WORDS[n] ?? String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const listOf = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const ago = m => m < 1 ? 'just now' : m < 60 ? `${Math.round(m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`;
const span = m => m < 60 ? `${Math.round(m)}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`;

const mockItems = () => ITEMS.concat(state.extra.map(id => POOL.find(p => p.id === id)).filter(Boolean));
const allItems = () => live ? liveItems : mockItems();
const itemById = id => allItems().find(i => i.id === id);
const LIVE_UNSORTED = { id: 'unsorted', name: 'Unsorted', raw: '(not filed under any effort)', about: 'Sessions that are not filed under any effort.', line: '', stands: '', dirs: [] };
const effortById = id => live ? (liveEfforts.find(e => e.id === id) || EFFORTS.find(e => e.id === id) || LIVE_UNSORTED) : (EFFORTS.find(e => e.id === id) || UNSORTED);
const effortOf = it => state.moved[it.id] || it.effort;
const sessEffort = s => state.sessMoved[s.id] || s.effort;
const ageOf = it => it.live ? minsSince(it.at) : state.arrived[it.id] ? (Date.now() - state.arrived[it.id]) / 60000 : it.age;
const isActive = it => { const h = state.handled[it.id]; return !h || (h.how === 'snoozed' && h.until < Date.now()); };
const activeItems = () => allItems().filter(isActive);
const activeMockItems = () => mockItems().filter(isActive);
const URG_W = { blocking: 0, awaiting: 1, whenever: 2 };
const byUrgency = (a, b) => URG_W[a.urgency] - URG_W[b.urgency] || ageOf(a) - ageOf(b);

/* A title in whichever voice is switched on: the model's, or the source's. */
const title = (x, cls = '') => state.fluent
  ? `<span class="gen ${cls}">${esc(x.title || x.name)}</span>`
  : `<span class="mono ${cls}">${esc(x.raw)}</span>`;
const kindColor = kind => `--k:var(--k-${kind}, var(--ink3))`;
const kindBadge = (kind, label) => `<span class="kind" style="${kindColor(kind)}"><i></i>${esc(label || KINDS[kind] || kind)}</span>`;
const spark = '<span class="spark" title="Written by the local model">✦</span>';

function groupItems(items) {
  const sorted = items.slice().sort(byUrgency);
  let defs;
  if (state.groupBy === 'urgency') defs = Object.keys(URGENCY).map(k => ({ key: 'u:' + k, name: URGENCY[k], test: i => i.urgency === k }));
  else if (state.groupBy === 'source') defs = Object.keys(KINDS).map(k => ({ key: 'k:' + k, name: KINDS[k], test: i => i.kind === k }));
  else defs = (live ? liveEfforts.concat(LIVE_UNSORTED) : EFFORTS.concat(UNSORTED)).map(e => ({ key: 'e:' + e.id, effort: e, name: e.name, test: i => effortOf(i) === e.id }));
  return defs.map(d => ({ ...d, items: sorted.filter(d.test) })).filter(g => g.items.length);
}
/* The one source the list is narrowed to, which it can be only while grouped by source. */
const sourceShown = items => state.groupBy === 'source' && items.some(i => i.kind === state.srcFilter) ? state.srcFilter : 'all';
const shownItems = (items = activeItems()) => { const src = sourceShown(items); return src === 'all' ? items : items.filter(i => i.kind === src); };
const visibleOrder = () => groupItems(shownItems()).filter(g => !state.collapsed[g.key]).flatMap(g => g.items.map(i => i.id));

let toastTimer;
function toast(msg, undo, label = 'Undo') {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button id="undo">${label}</button>` : ''}`;
  t.classList.add('show');
  if (undo) $('#undo').onclick = () => { undo(); save(); render(); t.classList.remove('show'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 5000);
}

/* Says that items have arrived since the page last looked: with a note in
   the page unless the list they join is already showing, and, when the user
   has turned that on and the page is out of sight, a desktop notification.
   Either way nothing happens until the user clicks. */
let known = null, newsTimer;
const canNotify = () => state.notify && window.Notification?.permission === 'granted';
function announce(items) {
  const arrived = known ? items.filter(i => isActive(i) && !known.has(i.id)).sort(byUrgency) : [];
  known ??= new Set();
  items.forEach(i => known.add(i.id));
  if (!arrived.length) return;
  const first = arrived[0], one = arrived.length === 1;
  const msg = one ? `${KINDS[first.kind] || first.kind}: ${first.title || first.ask}` : `${cap(num(arrived.length))} new things need you`;
  const show = () => { state.sel = first.id; go('attention'); save(); render(); };
  freshId = first.id;
  if (state.view !== 'attention') {
    const n = $('#news');
    n.innerHTML = `<span>${esc(msg)}</span><button>Show</button>`;
    n.querySelector('button').onclick = () => { n.classList.remove('show'); show(); };
    n.classList.add('show');
    clearTimeout(newsTimer);
    newsTimer = setTimeout(() => n.classList.remove('show'), 8000);
  }
  if (canNotify() && document.hidden) {
    try {
      const note = new Notification(one ? first.title || msg : msg, { body: one ? first.ask || '' : arrived.map(i => i.title || i.ask).join('\n'), tag: 'slorp' });
      note.onclick = () => { window.focus(); note.close(); show(); };
    } catch (e) { /* this browser will not show one from a page */ }
  }
}

function resolve(id, how, note, opts = {}) {
  const order = visibleOrder(), i = order.indexOf(id), it = itemById(id);
  state.handled[id] = { how, note: note || '', at: Date.now(), until: opts.until || 0 };
  if (state.sel === id) state.sel = order[i + 1] || order[i - 1] || null;
  const msg = opts.msg || { answered: `Sent to ${it.src}`, dismissed: 'Dismissed', snoozed: `Snoozed ${note}` }[how];
  toast(msg, () => { delete state.handled[id]; state.sel = id; if (opts.undo) opts.undo(); });
}

/* What is selected in each view, kept with a history entry so Back restores it. */
const place = () => ({ sel: state.sel, effortSel: state.effortSel, kbSel: state.kbSel, actSel: state.actSel, setSel: state.setSel, pullSel: state.pullSel, journalSel: state.journalSel });

function go(view) {
  if (view === state.view) return;
  history.replaceState(place(), '');
  state.view = view;
  history.pushState(place(), '', '#' + view);
}

/* Opens an effort as the large card, or the board of them all when given none. Going between the board and
   an effort leaves a history entry so Back undoes it; going from one effort to another is a selection.
   morph asks the next drawing to show each card moving to where it now is, and reveal to bring the open
   effort's card into sight in the column. */
let morph = false, reveal = false;
function openEffort(id) {
  if (state.view !== 'efforts') { state.effortSel = id; go('efforts'); return; }
  if (state.effortSel === id) return;
  morph = reveal = true;
  if (state.effortSel && id) { state.effortSel = id; return; }
  history.replaceState(place(), '');
  state.effortSel = id;
  history.pushState(place(), '', '#efforts');
}
/* Goes to a view the way the top bar does: Efforts opens on its board. */
const visit = view => view === 'efforts' ? openEffort(null) : go(view);

/* ───────────────────────── Attention ───────────────────────── */

function briefing(items) {
  let text;
  if (!items.length) text = 'Nothing needs you. Everything that is running can keep running without you.';
  else {
    const efforts = new Set(items.map(effortOf));
    const blocking = items.filter(i => i.urgency === 'blocking'), awaiting = items.filter(i => i.urgency === 'awaiting');
    const where = list => listOf([...new Set(list.map(i => effortById(effortOf(i)).name))]);
    const count = (list, what) => `${cap(num(list.length))} ${list.length === 1 ? 'is' : 'are'} ${what}, in ${where(list)}.`;
    const one = items.length === 1;
    text = [`${cap(num(items.length))} thing${one ? '' : 's'} need${one ? 's' : ''} you across ${num(efforts.size)} effort${efforts.size === 1 ? '' : 's'}.`,
      blocking.length ? count(blocking, 'blocking someone else') : '',
      awaiting.length ? count(awaiting, 'awaiting you') : '',
      !blocking.length && !awaiting.length ? 'Nobody is held up and nothing is stopped on you, so all of it will keep.' : items.length > blocking.length + awaiting.length ? 'The rest will keep.' : '',
    ].filter(Boolean).join(' ');
  }
  const day = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  return `<div class="brief"><div class="when"><span class="label">${day}</span><span class="label">${live ? '' : spark}briefing</span></div><p>${esc(text)}</p>
    ${live ? `<button class="link ${modelless() ? 'off' : ''}" data-act="wrapOpen" style="margin-top:8px;font-size:12.5px" title="${modelless() ? `${NO_MODEL} to write a wrap-up.` : "What moved today, by effort, on today's page of the journal (w)"}">Wrap up the day ›</button>` : ''}</div>`;
}

function rowHtml(it, act = 'select') {
  const grouped = act === 'select' ? state.groupBy : 'effort';
  const chips = `${grouped === 'source' ? '' : kindBadge(it.kind)}${it.live && it.session ? roleChip(it.session) + pullChip(it.session) + subChip(it.session) : ''}${grouped === 'effort' ? '' : `${effortChip(effortOf(it))}`}`;
  /* The short form keeps the title, its age and urgency, and the description. */
  const long = state.rows !== 'short';
  return `<button class="row ${it.urgency} ${state.view === 'attention' && it.id === state.sel ? 'sel' : ''} ${it.id === freshId ? 'fresh' : ''}" data-act="${act}" data-id="${it.id}" style="${kindColor(it.kind)}">
    <span class="h">${title(it, 't')}<span class="w"><span>${ago(ageOf(it))}</span>${it.urgency === 'whenever' ? '' : `<span class="tag ${it.urgency}">${it.urgency}</span>`}</span></span>
    ${it.subtitle && state.fluent ? `<span class="st">${esc(it.subtitle)}</span>` : ''}
    ${long && chips ? `<span class="m">${chips}</span>` : ''}
    ${long && it.live && it.session?.model ? `<span class="m"><span>${runsOn(it.session)}</span>${contextUse(it.session, true)}</span>` : ''}
  </button>`;
}

function handledFooter() {
  const done = allItems().filter(i => !isActive(i));
  const legend = modelless()
    ? `<p>${NO_MODEL}, so only permission prompts, questions a session puts to you, failures and full contexts are raised here. A session that has simply stopped is under Sessions.</p>`
    : `<p>${spark}marks text written by the local model. <span class="mono">Mono</span> is verbatim from the source.</p>`;
  if (!done.length) return `<div class="foot">${legend}</div>`;
  const list = state.showHandled ? `<div class="handled">${done.map(i => `<div><span class="gen">${esc(i.title)}</span><span style="white-space:nowrap">${esc(state.handled[i.id].how)} · <button class="link" data-act="restore" data-id="${i.id}">restore</button></span></div>`).join('')}</div>` : '';
  return `<div class="foot"><p style="margin-bottom:8px">${done.length} handled or snoozed · <button class="link" data-act="toggleHandled">${state.showHandled ? 'hide' : 'show'}</button></p>${list}${legend}</div>`;
}

function rawBlock(lines) {
  return `<div class="rawblock">${lines.map(([who, tx]) => `<div class="ln"><span class="who">${esc(who)}</span><span class="tx">${esc(tx)}</span></div>`).join('')}</div>`;
}

function sessionRow(s, from) {
  return `<div class="srow" ${from ? dragsFrom(s.id, from) : ''}><span class="dot ${s.status}" title="${STATUS[s.status]}"></span>
    <div class="body"><div>${title(s, 'ttl')}</div>${state.fluent ? `<div class="sub">${esc(s.doing)}</div>` : ''}</div>
    <span class="side">${kindBadge(s.kind)} · ${STATUS[s.status]}</span></div>`;
}

function itemDetail(it) {
  if (it.live) return liveItemDetail(it);
  const eff = effortById(effortOf(it));
  const v = (state.variant[it.id] || 0) % it.summary.length;
  const siblings = SESSIONS.filter(s => sessEffort(s) === eff.id && s.id !== it.session);
  const rawOpen = state.rawOpen[it.id] ?? !state.fluent;
  let answer;
  if (it.route) {
    answer = `<div class="replies">${EFFORTS.map(e => `<button class="btn" data-act="route" data-id="${it.id}" data-effort="${e.id}">${esc(e.name)}</button>`).join('')}
      <button class="btn quiet" data-act="dismiss" data-id="${it.id}">Leave unsorted</button></div>`;
  } else {
    const quick = (it.replies || []).map((r, i) => `<button class="btn ${i === 0 ? 'go' : ''}" data-act="reply" data-id="${it.id}" data-text="${esc(r)}">${esc(r)}</button>`).join('');
    answer = `${quick ? `<div class="replies">${quick}</div>` : ''}
      <textarea id="reply" data-id="${it.id}" data-keep="item-${it.id}" class="${it.draft ? 'drafted' : ''}" placeholder="Or say something else…">${esc(it.draft || '')}</textarea>
      <div class="send"><span>${it.draft ? `${spark}Drafted for you. Edit before sending.` : `Goes back to the ${esc(it.src.toLowerCase())}.`}</span>
      <button class="btn ${quick ? '' : 'go'}" data-act="send" data-id="${it.id}">Send</button></div>`;
  }
  return `<div class="inner">
    <div class="crumb"><button class="eff" data-act="effort" data-id="${eff.id}">${effortMark(eff, 's')}${esc(eff.name)} ›</button>${kindBadge(it.kind, it.src)}<span>${ago(ageOf(it))}</span><span class="tag ${it.urgency}">${it.urgency}</span></div>
    <div class="titled"><h1 class="${state.fluent ? '' : 'mono'}">${esc(state.fluent ? it.title : it.raw)}</h1>${itemMenu(it, `<button data-act="park" data-id="${it.id}">Park as open question</button>
      ${menuPart('move', 'Move to', menuTo('moveTo', it.id, EFFORTS.concat(UNSORTED).filter(e => e.id !== eff.id).map(e => [e.id, e.name])))}`)}</div>
    <div class="need"><div class="label">${spark}What's needed from you</div><p class="ask">${esc(it.ask)}</p>${answer}</div>
    <div class="sec"><div class="label"><span>${spark}What's going on</span><button data-act="rephrase" data-id="${it.id}">↻ ${v === 0 ? 'Shorter' : 'Fuller'}</button></div>
      <p class="prose" id="summary">${esc(it.summary[v])}</p></div>
    <div class="sec"><div class="label"><span>From the source, verbatim</span><button data-act="toggleRaw" data-id="${it.id}">${rawOpen ? 'Hide' : 'Show'}</button></div>
      ${rawOpen ? rawBlock(it.lines) : `<div class="none mono">${esc(it.raw)}</div>`}</div>
    <div class="sec"><div class="label"><span>Also going on in ${esc(eff.name)}</span></div>
      ${siblings.length ? siblings.map(s => sessionRow(s)).join('') : '<div class="none">Nothing else is running here.</div>'}</div>
  </div>`;
}

function viewAttention() {
  const all = activeItems(), items = shownItems(all), src = sourceShown(all);
  if (!items.some(i => i.id === state.sel)) state.sel = visibleOrder()[0] || null;
  const present = Object.keys(KINDS).filter(k => all.some(i => i.kind === k));
  const chips = state.groupBy === 'source' && present.length > 1
    ? `<div class="chips">${[['all', 'All', all.length]].concat(present.map(k => [k, KINDS[k], all.filter(i => i.kind === k).length]))
        .map(([k, name, n]) => `<button class="chip ${src === k ? 'on' : ''}" data-act="srcFilter" data-src="${k}">${k === 'all' ? '' : `<i style="${kindColor(k)}"></i>`}${esc(name)} <span class="n">${n}</span></button>`).join('')}</div>`
    : '';
  const groups = groupItems(items).map(g => {
    const shut = state.collapsed[g.key];
    const name = g.effort ? effortMark(g.effort, 's') + title(g.effort) : esc(g.name);
    return `<div class="ghead">
        <button class="name" data-act="collapse" data-key="${g.key}"><span class="chev ${shut ? 'shut' : ''}">▼</span> ${name}</button>
        <span class="n">${g.items.length}</span>
        ${g.effort && !(live && g.effort.id === 'unsorted') ? `<button class="open" data-act="effort" data-id="${g.effort.id}" title="Open this effort">open ›</button>` : ''}
      </div>
      ${g.effort && g.effort.line && state.fluent && !shut ? `<div class="gline">${esc(g.effort.line)}</div>` : ''}
      ${shut ? '' : g.items.map(i => rowHtml(i)).join('')}`;
  }).join('');
  const seg = ['effort', 'urgency', 'source'].map(b => `<button class="${state.groupBy === b ? 'on' : ''}" data-act="group" data-by="${b}">${cap(b)}</button>`).join('');
  const rows = ['long', 'short'].map(as => `<button class="${(state.rows || 'long') === as ? 'on' : ''}" data-act="rows" data-as="${as}">${cap(as)}</button>`).join('');
  const sel = state.sel && itemById(state.sel);
  const sided = sel && sel.live && !sel.feed;
  const side = sided ? sessionSide(sel.session, sel.summary, false, 'att-side') : '';
  return `<div class="split ${sided ? 'sided' : ''} ${sided && state.sideShut ? 'shut' : ''}">
    <section class="pane list" data-scroll="att-list">
      ${briefing(all)}
      <div class="listbar"><span class="label">Needs you</span><span class="segs"><span class="seg" role="group" aria-label="Group by">${seg}</span>
        <span class="seg" role="group" aria-label="How much each row shows" title="Short rows show only the title, how long ago, and the description.">${rows}</span></span></div>
      ${chips}
      ${groups}
      ${handledFooter()}
    </section>
    <section class="pane detail" data-scroll="att-${state.sel}">${sel ? itemDetail(sel) : `<div class="empty">${spark}All clear. Go make something.</div>`}</section>
    ${side}
  </div>`;
}

/* ───────────────────────── Efforts ───────────────────────── */

function effortDetail(e) {
  const needs = activeMockItems().filter(i => effortOf(i) === e.id).sort(byUrgency);
