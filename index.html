        open: ['Retention policy for pruning is yours to decide', 'Nightly benchmark needs disk space before it runs again'],
        sessions: [{ id: 'm-store', label: 'Postgres snapshot store', pull: 'go-estoria/estoria#61' }, { id: 'm-bench', label: 'Benchmark harness' }],
        pulls: [{ key: 'go-estoria/estoria#61', title: 'Postgres snapshot store with pruning', url: 'https://github.com/go-estoria/estoria/pull/61' }] },
      { id: 'fork', name: 'Work fork catch-up', summary: 'The upgrade branch compiles against v0.14. The integration suite has not run yet.',
        points: [{ text: 'Fixed the compile errors from the v0.14 API changes', sessions: ['m-fork'] }], open: ['Integration tests wait on permission to use local Postgres', 'Priya wants a date for the stream iterator'],
        sessions: [{ id: 'm-fork', label: 'Upgrade to v0.14' }] }] },
  { day: dayKey(1), state: 'ready', at: minsAgo(60 * 22), moments: 18, headline: 'A docs day: three concept pages rewritten, and the quickstart outlined.',
    tags: [{ name: 'docs', via: 'guess' }, { name: 'writing', via: 'guess' }],
    efforts: [
      { id: 'docs', name: 'estoria.dev docs refresh', summary: 'Aggregates, Event streams and Projections were rewritten and build cleanly. The quickstart has an outline.',
        points: [{ text: 'Rewrote the Aggregates, Event streams and Projections pages', sessions: ['m-docs'] }, { text: 'Outlined the quickstart rewrite', sessions: ['m-quick'] }], open: ['Which event store the quickstart is written around'],
        sessions: [{ id: 'm-docs', label: 'Concept pages' }, { id: 'm-quick', label: 'Quickstart rewrite' }] }] },
  { day: dayKey(3), state: 'ready', at: minsAgo(60 * 70), moments: 9, headline: 'Slorp learned to read Claude Code transcripts.',
    tags: [{ name: 'prototyping', via: 'guess' }, { name: 'benchmarks', via: 'guess' }],
    efforts: [
      { id: 'slorp', name: 'Slorp', summary: 'The ingest sketch showed transcripts can be tailed as JSON lines, and the summarizer was timed against a local model.',
        points: [{ text: 'Found that transcript files can be tailed as JSON lines', sessions: ['m-ingest'] }, { text: 'Timed the summarizer: 11 sessions titled in 6.2 seconds', sessions: ['m-ingest'] }], open: ['Where the knowledge base should live'],
        sessions: [{ id: 'm-ingest', label: 'Ingest sketch' }] }] },
];
/* The journal's days as its list shows them, the latest first, and the whole of one day's entry once it has been fetched. */
const journalDays = () => live ? journal : MOCK_JOURNAL.map(w => ({ day: w.day, state: w.state, at: w.at, headline: w.headline, tags: w.tags, efforts: w.efforts.map(e => e.name) }));
const entryOf = day => live ? journalDocs[day] : MOCK_JOURNAL.find(w => w.day === day);
/* A day's entry is fetched when its page is opened, and again whenever its line in the list has changed. */
function fetchEntry(d) {
  const stamp = JSON.stringify(d);
  if (!live || journalAsked[d.day] === stamp) return;
  journalAsked[d.day] = stamp;
  fetch(`/api/journal/${d.day}`).then(r => r.ok ? r.json() : null).then(doc => { if (doc) { journalDocs[d.day] = doc; render(); } }).catch(() => { delete journalAsked[d.day]; });
}
function runJournalSearch() {
  const n = ++journalSeq, q = journalQuery, words = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) { journalFound = null; render(); return; }
  if (!live) {
    journalFound = Object.fromEntries(MOCK_JOURNAL.filter(w => words.every(x => JSON.stringify(w).toLowerCase().includes(x))).map(w => [w.day, w.headline]));
    render(); return;
  }
  fetch('/api/journal/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ q }) })
    .then(r => r.ok ? r.json() : { hits: [] }).then(d => { if (n === journalSeq) { journalFound = Object.fromEntries((d.hits || []).map(x => [x.day, x.text])); render(); } }).catch(() => {});
}
function tagDay(day, tag, on) {
  if (live) { api('POST', `/api/journal/${day}/tags`, { tag, on }); return; }
  const w = entryOf(day), name = tag.trim().toLowerCase().replace(/^#+/, '').replace(/\s+/g, ' ').trim();
  if (!w || !name) return;
  w.tags = w.tags.filter(t => t.name !== name).concat(on ? { name } : []);
}
/* The tags the journal's days go by with how many days each, the most used first. */
function tagCounts() {
  const n = {};
  journalDays().forEach(d => (d.tags || []).forEach(t => { n[t.name] = (n[t.name] || 0) + 1; }));
  return Object.entries(n).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
/* The days the journal's list shows: those the search found and the tag picked out, and today whether or not it has been written. */
function journalShown() {
  const days = journalDays(), today = dayKey(0);
  return (days.some(d => d.day === today) ? days : [{ day: today, state: '', tags: [], efforts: [] }].concat(days))
    .filter(d => (!journalTag || (d.tags || []).some(t => t.name === journalTag)) && (!journalFound || d.day in journalFound));
}
function journalRow(d) {
  const rel = d.day === dayKey(0) ? 'today' : d.day === dayKey(1) ? 'yesterday' : '', found = journalFound && journalFound[d.day];
  const said = d.headline || { pending: 'Being written…', empty: 'Nothing was said in any session.', failed: 'It could not be written.' }[d.state] || 'Not written yet.';
  const under = (d.tags || []).map(t => `<span class="jt">${esc(t.name)}</span>`).join('') + ((d.efforts || []).length ? `<span>${esc(listOf(d.efforts))}</span>` : '');
  return `<button class="row ${d.day === state.journalSel ? 'sel' : ''}" data-act="journalSel" data-id="${d.day}">
    <span class="h"><span class="t">${esc(dayName(d.day))}</span><span class="w">${rel ? `<span>${rel}</span>` : ''}${d.state === 'pending' ? '<span class="tag awaiting">writing</span>' : d.state === 'failed' ? '<span class="tag whenever">failed</span>' : ''}</span></span>
    <span class="st">${found ? mark(found, journalQuery) : esc(said)}</span>
    ${state.rows === 'short' || !under ? '' : `<span class="m">${under}</span>`}
  </button>`;
}

/* The pull requests one point of an entry came out of: those its sessions were working on. */
const pointPulls = (e, p) => [...new Set((p.sessions || []).map(id => (e.sessions || []).find(s => s.id === id)?.pull).filter(Boolean))].map(k => (e.pulls || []).find(x => x.key === k)).filter(Boolean);
/* A pull request an entry names: a way to its page here while it is still listed, and to GitHub once it is not. */
function journalPull(p) {
  const listed = !pullsOff() && allPulls().some(x => pullKey(x) === p.key), text = esc(p.key.split('/').pop()), about = esc(`${p.title} (${p.key})`);
  return listed ? `<button class="pr" data-act="pullOpen" data-id="${esc(p.key)}" title="${about}">${text}</button>`
    : /^https:\/\//.test(p.url || '') ? `<a class="pr" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer" title="${about}, no longer listed here">${text} ↗</a>`
    : `<span class="pr" title="${about}">${text}</span>`;
}
function journalSession(s) {
  const known = live && (live.some(x => x.id === s.id) || archive.some(a => a.id === s.id));
  return known ? `<button class="link" data-act="journalSession" data-id="${esc(s.id)}" title="Open this session">${esc(clip(s.label, 44))}</button>` : `<span title="${live ? 'This session is no longer listed' : ''}">${esc(clip(s.label, 44))}</span>`;
}
function wrapupMarkdown(w) {
  const point = (e, p) => { const prs = pointPulls(e, p).map(x => x.key); return `- ${p.text}${prs.length ? ` (${prs.join(', ')})` : ''}`; };
  const part = e => [`## ${e.name}`, e.summary, (e.points || []).map(p => point(e, p)).join('\n'), (e.open || []).length ? `Still open:\n${e.open.map(p => `- ${p}`).join('\n')}` : ''].filter(Boolean).join('\n\n');
  return [`# ${dayName(w.day)}`, w.headline, (w.tags || []).length ? `Tags: ${w.tags.map(t => t.name).join(', ')}` : ''].concat((w.efforts || []).map(part)).filter(Boolean).join('\n\n') + '\n';
}

/* A day's tags, each a way to the other days that go by it, with a box to add one. */
function journalTags(d) {
  const chips = (d.tags || []).map(t => `<span class="jt" title="${t.via ? 'Given by the local model' : 'Given by you'}">${t.via ? spark : ''}<button data-act="journalTag" data-tag="${esc(t.name)}" data-only="1">${esc(t.name)}</button><button class="x" data-act="tagOff" data-day="${d.day}" data-tag="${esc(t.name)}" title="Take this tag off the day" aria-label="Take the tag ${esc(t.name)} off">×</button></span>`).join('');
  const known = tagCounts().filter(([name]) => !(d.tags || []).some(t => t.name === name)).map(([name]) => `<option value="${esc(name)}">`).join('');
  return `<div class="jtags">${chips}<form data-form="tag" data-id="${d.day}"><input name="tag" data-keep="tag-${d.day}" placeholder="Add a tag…" maxlength="32" list="jtagsKnown" autocomplete="off" aria-label="Add a tag to this day"><datalist id="jtagsKnown">${known}</datalist></form></div>`;
}

/* An effort's part of a day: what was done, what was left open, and the sessions and pull requests it came from. */
function journalPart(e) {
  const many = (e.sessions || []).length > 1;
  const point = p => {
    const from = (p.sessions || []).map(id => (e.sessions || []).find(s => s.id === id)).filter(Boolean);
    const meta = pointPulls(e, p).map(journalPull).join('') + (many ? from.map(journalSession).join('') : '');
    return `<li>${esc(p.text)}${meta ? `<span class="pm">${meta}</span>` : ''}</li>`;
  };
  const about = [(e.pulls || []).length ? `<span>${(e.pulls || []).map(journalPull).join(' ')}</span>` : '', (e.sessions || []).length ? `<span>${plural(e.sessions.length, 'session')}: ${e.sessions.map(journalSession).join(', ')}</span>` : ''].join('');
  return `${e.summary ? `<p class="prose">${esc(e.summary)}</p>` : ''}
    ${(e.points || []).length ? `<ul>${e.points.map(point).join('')}</ul>` : ''}
    ${(e.open || []).length ? `<div class="label" style="margin-top:12px">Still open</div><ul class="open">${e.open.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${about ? `<div class="jmeta">${about}</div>` : ''}`;
}
function journalEffort(e) {
  const real = (live ? liveEfforts : EFFORTS).some(x => x.id === e.id);
  return `<div class="sec"><h3>${real ? `<button data-act="effort" data-id="${esc(e.id)}">${effortMark(effortById(e.id), 's')}${esc(e.name)} ›</button>` : esc(e.name)}</h3>${journalPart(e)}</div>`;
}

function journalPage(d) {
  const w = d.state ? entryOf(d.day) : null, writer = summarizer.model ? summarizer.model.split('/').pop() : '', has = !!(w && (w.efforts || []).length);
  const date = dayDate(d.day).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const from = w ? plural(w.moments, 'exchange') : '';
  let note = '';
  if (!d.state) note = `<p class="none">Nothing has been written for this day yet. ${writer ? `${esc(writer)} writes it from what you said in each session and how it came out.` : `${NO_MODEL} to write it.`}</p>`;
  else if (d.state === 'empty') note = '<p class="none">Nothing was said in any session that day, as far as Slorp saw.</p>';
  else if (!w) note = '<p class="none">Fetching it…</p>';
  else if (d.state === 'pending' && has) note = `<p class="none">${writer ? `${esc(writer)} is writing it again from ${from}.` : 'It waits for a local model to write it again.'} What was written before stands until then.</p>`;
  else if (d.state === 'pending') note = `<p class="prose thinking">Writing up what moved in each effort over the day.</p><p class="prose thinking" style="margin-top:8px">One line for each thing done.</p>
      <p class="none" style="margin-top:12px">${writer ? `${esc(writer)} is writing it from ${from}.` : 'Waiting for a local model to be loaded.'}</p>`;
  else if (d.state === 'failed') note = `<p class="none"><b>It could not be written${has ? ' again, so this is what was written before' : ''}.</b> ${esc(w.error || '')}</p>`;
  const write = live && d.state !== 'pending' ? `<button class="btn ${d.state ? '' : 'go'}" data-act="wrapAsk" data-day="${d.day}" ${modelless() ? `disabled title="${NO_MODEL} to write it."` : ''}>${d.state ? 'Write it again' : 'Write it'}</button>` : '';
  return `<div class="inner jr">
    <div class="crumb"><span class="eff">Journal</span><span>${d.day === dayKey(0) ? 'today' : d.day === dayKey(1) ? 'yesterday' : ago(minsSince(dayDate(d.day)))}</span>
      ${has && d.state === 'ready' ? `<span>${live ? spark : ''}written ${ago(minsSince(w.at))} from ${from}</span>` : ''}</div>
    <h1>${esc(date)}</h1>
    ${d.headline ? `<p class="subt">${spark}${esc(d.headline)}</p>` : ''}
    ${d.state ? journalTags(d) : ''}
    ${note ? `<div style="margin-top:18px">${note}</div>` : ''}
    ${has ? w.efforts.map(journalEffort).join('') : ''}
    <div class="bar" style="margin-top:28px">${write}${has ? `<button class="btn" data-act="wrapCopy" data-day="${d.day}">Copy as Markdown</button>` : ''}</div>
  </div>`;
}

/* Shows every day again, with nothing looked for and no tag picked out. */
function clearJournalSearch() {
  journalQuery = ''; journalFound = null; journalTag = ''; journalSeq++;
  clearTimeout(journalTimer);
  if ($('#jq')) $('#jq').value = '';
}
function openToday() {
  clearJournalSearch();
  state.journalSel = dayKey(0);
  go('journal');
}

function viewJournal() {
  const counts = tagCounts(), all = journalDays();
  if (journalTag && !counts.some(([name]) => name === journalTag)) journalTag = '';
  const shown = journalShown();
  if (!shown.some(d => d.day === state.journalSel)) state.journalSel = shown[0]?.day || null;
  const sel = shown.find(d => d.day === state.journalSel), narrowed = journalTag || journalFound;
  if (sel && sel.state) fetchEntry(sel);
  const more = state.expanded.jtags, few = 10;
  const chips = counts.slice(0, more ? counts.length : few).map(([name, n]) => `<button class="chip ${journalTag === name ? 'on' : ''}" data-act="journalTag" data-tag="${esc(name)}">${esc(name)} <span class="n">${n}</span></button>`).join('')
    + (counts.length > few ? `<button class="link" data-act="expand" data-id="jtags" style="font-size:12.5px">${more ? 'Fewer' : `${counts.length - few} more`}</button>` : '');
  const rows = ['long', 'short'].map(as => `<button class="${(state.rows || 'long') === as ? 'on' : ''}" data-act="rows" data-as="${as}">${cap(as)}</button>`).join('');
  const months = [];
  shown.forEach(d => {
    const name = dayDate(d.day).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    if (months.at(-1)?.[0] !== name) months.push([name, []]);
    months.at(-1)[1].push(d);
  });
  const list = months.map(([name, days]) => `<div class="ghead"><span class="name">${name}</span><span class="n">${days.length}</span></div>${days.map(journalRow).join('')}`).join('');
  const n = shown.length;
  const status = narrowed ? `${n ? cap(num(n)) : 'None'} of ${plural(all.length, 'day')} ${[journalFound ? `${n === 1 ? 'matches' : 'match'} the search` : '', journalTag ? `${n === 1 ? 'is' : 'are'} tagged “${esc(journalTag)}”` : ''].filter(Boolean).join(' and ')}. <button class="link" data-act="journalClear">Show every day</button>`
    : live && !all.length ? 'A day is written when you ask for it, and the day after if you did not.' : '';
  return `<div class="split">
    <section class="pane list" data-scroll="journal-list">
      <div class="listbar"><span class="label">Journal</span><span class="segs"><span class="seg" role="group" aria-label="How much each row shows">${rows}</span></span></div>
      <input class="jq" id="jq" data-keep="journal-q" value="${esc(journalQuery)}" placeholder="Search what was done, on any day…" autocomplete="off" spellcheck="false" aria-label="Search the journal">
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${status ? `<div class="gline" style="padding-top:8px">${status}</div>` : ''}
      ${list}
    </section>
    <section class="pane detail" data-scroll="journal-${state.journalSel || ''}">${sel ? journalPage(sel) : `<div class="empty">No day ${narrowed ? 'matches' : 'is selected'}.</div>`}</section>
  </div>`;
}

/* ───────────────────────── Knowledge base ───────────────────────── */

const effortOptions = () => (live ? '<option value="">No effort</option>' : '') + (live ? openEfforts() : EFFORTS).map(e => `<option value="${e.id}">${esc(e.name)}</option>`).join('');
const GLYPH = { person: '@', channel: '#', dm: '✉' };

const KB_LIVE_LEDE = {
  watch: 'People, channels and DMs worth checking for each effort, and why. This list is saved, but nothing reads Slack yet, so it does not surface anything on its own.',
  questions: 'Things you have not decided yet. They show under their effort, and the model reads them when it writes that effort\'s status.',
  context: 'Facts the model should always know. It reads them before describing any session, so changing one re-describes everything.',
  routing: 'Plain-language notes on how to file things, read by the model when it guesses an effort. Directories that file automatically are listed under each effort.',
  roles: 'The kinds of session you tell apart, such as one that reviews pull requests on a loop. Give a session a role from the menu beside its name under Attention or Sessions. The local model guesses a role for the rest from what each role is about; a guess only labels a session, and never keeps it from asking for you.',
};
/* Says which parts of the knowledge base nothing reads without a local model. */
const KB_UNREAD = {
  questions: 'so nothing reads these at the moment. They still show under their effort.',
  context: 'so nothing reads these at the moment. They are kept for when one is.',
  routing: 'so nothing reads these at the moment. Directories still file sessions.',
  roles: 'so a session has a role only when you give it one.',
};
const kbUnread = k => modelless() && KB_UNREAD[k] ? `<p class="none" style="margin:-6px 0 14px">${NO_MODEL}, ${KB_UNREAD[k]}</p>` : '';
const kbData = () => live ? knowledge : state.kb;
const kbSections = () => live ? { ...KB_SECTIONS, roles: { name: 'Session roles' } } : KB_SECTIONS;
const kbCount = k => kbData()[k].length;

function integrationsBody() {
  const checked = i => {
    const f = feeds[i.id];
    if (!i.enabled || !i.available || !(i.watches || []).length) return '';
    const status = !f ? 'Checking now…'
      : f.error ? `The last check, ${ago(minsSince(f.at))}, failed: ${f.error}${f.count ? ` Showing what it found before.` : ''}`
      : `Checked ${ago(minsSince(f.at))}: ${f.count ? `${num(f.count)} thing${f.count === 1 ? '' : 's'}` : 'nothing'} for you.`;
    return `<div class="meta" style="align-items:center"><span>${esc(status)}</span><button class="link" data-act="feedCheck">Check now</button></div>`;
  };
  const cards = integrations.map(i => `<div class="card"><span class="glyph">${esc(i.name[0])}</span>
      <div class="body"><div class="nm">${esc(i.name)} <span class="tag ${i.enabled && i.available ? 'blocking' : 'whenever'}">${i.enabled ? (i.available ? 'on' : 'on, but unavailable') : 'off'}</span></div>
      <div class="why">${esc(i.about)}</div>
      <div class="meta"><span>${esc(i.detail)}</span></div>
      ${(i.watches || []).length ? `<div class="seen">While it is on, Slorp lists under Attention:</div>${i.watches.map(l => `<div class="seen">· ${esc(l)}</div>`).join('')}${checked(i)}` : ''}
      ${i.lookups.length ? `<div class="seen">While it is on, the model may:</div>` : ''}
      ${i.lookups.map(l => `<div class="seen">· ${esc(l)}</div>`).join('')}</div>
      <button class="btn ${i.enabled ? '' : 'go'}" data-act="integrationToggle" data-id="${i.id}" data-on="${i.enabled ? '0' : '1'}" ${!i.enabled && !i.available ? 'disabled' : ''}>${i.enabled ? 'Turn off' : 'Turn on'}</button></div>`).join('');
  const recent = lookups.slice().reverse().map(l => `<div class="srow"><span class="dot ${l.ok ? 'done' : 'error'}"></span>
      <div class="body"><div class="ttl">${esc(l.what)}${l.ok ? '' : ' · failed'}</div><div class="sub mono" style="font-size:12px">${esc(clip(l.detail, 260))}</div></div>
      <span class="side">${esc(clip(l.session, 28))} · ${ago(minsSince(l.at))}</span></div>`).join('');
  return `${cards}<div class="sec"><div class="label"><span>What the model looked up recently</span></div>
    ${recent || '<div class="none">Nothing yet. Lookups appear here as the model makes them, and are forgotten when the service restarts.</div>'}</div>`;
}

function rolesBody() {
  const options = cur => Object.entries(ATTENTION).map(([k, name]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${name}</option>`).join('');
  const cards = knowledge.roles.map(r => {
    const mine = live.filter(s => s.role === r.id), guessed = mine.filter(s => s.roleVia === 'guess').length;
    return `<div class="card"><span class="glyph">${esc(r.name[0].toUpperCase())}</span>
      <div class="body"><div class="nm">${esc(r.name)}</div>${r.about ? `<div class="why">${esc(r.about)}</div>` : ''}
      <div class="meta" style="align-items:center"><select class="btn" data-change="roleAttention" data-id="${r.id}" aria-label="What sessions in this role may ask for">${options(r.attention)}</select>
        <span>${mine.length ? `${plural(mine.length, 'open session')}${guessed ? `, ${num(guessed)} guessed by the model` : ''}` : 'no open sessions'}</span></div></div>
      <button class="x" data-act="kbRemove" data-sec="roles" data-id="${r.id}" title="Remove" aria-label="Remove">×</button></div>`;
  }).join('');
  return `${cards}<form class="add" data-form="roles"><input name="name" data-keep="kb-roles-name" placeholder="Role, such as PR reviewer" required>
    <input name="text" data-keep="kb-roles-text" placeholder="What its sessions do, for the model to recognise them">
    <select name="type" data-keep="kb-roles-type" aria-label="What its sessions may ask for">${options('all')}</select><button class="btn go">Add</button></form>`;
}

function kbBody(sec) {
  if (sec === 'roles') return rolesBody();
  const list = kbData()[sec];
  const rm = id => `<button class="x" data-act="kbRemove" data-sec="${sec}" data-id="${id}" title="Remove" aria-label="Remove">×</button>`;
  if (sec === 'watch') return list.map(w => `<div class="card"><span class="glyph">${GLYPH[w.type]}</span>
      <div class="body"><div class="nm">${esc(w.name)}</div><div class="why">${esc(w.why)}</div>
      ${w.seen ? `<div class="seen">${spark}${esc(w.seen)} <span class="dim" style="color:var(--ink3)">${ago(w.seenAge)}</span></div>` : ''}
      <div class="meta">${w.cadence ? `<span>checked ${esc(w.cadence)}</span>` : ''}${w.efforts.map(id => `<button class="link" data-act="effort" data-id="${id}">${esc(effortById(id).name)}</button>`).join('')}</div></div>${rm(w.id)}</div>`).join('')
    + `<form class="add" data-form="watch"><select name="type" data-keep="kb-watch-type" aria-label="Type"><option value="person">Person</option><option value="channel">Channel</option><option value="dm">DM</option></select>
      <input name="name" data-keep="kb-watch-name" placeholder="Name or #channel" required><input name="why" data-keep="kb-watch-why" placeholder="Why it's worth watching" required>
      <select name="effort" data-keep="kb-watch-effort" aria-label="Effort">${effortOptions()}</select><button class="btn go">Add</button></form>`;
  if (sec === 'questions') return list.map(q => `<div class="card"><input type="checkbox" data-change="kbResolve" data-id="${q.id}" aria-label="Mark resolved">
      <div class="body"><div class="q">${esc(q.text)}</div>
      <div class="meta">${q.effort ? `<button class="link" data-act="effort" data-id="${q.effort}">${esc(effortById(q.effort).name)}</button>` : '<span>no effort</span>'}<span>${ago(q.at ? minsSince(q.at) : q.age)}</span><span>${esc(q.origin)}</span></div></div>${rm(q.id)}</div>`).join('')
    + `<form class="add" data-form="questions"><input name="text" data-keep="kb-questions-text" placeholder="Something you haven't decided yet" required>
      <select name="effort" data-keep="kb-questions-effort" aria-label="Effort">${effortOptions()}</select><button class="btn go">Add</button></form>`;
  return list.map(c => `<div class="card fact"><div class="body"><div class="q">${esc(c.text)}</div></div>${rm(c.id)}</div>`).join('')
    + `<form class="add" data-form="${sec}"><input name="text" data-keep="kb-${sec}-text" placeholder="${sec === 'context' ? 'A fact the summarizer should always know' : 'A rule for filing things under efforts'}" required><button class="btn go">Add</button></form>`;
}

function viewKnowledge() {
  const nav = Object.entries(kbSections()).map(([k, s]) => `<button class="${state.kbSel === k ? 'on' : ''}" data-act="kbSel" data-s="${k}">${s.name}<span>${kbCount(k)}</span></button>`).join('');
  if (!kbSections()[state.kbSel]) state.kbSel = 'watch';
  const s = kbSections()[state.kbSel];
  return `<div class="split narrow">
    <section class="pane list kbnav"><div class="label">Knowledge base</div>${nav}</section>
    <section class="pane detail" data-scroll="kb-${state.kbSel}"><div class="inner"><h1>${s.name}</h1><p class="lede">${live ? KB_LIVE_LEDE[state.kbSel] : s.lede}</p>${kbUnread(state.kbSel)}${kbBody(state.kbSel)}</div></section>
  </div>`;
}

/* ───────────────────────── Settings ───────────────────────── */

const SETTINGS = { general: 'General', integrations: 'Integrations', model: 'Local model', keys: 'Keyboard' };
/* One setting: what it is called, what it does, and what changes it. */
const setting = (name, about, control) => `<div class="card set"><div class="body"><div class="nm">${name}</div><div class="why">${about}</div></div>${control}</div>`;
const choice = (act, cur, options, about) => `<span class="seg" role="group" aria-label="${about}">${options.map(([to, name]) => `<button class="${to === cur ? 'on' : ''}" data-act="${act}" data-to="${to}">${name}</button>`).join('')}</span>`;

function generalBody() {
  const blocked = window.Notification?.permission === 'denied';
  return `${setting('Theme', 'How Slorp looks. There is one theme for now.', choice('noop', 'slorp', [['slorp', 'Slorp']], 'Theme'))}
    ${setting('Appearance', 'Light, dark, or whichever this computer is set to.', choice('themeTo', state.theme, [['auto', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], 'Appearance'))}
    ${live && window.Notification ? setting('Desktop notifications', `Tells you when something new needs you while this page is out of sight. This browser keeps the choice.${blocked ? ' <b>The browser is blocking notifications for this page.</b>' : ''}`,
      choice('notifyTo', canNotify() ? 'on' : 'off', [['on', 'On'], ['off', 'Off']], 'Desktop notifications')) : ''}
    ${live ? setting('Permission prompts', 'Where a session\'s permission prompt can be answered. Its terminal always asks; with Slorp or terminal, this page can answer too, and whichever you answer first decides.',
      choice('holdTo', settings.answerPermissions ? 'both' : 'terminal', [['both', 'Slorp or terminal'], ['terminal', 'Terminal only']], 'Where permission prompts can be answered')) : ''}
    ${setting('This page', 'Forgets what this browser keeps for the page: what you dismissed or snoozed, what was selected, and choices such as how lists are grouped.',
      `<button class="btn" data-act="reset">Reset</button>`)}`;
}

/* The agents Slorp watches, each with the plugin that lets it be answered from here. */
function agentsBody() {
  const p = plugins.claude, open = agent => live.filter(s => s.agent === agent), wired = agent => open(agent).filter(s => s.canReply).length;
  const running = agent => open(agent).length ? `${wired(agent)} of ${plural(open(agent).length, 'open session')} ${wired(agent) === 1 ? 'is' : 'are'} running it` : 'no open sessions';
  const [word, tone] = !p ? ['checking', 'whenever'] : p.installed && p.enabled ? (p.latest ? ['update available', 'awaiting'] : ['installed', 'blocking']) : p.installed ? ['turned off', 'awaiting'] : ['not installed', 'whenever'];
  const busy = installing || removing || updating;
  const claude = `<div class="card"><span class="glyph" style="${kindColor('claude')};color:var(--k)">C</span>
      <div class="body"><div class="nm">Claude Code <span class="tag ${tone}">${word}</span></div>
      <div class="why">The Slorp mod for Claude Code. With it you can reply to a session and answer its permission prompts from here, and Slorp is told each session's context window, cost and usage limits. Without it sessions are listed and can only be watched.</div>
      <div class="meta">${p && p.version ? `<span>version ${esc(p.version)}</span>` : ''}${p && p.latest ? `<span>${esc(p.latest)} is out</span>` : ''}<span>${running('claude')}</span></div>
      <div class="seen">Sessions already open take up a change after <span class="mono">/reload-plugins</span> or a restart.</div></div>
      <span class="does">${p && !(p.installed && p.enabled) ? `<button class="btn go" data-act="installMod" ${busy ? 'disabled' : ''}>${installing ? (p.installed ? 'Turning it on…' : 'Installing…') : p.installed ? 'Turn on' : 'Install'}</button>` : ''}
        ${p && p.installed && p.latest ? `<button class="btn go" data-act="updateMod" ${busy ? 'disabled' : ''}>${updating ? 'Updating…' : 'Update'}</button>` : ''}
        ${p && p.installed ? `<button class="btn" data-act="uninstallMod" ${busy ? 'disabled' : ''}>${removing ? 'Uninstalling…' : 'Uninstall'}</button>` : ''}</span></div>`;
  const oc = plugins.opencode, connected = open('opencode').filter(s => s.canReply);
  const current = connected.filter(s => s.pluginTui && (oc?.revision ? s.pluginRevision === oc.revision : s.pluginVersion === oc?.version));
  const ocWord = !oc ? 'checking' : oc.error ? 'setup issue' : !oc.installed ? 'not installed' : oc.needsSetup ? 'setup incomplete' : oc.updateAvailable ? 'update available' : current.length ? 'reporting' : connected.length ? 'restart needed' : 'installed';
  const ocButton = (op, label) => `<button class="btn ${op === 'uninstall' ? '' : 'go'}" data-act="opencodePlugin" data-op="${op}" ${opencodeBusy ? 'disabled' : ''}>${opencodeBusy === op ? 'Working…' : label}</button>`;
  const opencode = `<div class="card" data-plugin="opencode"><span class="glyph" style="${kindColor('opencode')};color:var(--k)">O</span>
      <div class="body"><div class="nm">OpenCode <span class="tag ${oc?.error || oc?.needsSetup || oc?.updateAvailable ? 'awaiting' : 'whenever'}">${ocWord}</span></div>
      <div class="why">The Slorp plugin reports sessions, usage, replies and permission prompts. Its terminal companion discovers an opened conversation even before you send a message.</div>
      <div class="meta">${oc?.version ? `<span>version ${esc(oc.version)}</span>` : ''}<span>${running('opencode')}</span>${oc?.source ? `<span>${oc.source === 'managed' ? 'bundled with Slorp' : oc.source === 'file' ? 'single-file installation' : 'local package'}</span>` : ''}</div>
      ${oc?.path ? `<div class="seen mono">${esc(oc.path)}</div>` : ''}
      <div class="seen">${oc?.error ? esc(oc.error) : oc?.source === 'file' ? 'Remove the old single-file plugin from OpenCode before installing this package.' : 'Quit and restart OpenCode after installation or an update. Installation works without a Slorp checkout.'}</div></div>
      <span class="does">${oc && !oc.error ? `${!oc.installed || oc.needsSetup && oc.source !== 'file' ? ocButton('install', oc.installed ? 'Finish setup' : 'Install') : ''}${oc.source === 'managed' && oc.updateAvailable ? ocButton('update', 'Update') : ''}${oc.source === 'managed' && oc.installed ? ocButton('uninstall', 'Uninstall') : ''}` : ''}</span></div>`;
  return claude + opencode;
}

/* How the last health check of the local model went, and whether one is under way. tried is what was typed, when it was that and not what is in use. */
let modelCheck = null, modelChecking = false;
/* Counts changes to the model's saved settings, so that the form then shows what was saved and not what had been typed. */
let modelRev = 0, modelSaved = '';
function checkModel(tried) {
  if (modelChecking) return;
  modelChecking = true;
  fetch('/api/model/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tried ? { model: tried } : {}) })
    .then(async res => { if (!res.ok) throw new Error((await res.text()).trim() || res.status); return res.json(); })
    .then(c => { modelCheck = { ...c, at: Date.now(), tried: !!tried }; })
    .catch(err => { modelCheck = { error: err instanceof TypeError ? 'Could not reach the Slorp service' : err.message, models: [], at: Date.now(), tried: !!tried }; })
    .finally(() => { modelChecking = false; render(); });
  render();
}
/* What the form for choosing the model holds, as settings to save or to try. */
const modelTyped = () => ({ url: $('[data-keep^="model-url"]')?.value.trim() ?? '', name: $('[data-keep^="model-name"]')?.value.trim() ?? '', off: false });
const local = url => { try { return /^(localhost|127\.\d+\.\d+\.\d+|\[::1\])$/.test(new URL(url).hostname); } catch (e) { return true; } };

function checkResult() {
  if (modelChecking) return `<div class="check"><span class="dot running"></span>Checking…</div>`;
  const c = modelCheck;
  if (!c) return '';
  const ms = n => n >= 1000 ? `${(n / 1000).toFixed(1)}s` : `${n}ms`;
  const lines = [
    c.url && [c.reached, c.reached ? `The server at ${c.url} answered, and offers ${c.models.length ? plural(c.models.length, 'model') : 'no models'}.` : `The server at ${c.url} did not answer.`],
    c.model && [c.answered, c.answered ? `${c.model} replied in ${ms(c.millis)}.` : c.error],
    !c.model && c.error && (c.reached || !c.url) && [false, c.reached ? `No model to use: ${c.error}.` : c.error],
  ].filter(Boolean);
  return `<div class="check">${lines.map(([ok, text]) => `<div><span class="dot ${ok ? 'running' : 'error'}"></span>${esc(text)}</div>`).join('')}
    <div class="none">${c.tried ? 'That was what is typed below, not yet saved. ' : ''}Checked ${ago((Date.now() - c.at) / 60000)}. A check sends the model the word "ping" and nothing from any session.</div></div>`;
}

function modelBody() {
  const m = settings.model || {}, s = summarizer, off = !!s.off, saved = JSON.stringify([m.url, m.name]);
  if (saved !== modelSaved) { modelSaved = saved; modelRev++; }
  const [dot, word] = off ? ['idle', 'Off'] : s.model ? ['running', 'Connected'] : s.error ? ['error', 'Not connected'] : ['idle', 'Looking…'];
  const why = off ? (s.fixedUrl ? 'Slorp was started with -llm "", so it runs without a local model.' : 'Slorp is running without a local model.')
    : s.model ? `Using ${s.model}${s.named ? ', which you named' : ', the one the server has loaded'}.`
    : s.error ? (/unreachable/.test(s.error) ? `Nothing answered at ${s.url}.` : `The server at ${s.url} answered, but ${s.error.replace(/^it /, '')}.`) : 'Slorp has not looked yet.';
  const listed = [...new Set((modelCheck?.models || []).concat(s.model || []))];
  const far = !off && s.url && !local(s.url);
  return `<div class="card set"><div class="body"><div class="nm"><span class="stat"><span class="dot ${dot}"></span>${word}</span></div><div class="why">${esc(why)}${off ? '' : ` Slorp looks again every half minute, and at once when these settings change.`}</div></div>
      <button class="btn" data-act="modelCheck" ${modelChecking || off ? 'disabled' : ''}>${modelChecking ? 'Checking…' : 'Check now'}</button></div>
    ${checkResult()}
    ${setting('Local model', s.fixedUrl ? 'Slorp was started with <span class="mono">-llm</span>, which decides this until it is started without.' : 'Off, sessions are shown as they are: no summaries, suggested replies, automatic filing or wrap-ups.',
      s.fixedUrl ? `<span class="none">${off ? 'off' : 'on'}</span>` : choice('modelOff', m.off ? 'off' : 'on', [['on', 'On'], ['off', 'Off']], 'Local model'))}
    <form class="add model" data-form="model">
      <label><span class="nm">Server</span><span class="why">An OpenAI-compatible server, such as LM Studio, Ollama or llama.cpp.${s.fixedUrl ? ' Given with <span class="mono">-llm</span> when Slorp started.' : ''}</span>
        <input name="url" class="mono" data-keep="model-url-${modelRev}" value="${esc(s.fixedUrl ? s.url || '' : m.url || '')}" placeholder="http://localhost:1234" spellcheck="false" autocomplete="off" ${s.fixedUrl ? 'disabled' : ''}></label>
      <label><span class="nm">Model</span><span class="why">Leave empty to use whichever one the server has loaded, so that Slorp never causes another to be loaded.${s.fixedModel ? ' Given with <span class="mono">-model</span> when Slorp started.' : ''}</span>
        <input name="name" class="mono" data-keep="model-name-${modelRev}" list="model-names" value="${esc(s.fixedModel ? s.named || '' : m.name || '')}" placeholder="Whichever is loaded" spellcheck="false" autocomplete="off" ${s.fixedModel ? 'disabled' : ''}>
        <datalist id="model-names">${listed.map(id => `<option value="${esc(id)}"></option>`).join('')}</datalist></label>
      ${far ? `<p class="none warn">${esc(s.url)} is not on this machine. What your sessions say is sent there to be summarized.</p>` : ''}
      <div class="send"><span>Saving takes effect at once.</span>
        <span><button type="button" class="btn" data-act="modelTry" ${modelChecking ? 'disabled' : ''} title="Checks the server and model typed here without saving them">Try without saving</button>
        <button class="btn go" ${s.fixedUrl && s.fixedModel ? 'disabled' : ''}>Save</button></span></div>
    </form>`;
}

const keys = () => [[`1 – ${nav().length}`, nav().map(v => VIEW_NAMES[v] || cap(v)).join(', ')], [',', 'Settings'], ['j  k', `Next and previous in the ${listOf(['Attention', 'Sessions'].concat(pullsOff() ? [] : 'PRs', 'Journal'))} lists`], ['e', 'Dismiss the selected item'], ['s', 'Snooze the selected item for an hour'],
  ['r', 'Fluent or raw'], ['/  ⌘K', 'Search sessions'], ['w', "Today's page of the journal"], ['⌘↵', 'Send what is in a message box'], ['Esc', 'Close a menu, the search, or a rename']];

const SETTINGS_LEDE = {
  general: 'How this page looks and behaves.',
  integrations: 'What Slorp is connected to: the agents whose sessions it watches, and the tools it reads.',
  model: 'Summaries, suggested replies, automatic filing and wrap-ups are written by a model on a server you choose, usually one running on this machine. What your sessions say is sent to that server and nowhere else.',
  keys: 'They work anywhere outside a text box.',
};
function settingsBody(sec) {
  if (sec === 'general') return generalBody();
  if (sec === 'model') return live ? modelBody() : '<div class="none">The demo has no local model to report on.</div>';
  if (sec === 'keys') return `<dl class="facts keys">${keys().map(([k, what]) => `<dt class="mono">${k}</dt><dd>${what}</dd>`).join('')}</dl>`;
  if (!live) return '<div class="none">Integrations belong to the Slorp service, which this demo is not connected to.</div>';
  return `<div class="label">Agents</div>${agentsBody()}
    <div class="label" style="margin-top:34px">Tools</div>
    <p class="lede" style="margin-bottom:10px">Tools Slorp reads, and never changes. While one is on, Slorp checks it every few minutes for things that need you and lists them under Attention, with no model involved. The local model may also look things up in it while it describes a session: it picks from the lookups listed and supplies only a number and, where there are several, which repository.</p>
    ${modelless() ? `<p class="none" style="margin-bottom:10px">${NO_MODEL}, so nothing is looked up while describing a session. Checking for things that need you goes on as before.</p>` : ''}
    ${integrationsBody()}`;
}

function viewSettings() {
  if (!SETTINGS[state.setSel]) state.setSel = 'general';
  const on = Object.values(plugins).filter(p => p.installed && p.enabled).length + integrations.filter(i => i.enabled).length;
  const aside = { integrations: live ? on : '', model: live ? (summarizer.off ? 'off' : summarizer.model ? 'on' : 'none') : '' };
  const nav = Object.entries(SETTINGS).map(([k, name]) => `<button class="${state.setSel === k ? 'on' : ''}" data-act="setSel" data-s="${k}">${name}<span>${aside[k] ?? ''}</span></button>`).join('');
  return `<div class="split narrow">
    <section class="pane list kbnav"><div class="label">Settings</div>${nav}</section>
    <section class="pane detail" data-scroll="set-${state.setSel}"><div class="inner"><h1>${SETTINGS[state.setSel]}</h1><p class="lede">${SETTINGS_LEDE[state.setSel]}</p>${settingsBody(state.setSel)}</div></section>
  </div>`;
}

/* ───────────────────────── Shell ───────────────────────── */

const RENDER = { attention: viewAttention, efforts: viewEfforts, sessions: viewSessions, pulls: viewPulls, journal: viewJournal, knowledge: viewKnowledge, settings: viewSettings };

function render() {
  if (dragged || filing) return;  // a card or a session's row is held: the page is drawn again when it is let go
  if (morph) {
    morph = false;
    if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) { document.startViewTransition(render); return; }
  }
  if (!live) { const order = state.effortOrder || SEED_ORDER; EFFORTS.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id)); }
  const card = document.activeElement?.matches?.('.ecard[data-id]') ? document.activeElement.dataset.id : null;
  const scrolls = {};
  document.querySelectorAll('[data-scroll]').forEach(el => { scrolls[el.dataset.scroll] = el.scrollTop; });
  const drafts = {};
  document.querySelectorAll('[data-keep]').forEach(el => { drafts[el.dataset.keep] = el.value; });
  const focused = document.activeElement?.dataset?.keep, caret = focused && [document.activeElement.selectionStart, document.activeElement.selectionEnd];
  const menuOpen = $('#menu')?.open;
  const acts = $('#acts');
  actsFor = acts?.open ? acts.dataset.id : null;
  actsSub = acts?.open ? acts.querySelector('details[open]')?.dataset.sub || null : null;

  document.documentElement.dataset.theme = state.theme;
  if (state.view === 'pulls' && pullsOff()) { state.view = 'attention'; history.replaceState(place(), '', '#attention'); }
  const main = RENDER[state.view]();  // first: it may settle the selection
  const n = activeItems().length;
  $('#nav').innerHTML = nav().map(v => `<button class="${state.view === v ? 'on' : ''}" data-act="view" data-view="${v}">${VIEW_NAMES[v] || cap(v)}${v === 'attention' && n ? `<span class="count">${n}</span>` : ''}</button>`).join('');
  $('#tools').innerHTML = `
    <span class="model" ${modelless() ? `title="${esc(modelWhy(true))}"` : ''}><span class="dot ${live && isOffline ? 'error' : modelless() ? 'idle' : 'running'}"></span>${live ? (isOffline ? 'service offline' : `live · ${summarizer.model ? summarizer.model.split('/').pop() : 'no local model'}`) : 'qwen3:14b · local · caught up'}</span>${live ? usageTotal() + limitMeters() : ''}
    <span class="seg" role="group" aria-label="Voice" title="Fluent shows what the model wrote. Raw shows what the sources said. (r)">
      <button class="${state.fluent ? 'on' : ''}" data-act="fluent" data-on="1">Fluent</button><button class="${state.fluent ? '' : 'on'}" data-act="fluent" data-on="0">Raw</button></span>
    ${live ? `<button class="icon" data-act="searchOpen" title="Search sessions (/ or ⌘K)" aria-label="Search sessions">⌕</button>` : ''}
    <button class="icon" data-act="theme" title="Light or dark" aria-label="Toggle theme">◐</button>
    <button class="icon ${state.view === 'settings' ? 'on' : ''}" data-act="view" data-view="settings" title="Settings (,)" aria-label="Settings">⚙</button>
    ${live ? '' : `<details class="menu" id="menu" ${menuOpen ? 'open' : ''}><summary class="icon" title="Demo controls" aria-label="Demo controls">⋯</summary>
      <div class="pop"><p>Demo controls</p>
        <button data-act="simulate">Simulate an incoming item</button>
        <button data-act="reset">Reset the demo</button></div></details>`}`;
  const notices = [modNotice(), modelNotice()].filter(Boolean);
  document.documentElement.style.setProperty('--notice', `${44 * notices.length}px`);
  $('#notice').innerHTML = notices.join('');
  $('#main').innerHTML = main;
  $('#modal').innerHTML = modal === 'search' ? searchModal() : modal === 'start' ? startModal() : modal === 'effortDelete' ? deleteModal() : modal === 'effortMerge' ? mergeModal() : '';
  if (modalFocus) { modalFocus = false; $('#q, #modal [data-first]')?.focus(); }
  // The toggle shows only where there is more of what the user said to see.
  document.querySelectorAll('.said').forEach(el => {
    const tx = el.querySelector('.tx');
    el.querySelector('button').hidden = !el.classList.contains('open') && tx.scrollHeight <= tx.clientHeight + 1;
  });

  document.querySelectorAll('[data-scroll]').forEach(el => { if (scrolls[el.dataset.scroll]) el.scrollTop = scrolls[el.dataset.scroll]; });
  document.querySelectorAll('[data-keep]').forEach(el => {
    if (el.dataset.keep in drafts) el.value = drafts[el.dataset.keep];
    if (el.dataset.keep === focused) { el.focus(); if (el.setSelectionRange && caret[0] != null) el.setSelectionRange(caret[0], caret[1]); }
  });
  if (renameFocus) { renameFocus = false; $('.rename input')?.focus(); $('.rename input')?.select(); }
  if (card) document.querySelector(`.ecard[data-id="${CSS.escape(card)}"]`)?.focus({ preventScroll: true });
  if (editFocus) { editFocus = false; $('.eedit input')?.focus(); $('.eedit input')?.select(); }
  if (addFocus) { addFocus = false; $('.ecard.mini.new input')?.focus(); }
  if (reveal) { reveal = false; $('.ecard.sel')?.scrollIntoView({ block: 'nearest' }); }
  freshId = null;
}

const actions = {
  subRetry: d => { delete subDocs[d.id]; },
  view: d => visit(d.view),
  select: d => { state.sel = d.id; },
  group: d => { state.groupBy = d.by; },
  rows: d => { state.rows = d.as; },
  liveMoveTo: d => changes.liveMove(d, { value: d.to }),
  liveRoleTo: d => changes.liveRole(d, { value: d.to }),
  repoMoveTo: d => changes.repoMove(d, { value: d.to }),
  moveTo: d => changes.move(d, { value: d.to }),
  srcFilter: d => { state.srcFilter = d.src; },
  collapse: d => { state.collapsed[d.key] = !state.collapsed[d.key]; },
  noop: () => false,
  searchOpen: () => { openSearch(); },
  hitOpen: d => { openHit(hits[+d.i]); return false; },
  modalClose: () => { modal = null; },
  wrapOpen: () => { openToday(); },
  wrapAsk: d => { api('POST', `/api/journal/${d.day}`, {}); return false; },
  journalSel: d => { state.journalSel = d.id; },
  journalTag: d => { journalTag = d.only || journalTag !== d.tag ? d.tag : ''; },
  journalClear: () => { clearJournalSearch(); },
  journalSession: d => { state.actSel = d.id; delete state.collapsed[live.some(s => s.id === d.id) ? 'act:active' : 'act:closed']; go('sessions'); },
  tagOff: d => { tagDay(d.day, d.tag, false); return !live; },
  wrapCopy: d => {
    Promise.resolve().then(() => navigator.clipboard.writeText(wrapupMarkdown(entryOf(d.day))))
      .then(() => toast('Copied')).catch(() => toast('The browser would not let Slorp copy that'));
    return false;
  },
  fill: d => {
    const ta = document.querySelector(`textarea[data-keep="${d.box}"]`);
    ta.value = d.text; ta.focus();
    return false;
  },
  rename: d => { renaming = d.id; renameFocus = true; },
  renameCancel: () => { renaming = null; },
  side: () => { state.sideShut = !state.sideShut; },
  fluent: d => { state.fluent = d.on === '1'; },
  themeTo: d => { state.theme = d.to; },
  setSel: d => { state.setSel = d.s; },
  modelCheck: () => { checkModel(); return false; },
  modelTry: () => { checkModel(modelTyped()); return false; },
  modelOff: d => { api('POST', '/api/settings', { model: { off: d.to === 'off' } }, () => { modelCheck = null; }); return false; },
  setGo: d => { state.setSel = d.s; go('settings'); },
  theme: () => {
    const dark = state.theme === 'dark' || (state.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    state.theme = dark ? 'light' : 'dark';
  },
  reply: d => resolve(d.id, 'answered', d.text),
  send: d => {
    const ta = $('#reply'), text = ta.value.trim();
    if (!text) { ta.focus(); return false; }
    ta.value = '';
    resolve(d.id, 'answered', text);
  },
  dismiss: d => resolve(d.id, 'dismissed'),
  snooze: d => {
    const until = new Date();
    if (d.for === 'tomorrow') { until.setDate(until.getDate() + 1); until.setHours(9, 0, 0, 0); } else until.setHours(until.getHours() + 1);
    const note = d.for === 'tomorrow' ? 'until tomorrow at 9:00' : `until ${until.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    resolve(d.id, 'snoozed', note, { until: until.getTime() });
  },
  park: d => {
    const it = itemById(d.id), qid = 'q' + (++state.seq);
    state.kb.questions.unshift({ id: qid, text: it.title, effort: effortOf(it) === 'unsorted' ? 'slorp' : effortOf(it), age: 0, origin: `parked from a ${it.src.toLowerCase()}` });
    resolve(d.id, 'parked', '', { msg: 'Parked as an open question', undo: () => { state.kb.questions = state.kb.questions.filter(q => q.id !== qid); } });
  },
  route: d => {
    const it = itemById(d.id), name = effortById(d.effort).name;
    state.moved[it.id] = d.effort;
    if (it.session) state.sessMoved[it.session] = d.effort;
    resolve(d.id, 'filed', '', { msg: `Filed under ${name}`, undo: () => { delete state.moved[it.id]; delete state.sessMoved[it.session]; } });
  },
  restore: d => { delete state.handled[d.id]; state.sel = d.id; },
  toggleHandled: () => { state.showHandled = !state.showHandled; },
  toggleRaw: d => { state.rawOpen[d.id] = !(state.rawOpen[d.id] ?? !state.fluent); },
  rephrase: d => {
    $('#summary').classList.add('thinking');  // stand-in for local model latency
    setTimeout(() => { state.variant[d.id] = (state.variant[d.id] || 0) + 1; save(); render(); }, 650);
    return false;
  },
  effort: d => openEffort(d.id),
  effortBoard: () => openEffort(null),
  openItem: d => { state.sel = d.id; go('attention'); },
  modelNoticeOff: () => { state.modelNoticeOff = true; },
  installMod: () => {
    if (installing || updating) return false;
    installing = true;
    ask('/api/plugins/claude', {}, () => toast('Done. Sessions already open pick it up after /reload-plugins or a restart.'), () => { installing = false; });
  },
  opencodePlugin: d => {
    if (opencodeBusy) return false;
    if (d.op === 'uninstall') toast('Uninstall the Slorp plugin from OpenCode?', () => changeOpenCodePlugin('uninstall'), 'Uninstall');
    else changeOpenCodePlugin(d.op);
    return false;
  },
  updateMod: () => {
    if (installing || removing || updating) return false;
    updating = true;
    ask('/api/plugins/claude/update', {}, () => toast('Updated. Sessions already open pick it up after /reload-plugins or a restart.'), () => { updating = false; });
  },
  modPass: d => { state.modPassed = d.v; },
  uninstallMod: () => {
    if (installing || removing || updating) return false;
    toast('Uninstall the Slorp mod from Claude Code? Its sessions could then only be watched.', () => {
      removing = true;
      fetch('/api/plugins/claude', { method: 'DELETE' })
        .then(async res => { if (!res.ok) throw new Error((await res.text()).trim() || res.status); toast('Uninstalled. Sessions already open keep it until /reload-plugins or a restart.'); })
        .catch(err => toast(err instanceof TypeError ? 'Could not reach the Slorp service' : `That did not work: ${err.message}`))
        .finally(() => { removing = false; refresh(true); });
    }, 'Uninstall');
    return false;
  },
  expand: d => { state.expanded[d.id] = !state.expanded[d.id]; },
  actSel: d => { state.actSel = d.id; },
  openSession: d => { state.actSel = d.id; go('sessions'); },
  pullSel: d => { state.pullSel = d.id; },
  pullOpen: d => { state.pullSel = d.id; go('pulls'); },
  pullTab: d => { state.pullTab = d.t; },
  backfill: d => {
    if (historyReading.has(d.id)) return false;
    historyReading.add(d.id);
    render();
    fetch(`/api/sessions/${encodeURIComponent(d.id)}/backfill`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })
      .then(async res => {
        if (!res.ok) throw new Error((await res.text()).trim() || res.status);
        const r = await res.json();
        toast(r.queued ? `Read ${plural(r.exchanges, 'exchange')}; the local model will fill in ${num(r.queued)}` : `Read ${plural(r.exchanges, 'exchange')}; nothing was left to fill in`);
      }).catch(err => toast(err instanceof TypeError ? 'Could not reach the Slorp service' : `Could not fill it in: ${err.message}`))
      .finally(() => { historyReading.delete(d.id); refresh(true); });
    return false;
  },
  copyText: d => {
    Promise.resolve().then(() => navigator.clipboard.writeText(d.text)).then(() => toast('Copied')).catch(() => toast('The browser would not let Slorp copy that'));
    return false;
  },
  detailTab: d => { state.detailTab = d.t; },
  effortTab: d => { state.effortTab = d.t; },
  sourceRaw: d => { state.sourceRaw = d.on === '1'; },
  copyReply: d => {
    const text = (live.find(x => x.id === d.id) || {}).lastReply || '';
    Promise.resolve().then(() => navigator.clipboard.writeText(text))
      .then(() => toast(text.startsWith('…') ? 'Copied. It was longer than Slorp keeps, so it starts part-way' : 'Copied'))
      .catch(() => toast('The browser would not let Slorp copy that'));
    return false;
  },
  pullFilter: d => { state.pullFilter = d.f; },
  kbSel: d => { state.kbSel = d.s; },
  kbGo: d => { state.kbSel = d.s; go('knowledge'); },
  kbRemove: d => {
    if (live) { api('DELETE', `/api/kb/${d.sec}/${d.id}`, null, () => toast('Removed')); return false; }
    const list = state.kb[d.sec], i = list.findIndex(x => x.id === d.id), gone = list.splice(i, 1)[0];
    toast('Removed', () => { state.kb[d.sec].splice(i, 0, gone); });
  },
  livePark: d => {
    const it = itemById(d.id);
    api('POST', '/api/kb/questions', { text: it.feed ? it.title : it.ask || it.title, effort: it.effort === 'unsorted' ? '' : it.effort, origin: `parked from "${it.title}"` },
      () => { resolve(d.id, 'parked'); toast('Parked as an open question'); save(); });
    return false;
  },
  pick: d => {
    const all = state.picks[d.id] ||= {}, mine = all[d.q] || [], o = Number(d.o);
    all[d.q] = d.many === '1' ? (mine.includes(o) ? mine.filter(x => x !== o) : mine.concat(o)) : [o];
    if (d.many !== '1') {
      if (all.custom) delete all.custom[d.q];
      const input = document.querySelector(`[data-keep="answer-${d.id}-${d.q}"]`);
      if (input) input.value = '';
    }
  },
  liveAnswer: d => {
    const s = live.find(x => x.pending && x.pending.id === d.id), qs = s && askedQuestions(s.pending);
    if (!qs) return false;
    const selections = selectionsFor(s.pending, qs);
    const body = s.pending.ordered ? { selections } : { answers: Object.fromEntries(qs.map((q, n) => [q.question, selections[n]])) };
    fetch(`/api/permissions/${d.id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(res => {
        toast(res.status === 409 ? 'That question is no longer waiting here' : !res.ok ? 'Slorp refused that' : 'Answered');
        delete state.picks[d.id];
        save(); refresh(true);
      })
      .catch(() => toast('Could not reach the Slorp service'));
    return false;
  },
  livePermit: d => {
    const note = document.querySelector(`textarea[data-keep="deny-${d.id}"]`);
    fetch(`/api/permissions/${d.id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ behavior: d.behavior, message: d.behavior === 'deny' && note ? note.value.trim() : '' }) })
      .then(res => {
        toast(res.status === 409 ? 'That request is no longer waiting here' : !res.ok ? 'Slorp refused that' : { allow: 'Allowed', deny: 'Denied' }[d.behavior]);
        refresh(true);
      })
      .catch(() => toast('Could not reach the Slorp service'));
    return false;
  },
  feedCheck: () => { api('POST', '/api/feed/check', {}, () => toast('Checking now')); return false; },
  integrationToggle: d => { api('POST', `/api/integrations/${d.id}`, { enabled: d.on === '1' }); return false; },
  notifyTo: d => {
    if (d.to === 'off') { state.notify = false; return; }
    if (canNotify()) return false;
    Notification.requestPermission().then(answer => {
      state.notify = answer === 'granted';
      toast(state.notify ? 'Slorp will notify you while this page is out of sight' : 'The browser is blocking notifications for this page');
      save(); render();
    });
    return false;
  },
  holdTo: d => { api('POST', '/api/settings', { answerPermissions: d.to === 'both' }); return false; },
  startOpen: d => { openStart(d.id); },
  startWith: d => { startWith = d.to; },
  startThinking: d => { startThinking = !!d.to; },
  stop: d => {
    const s = live.find(x => x.id === d.id);
    toast(`Stop "${clip(s ? s.label : d.id, 50)}"? Its conversation is kept.`, () => { ask(`/api/sessions/${d.id}/stop`, {}, () => toast('Stopped. Reopen it from the closed sessions under Sessions.')); }, 'Stop');
    return false;
  },
  reopen: d => { ask(`/api/archive/${d.id}/resume`, {}, () => toast('Reopened in the background')); return false; },
  effortEdit: d => { editing = d.id; editFocus = true; editColor = effortColor(effortById(d.id)); },
  editColor: d => { editColor = d.c; },
  effortMergeTo: d => { modal = 'effortMerge'; modalId = d.id; modalInto = d.to; },
  effortMergeYes: d => {
    const name = effortById(d.id).name, into = effortById(d.to).name;
    modal = null;
    api('POST', `/api/efforts/${d.id}/merge`, { into: d.to }, () => { if (state.effortSel === d.id) state.effortSel = d.to; save(); toast(`Merged ${name} into ${into}`); });
  },
  effortEditCancel: () => { editing = null; },
  effortAdd: () => { adding = addFocus = true; },
  effortAddCancel: () => { adding = false; },
  shelf: () => { state.shelfOpen = !state.shelfOpen; },
  journalOpen: d => { state.journalSel = d.id; go('journal'); },
  effortShelve: d => {
    const name = effortById(d.id).name, on = d.to === '1';
    modal = null;
    api('POST', `/api/efforts/${d.id}`, { shelved: on }, () => toast(on ? `Shelved ${name}` : `${name} is back on the board`, () => { api('POST', `/api/efforts/${d.id}`, { shelved: !on }); }));
  },
  effortDelete: d => { modal = 'effortDelete'; modalId = d.id; },
  effortDeleteYes: d => {
    const name = effortById(d.id).name;
    modal = null;
    api('DELETE', `/api/efforts/${d.id}`, null, () => toast(`Deleted ${name}`));
  },
  dirRemove: d => {
    api('DELETE', `/api/efforts/${d.id}/dirs`, { dir: d.dir }, () => toast(`${shortPath(d.dir)} no longer files here`, () => { api('POST', `/api/efforts/${d.id}/dirs`, { dir: d.dir }); }));
    return false;
  },
  liveSuggest: d => {
    const ta = document.querySelector(`textarea[data-keep="item-${d.id}"]`);
    ta.value = d.text; ta.focus();
    return false;
  },
  liveItemSend: d => {
    const ta = document.querySelector(`textarea[data-keep="item-${d.id}"]`), text = ta.value.trim(), it = itemById(d.id);
    if (!text) { ta.focus(); return false; }
    sendReply(it.session.id, text, () => { ta.value = ''; resolve(d.id, 'answered', text); toast('Sent to the session'); save(); render(); });
    return false;
  },
  liveSend: d => {
    const ta = document.querySelector(`textarea[data-keep="live-${d.id}"]`), text = ta.value.trim();
    if (!text) { ta.focus(); return false; }
    sendReply(d.id, text, () => { ta.value = ''; toast('Queued for the session'); refresh(true); });
    return false;
  },
  simulate: () => {
    const next = POOL.find(p => !state.extra.includes(p.id));
    if (!next) { toast('No more canned items. Reset the demo to replay them.'); return false; }
    state.extra.push(next.id);
    state.arrived[next.id] = Date.now();
    freshId = next.id;
    toast(`New in ${effortById(next.effort).name}: ${next.title}`);
  },
  reset: () => {
    const wipe = () => { const { view, theme, setSel } = state; state = Object.assign(fresh(), { view, theme, setSel }); };
    if (!live) { wipe(); toast('Demo reset'); return; }
    toast('Forget what this browser keeps for the page?', wipe, 'Reset');
    return false;
  },
};
const changes = {
  liveMove: (d, el) => {
    const to = el.value, s = live.find(x => x.id === d.id);
    if (!to) return false;
    if (to === '__new') { openEffort(null); return; }
    const effort = to === 'unsorted' ? '' : to;
    api('POST', `/api/sessions/${d.id}/effort`, { effort }, () => {
      if (effort) toast(`Filed under ${effortById(effort).name}`, () => { api('POST', `/api/efforts/${effort}/dirs`, { dir: s.cwd }); }, `Always file ${shortPath(s.cwd)} here`);
      else toast('Left unsorted');
    });
    return false;
  },
  liveRole: (d, el) => {
    const to = el.value;
    if (!to) return false;
    if (to === '__new') { state.kbSel = 'roles'; go('knowledge'); return; }
    const role = to === '__none' ? '' : to;
    api('POST', `/api/sessions/${d.id}/role`, { role }, () => toast(role ? `Marked as ${roleById(role).name}` : 'No role'));
    return false;
  },
  roleAttention: (d, el) => { api('POST', `/api/roles/${d.id}`, { attention: el.value }); return false; },
  repoMove: (d, el) => {
    const to = el.value, it = itemById(d.id);
    if (!to) return false;
    if (to === '__new') { openEffort(null); return; }
    api('POST', '/api/repos/effort', { repo: it.repo, effort: to === 'unsorted' ? '' : to },
      () => toast(to === 'unsorted' ? `${it.repo} left unsorted` : `Everything from ${it.repo} now files under ${effortById(to).name}`));
    return false;
  },
  move: (d, el) => {
    if (!el.value) return false;
    const prev = state.moved[d.id];
    state.moved[d.id] = el.value;
    toast(`Moved to ${effortById(el.value).name}`, () => { if (prev) state.moved[d.id] = prev; else delete state.moved[d.id]; });
  },
  kbResolve: d => {
    if (live) { api('DELETE', `/api/kb/questions/${d.id}`, null, () => toast('Resolved')); return false; }
    const i = state.kb.questions.findIndex(q => q.id === d.id), gone = state.kb.questions.splice(i, 1)[0];
    toast('Resolved', () => { state.kb.questions.splice(i, 0, gone); });
  },
};

document.addEventListener('click', e => {
  if (!e.target.closest('#menu')) $('#menu')?.removeAttribute('open');
  /* An item's menu shuts on a click outside it, and once something in it is chosen. */
  if (!e.target.closest('#acts') || e.target.closest('#acts [data-act]')) $('#acts')?.removeAttribute('open');
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (actions[el.dataset.act](el.dataset, el) !== false) { save(); render(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.questionCustom) {
    const d = e.target.dataset, picks = state.picks[d.questionCustom] ||= {};
    (picks.custom ||= {})[d.q] = e.target.value;
    if (d.many !== '1' && e.target.value.trim()) picks[d.q] = [];
    save(); render();
    return;
  }
  if (e.target.id === 'jq') {
    journalQuery = e.target.value;
    clearTimeout(journalTimer);
    journalTimer = setTimeout(runJournalSearch, 120);
    return;
  }
  if (e.target.id !== 'q') return;
  query = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(runSearch, 120);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change](el.dataset, el) !== false) { save(); render(); }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const f = Object.fromEntries(new FormData(form)), sec = form.dataset.form, id = sec[0] + (++state.seq);
  const clear = () => form.querySelectorAll('input').forEach(el => { el.value = ''; });
  if (sec === 'name') { api('POST', `/api/sessions/${form.dataset.id}/name`, { name: f.name }); renaming = null; render(); return; }
  if (sec === 'effort') {
    /* Added from the column, the new effort is opened; added from the board, its card joins the others. */
    const had = new Set(liveEfforts.map(e => e.id)), beside = !!state.effortSel;
    fetch('/api/efforts', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: f.name, about: f.about }) })
      .then(async res => {
        if (!res.ok) throw new Error((await res.text()).trim() || res.status);
        clear(); adding = false;
        await refresh(true);
        const made = liveEfforts.find(e => !had.has(e.id));
        if (beside && made && state.view === 'efforts' && state.effortSel) { openEffort(made.id); save(); render(); }
      }).catch(err => toast(err instanceof TypeError ? 'Could not reach the Slorp service' : `That did not work: ${err.message}`));
    return;
  }
  if (sec === 'effortEdit') { api('POST', `/api/efforts/${form.dataset.id}`, { name: f.name, about: f.about, color: f.color, glyph: f.glyph }); editing = null; render(); return; }
  if (sec === 'tag') { tagDay(form.dataset.id, f.tag, true); clear(); if (!live) render(); return; }
  if (sec === 'model') {
    const typed = modelTyped(), chosen = { ...(summarizer.fixedUrl ? {} : { url: typed.url }), ...(summarizer.fixedModel ? {} : { name: typed.name }) };
    ask('/api/settings', { model: chosen }, () => {
      form.querySelectorAll('[data-keep]').forEach(el => el.removeAttribute('data-keep'));
      toast('Saved'); modelCheck = null;
      if (!summarizer.off) checkModel();
    });
    return;
  }
  if (sec === 'start') {
    if (launching) return;
    const effort = form.dataset.id === 'unsorted' ? '' : form.dataset.id;
    launching = true;
    const local = startWith === 'local', opts = local ? { engine: 'local', thinking: startThinking, temperature: f.temperature ?? '' } : { engine: 'claude', model: f.model || '', effortLevel: f.effortLevel || '' };
    const runs = local ? { local: { thinking: opts.thinking, temperature: opts.temperature === '' ? null : +opts.temperature } } : { model: opts.model, effortLevel: opts.effortLevel };
    ask('/api/sessions', { dir: f.dir, name: f.name, prompt: f.prompt, role: f.role || '', effort, ...runs }, () => {
      if (modal === 'start') modal = null;
      state.startOpts = { ...state.startOpts, ...opts }; save();
      toast('Started. It will show up here in a moment.');
    }, () => { launching = false; render(); });
    render();
    return;
  }
  if (live) { api('POST', `/api/kb/${sec}`, { ...f, origin: 'you wrote this down' }); clear(); return; }
  if (sec === 'watch') state.kb.watch.push({ id, type: f.type, name: f.name, why: f.why, efforts: [f.effort], cadence: 'daily', seen: '', seenAge: 0 });
  else if (sec === 'questions') state.kb.questions.unshift({ id, text: f.text, effort: f.effort, age: 0, origin: 'you wrote this down' });
  else state.kb[sec].push({ id, text: f.text });
  save(); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && e.target.closest('.rename')) { renaming = null; render(); return; }
  if (e.key === 'Escape' && e.target.closest('.eedit, .ecard.mini.new')) { editing = null; adding = false; render(); return; }
  if (e.key === 'Escape' && modal) { modal = null; render(); return; }
  if (e.key === 'Escape' && $('#acts')?.open) { $('#acts').removeAttribute('open'); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k' && live) { e.preventDefault(); openSearch(); render(); return; }
  /* ⌘↵ in a message box presses the button that sends it. */
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.tagName === 'TEXTAREA') {
    const form = e.target.closest('form[data-form="start"]');
    if (form) { e.preventDefault(); form.requestSubmit(); return; }
    const bar = e.target.nextElementSibling;
    const send = bar?.matches('.send') && [...bar.querySelectorAll('button')].pop();
    if (send) { e.preventDefault(); send.click(); }
    return;
  }
  if (modal === 'search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter')) {
    e.preventDefault();
    if (e.key === 'Enter') { openHit(hits[hitSel]); return; }
    hitSel = Math.max(0, Math.min(hits.length - 1, hitSel + (e.key === 'ArrowDown' ? 1 : -1)));
    render();
    $('.hit.sel')?.scrollIntoView({ block: 'nearest' });
    return;
  }
  if (modal || e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const att = state.view === 'attention', card = e.target.matches?.('.ecard[data-id]') ? e.target : null;
  if (card && (e.key === 'Enter' || e.key === ' ')) openEffort(card.dataset.id);
  else if (card && card.draggable && e.shiftKey && /^Arrow/.test(e.key)) {
    const shown = [...card.parentNode.querySelectorAll('.ecard[draggable]')], i = shown.indexOf(card), back = e.key === 'ArrowLeft' || e.key === 'ArrowUp';
    if (back ? i > 0 : i < shown.length - 1) moveEffort(card.dataset.id, back ? shown[i - 1].dataset.id : shown[i + 2]?.dataset.id || '');
  }
  else if (e.key === 'Escape' && state.view === 'efforts' && state.effortSel) openEffort(null);
  else if (/^[1-9]$/.test(e.key) && nav()[e.key - 1]) visit(nav()[e.key - 1]);
  else if (e.key === ',') go('settings');
  else if (e.key === 'r') state.fluent = !state.fluent;
  else if (e.key === 'w') openToday();
  else if (e.key === '/' && live) openSearch();
  else if (att && (e.key === 'j' || e.key === 'k')) {
    const order = visibleOrder(), i = order.indexOf(state.sel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.sel = order[i];
  }
  else if (state.view === 'sessions' && (e.key === 'j' || e.key === 'k')) {
    const order = actShown(...(live ? liveSessions() : mockSessions())).map(x => x.id), i = order.indexOf(state.actSel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.actSel = order[i];
  } else if (state.view === 'pulls' && (e.key === 'j' || e.key === 'k')) {
    const order = pullsShown().map(pullKey), i = order.indexOf(state.pullSel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.pullSel = order[i];
  } else if (state.view === 'efforts' && state.effortSel && (e.key === 'j' || e.key === 'k')) {
    const order = cardEfforts().map(x => x.id), i = order.indexOf(state.effortSel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) openEffort(order[i]);
  } else if (state.view === 'journal' && (e.key === 'j' || e.key === 'k')) {
    const order = journalShown().map(d => d.day), i = order.indexOf(state.journalSel) + (e.key === 'j' ? 1 : -1);
    if (order[i]) state.journalSel = order[i];
  }
  else if (att && state.sel && e.key === 'e') actions.dismiss({ id: state.sel });
  else if (att && state.sel && e.key === 's') actions.snooze({ id: state.sel, for: 'hour' });
  else return;
  e.preventDefault();
  save(); render();
  $('.row.sel')?.scrollIntoView({ block: 'nearest' });
});
window.addEventListener('popstate', () => {
  const v = location.hash.slice(1);
  if (!VIEWS.includes(v)) return;
  morph = v === 'efforts' && state.view === v;
  Object.assign(state, history.state, { view: v });
  save(); render();
});

state.view = viewNamed(location.hash.slice(1)) || state.view;
history.replaceState(null, '', '#' + state.view);
render();
connect();
</script>
